  <!-- Script Firebase -->
<script type="module">
  import { db } from './app.js';
  import { ref, push, set, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

  // ====== ELEMEN UTAMA ======
  const pembinaSelect = document.getElementById('pembina');
  const modal = document.getElementById('modalPegawai');
  const btnTambah = document.getElementById('btnTambahPegawai');
  const btnSimpan = document.getElementById('btnSimpanPegawai');
  const btnClose = document.getElementById('closeModal');
  const namaInput = document.getElementById('namaPegawai');
  const gelarInput = document.getElementById('gelarPegawai');
  const tableBody = document.getElementById('pegawaiTableBody');
  const modalTitle = document.getElementById('modalTitle');

  let pegawaiList = [];
  let editId = null; // mode edit atau tambah

  // ====== MODAL ======
  btnTambah.addEventListener('click', () => {
    modal.style.display = 'flex';
    modalTitle.textContent = 'Tambah Pegawai';
    btnSimpan.textContent = 'Simpan';
    editId = null;
    namaInput.value = '';
    gelarInput.value = '';
  });

  btnClose.addEventListener('click', () => {
    modal.style.display = 'none';
  });

  // ====== SIMPAN / UPDATE DATA PEGAWAI ======
  btnSimpan.addEventListener('click', () => {
    const nama = namaInput.value.trim();
    const gelar = gelarInput.value.trim();

    if (!nama) {
      alert('Nama tidak boleh kosong!');
      return;
    }

    if (editId) {
      // Mode edit
      const updateRef = ref(db, 'pegawai/' + editId);
      update(updateRef, { nama, gelar })
        .then(() => {
          alert('✏️ Data berhasil diperbarui!');
          modal.style.display = 'none';
        })
        .catch(err => alert('Gagal update: ' + err.message));
    } else {
      // Mode tambah
      const pegawaiRef = ref(db, 'pegawai');
      const newRef = push(pegawaiRef);
      set(newRef, { nama, gelar })
        .then(() => {
          alert('✅ Pegawai berhasil ditambahkan!');
          modal.style.display = 'none';
        })
        .catch(err => alert('Gagal simpan: ' + err.message));
    }
  });

  // ====== LIST DATA PEGAWAI REALTIME ======
  const dataRef = ref(db, 'pegawai');
  onValue(dataRef, (snapshot) => {
    tableBody.innerHTML = '';
    pembinaSelect.innerHTML = `<option value="">-- Pilih Pembina --</option>`;
    pegawaiList = [];

    let no = 1;
    snapshot.forEach(child => {
      const data = child.val();
      const id = child.key;
      pegawaiList.push(data.gelar ? `${data.gelar} ${data.nama}` : data.nama);

      // Tabel
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${no++}</td>
        <td>${data.nama}</td>
        <td>${data.gelar || '-'}</td>
        <td>
          <button class="action-btn edit-btn" data-id="${id}">✏️</button>
          <button class="action-btn delete-btn" data-id="${id}">🗑️</button>
        </td>
      `;
      tableBody.appendChild(tr);

      // Pilihan dropdown pembina
      const opt = document.createElement('option');
      opt.value = data.gelar ? `${data.gelar} ${data.nama}` : data.nama;
      opt.textContent = opt.value;
      pembinaSelect.appendChild(opt);
    });

    // Event edit
    document.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        const data = snapshot.child(id).val();
        editId = id;
        namaInput.value = data.nama;
        gelarInput.value = data.gelar || '';
        modalTitle.textContent = 'Edit Pegawai';
        btnSimpan.textContent = 'Update';
        modal.style.display = 'flex';
      });
    });

    // Event delete
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        if (confirm('Apakah yakin ingin menghapus data ini?')) {
          remove(ref(db, 'pegawai/' + id))
            .then(() => alert('🗑️ Data berhasil dihapus!'))
            .catch(err => alert('Gagal hapus: ' + err.message));
        }
      });
    });
  });

  // ====== SIMPAN JADWAL ======
  document.getElementById('btnSimpanJadwal').addEventListener('click', () => {
    const tanggal = document.getElementById('jadwalTanggal').value;
    const dressCode = document.getElementById('dressCode').value;
    const pembina = pembinaSelect.value;

    if (!tanggal || !dressCode || !pembina) {
      alert('Mohon lengkapi semua data utama!');
      return;
    }

    const dataJadwal = {
      tanggal,
      dressCode,
      pembina,
      dibuatPada: new Date().toISOString()
    };

    const jadwalRef = ref(db, 'jadwal');
    const newJadwal = push(jadwalRef);
    set(newJadwal, dataJadwal)
      .then(() => {
        alert('✅ Jadwal berhasil disimpan!');
        window.location.href = 'hasil-jadwal.html';
      })
      .catch(err => alert('❌ Gagal menyimpan jadwal: ' + err.message));
  });
</script>
</body>
