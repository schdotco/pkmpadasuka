<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Data Pegawai</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - Data & Informasi UPTD Puskesmas Padasuka</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f6fa; }
    h2 { margin-bottom: 20px; }
    button { padding: 8px 12px; background: #4CAF50; color: white; border: none; cursor: pointer; border-radius: 4px; }
    button:hover { background: #45a049; }

    table { width: 100%; border-collapse: collapse; background: white; margin-top: 15px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #f0f0f0; }

    .action-btn {
      border: none; cursor: pointer; padding: 6px 8px; border-radius: 4px; margin-right: 5px;
    }
    .edit-btn { background: #2196F3; color: white; }
    .delete-btn { background: #f44336; color: white; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center; align-items: center;
    }
    .modal-content {
      background: white;
      padding: 20px;
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f9;
    }

    /* NAVBAR */
    .navbar {
      background: #1976d2;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
    }
    .navbar h1 {
      font-size: 18px;
      margin: 0;
    }
    .navbar .menu {
      display: flex;
      gap: 15px;
    }
    .navbar .menu a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
    }
    .navbar .menu a:hover {
      text-decoration: underline;
    }
    .navbar button {
      background: #fff;
      color: #1976d2;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    /* DASHBOARD */
    .dashboard {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 15px;
    }
    .dashboard h2 {
      font-size: 20px;
      color: #333;
      margin-bottom: 20px;
    }

    /* CARD GRID */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      width: 300px;
      position: relative;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      transition: transform 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
    }
    .card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
    }
    .card-content {
      padding: 15px;
    }
    .card h3 {
      font-size: 16px;
      color: #1976d2;
      margin: 0 0 8px 0;
    }
    .modal-content h3 { margin-top: 0; }
    .modal-content input {
      width: 100%; padding: 8px; margin: 8px 0;
      border: 1px solid #ccc; border-radius: 4px;
    .card p {
      font-size: 13px;
      color: #555;
      margin: 0;
    }
    .close {
      position: absolute;
      right: 15px; top: 10px;
      cursor: pointer; font-size: 18px; font-weight: bold;
    .card button {
      background: #1976d2;
      color: #fff;
      border: none;
      padding: 10px;
      font-size: 13px;
      cursor: pointer;
      width: 100%;
      margin-top: auto;
    }
    .card button:hover {
      background: #125ca1;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <h1>🏛️ Data & Informasi UPTD Puskesmas Padasuka</h1>
    <div class="menu">
      <a href="dashboard.html">Dashboard</a>
      <a href="profil.html">Profil</a>
      <a href="pegawai.html">Pegawai</a>
      <a href="#">Kehadiran</a>
    </div>
     <button onclick="logout()">Logout</button>
  </div>
<body>

  <h2>📋 Daftar Pegawai</h2>
  <button id="btnTambahPegawai">+ Tambah Pegawai</button>

  <table>
    <thead>
      <tr>
        <th>No</th>
        <th>Nama Lengkap</th>
        <th>Gelar</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody id="pegawaiTableBody">
      <!-- Data dari Firebase akan muncul di sini -->
    </tbody>
  </table>

  <!-- Modal Form -->
  <div id="modalPegawai" class="modal">
    <div class="modal-content">
      <span class="close" id="closeModal">&times;</span>
      <h3 id="modalTitle">Tambah Pegawai</h3>
      <input type="text" id="namaPegawai" placeholder="Nama Lengkap">
      <input type="text" id="gelarPegawai" placeholder="Gelar (contoh: dr., S.Kep)">
      <button id="btnSimpanPegawai">Simpan</button>
    </div>
  </div>

  <script type="module">
  import { db } from './app.js';
  import { ref, push, set, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

  // ====== ELEMEN UTAMA ======
  const pembinaSelect = document.getElementById('pembina');
  const modal = document.getElementById('modalPegawai');
  const btnTambah = document.getElementById('btnTambahPegawai');
  const btnSimpan = document.getElementById('btnSimpanPegawai');
  const btnClose = document.getElementById('closeModal');
  const namaInput = document.getElementById('namaPegawai');
  const gelarInput = document.getElementById('gelarPegawai');
  const tableBody = document.getElementById('pegawaiTableBody');
  const modalTitle = document.getElementById('modalTitle');

  let pegawaiList = [];
  let editId = null; // mode edit atau tambah

  // ====== MODAL ======
  btnTambah.addEventListener('click', () => {
    modal.style.display = 'flex';
    modalTitle.textContent = 'Tambah Pegawai';
    btnSimpan.textContent = 'Simpan';
    editId = null;
    namaInput.value = '';
    gelarInput.value = '';
  });

  btnClose.addEventListener('click', () => {
    modal.style.display = 'none';
  });

  // ====== SIMPAN / UPDATE DATA PEGAWAI ======
  btnSimpan.addEventListener('click', () => {
    const nama = namaInput.value.trim();
    const gelar = gelarInput.value.trim();

    if (!nama) {
      alert('Nama tidak boleh kosong!');
      return;
    }

    if (editId) {
      // Mode edit
      const updateRef = ref(db, 'pegawai/' + editId);
      update(updateRef, { nama, gelar })
        .then(() => {
          alert('✏️ Data berhasil diperbarui!');
          modal.style.display = 'none';
        })
        .catch(err => alert('Gagal update: ' + err.message));
    } else {
      // Mode tambah
      const pegawaiRef = ref(db, 'pegawai');
      const newRef = push(pegawaiRef);
      set(newRef, { nama, gelar })
        .then(() => {
          alert('✅ Pegawai berhasil ditambahkan!');
          modal.style.display = 'none';
        })
        .catch(err => alert('Gagal simpan: ' + err.message));
    }
  });

  // ====== LIST DATA PEGAWAI REALTIME ======
  const dataRef = ref(db, 'pegawai');
  onValue(dataRef, (snapshot) => {
    tableBody.innerHTML = '';
    pembinaSelect.innerHTML = `<option value="">-- Pilih Pembina --</option>`;
    pegawaiList = [];

    let no = 1;
    snapshot.forEach(child => {
      const data = child.val();
      const id = child.key;
      pegawaiList.push(data.gelar ? `${data.gelar} ${data.nama}` : data.nama);

      // Tabel
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${no++}</td>
        <td>${data.nama}</td>
        <td>${data.gelar || '-'}</td>
        <td>
          <button class="action-btn edit-btn" data-id="${id}">✏️</button>
          <button class="action-btn delete-btn" data-id="${id}">🗑️</button>
        </td>
      `;
      tableBody.appendChild(tr);

      // Pilihan dropdown pembina
      const opt = document.createElement('option');
      opt.value = data.gelar ? `${data.gelar} ${data.nama}` : data.nama;
      opt.textContent = opt.value;
      pembinaSelect.appendChild(opt);
    });

    // Event edit
    document.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        const data = snapshot.child(id).val();
        editId = id;
        namaInput.value = data.nama;
        gelarInput.value = data.gelar || '';
        modalTitle.textContent = 'Edit Pegawai';
        btnSimpan.textContent = 'Update';
        modal.style.display = 'flex';
      });
    });

    // Event delete
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-id');
        if (confirm('Apakah yakin ingin menghapus data ini?')) {
          remove(ref(db, 'pegawai/' + id))
            .then(() => alert('🗑️ Data berhasil dihapus!'))
            .catch(err => alert('Gagal hapus: ' + err.message));
        }
      });
    });
  });

  // ====== SIMPAN JADWAL ======
  document.getElementById('btnSimpanJadwal').addEventListener('click', () => {
    const tanggal = document.getElementById('jadwalTanggal').value;
    const dressCode = document.getElementById('dressCode').value;
    const pembina = pembinaSelect.value;

    if (!tanggal || !dressCode || !pembina) {
      alert('Mohon lengkapi semua data utama!');
      return;
    }

    const dataJadwal = {
      tanggal,
      dressCode,
      pembina,
      dibuatPada: new Date().toISOString()
    };

    const jadwalRef = ref(db, 'jadwal');
    const newJadwal = push(jadwalRef);
    set(newJadwal, dataJadwal)
      .then(() => {
        alert('✅ Jadwal berhasil disimpan!');
        window.location.href = 'hasil-jadwal.html';
      })
      .catch(err => alert('❌ Gagal menyimpan jadwal: ' + err.message));
  });
</script>
</body>
</html>
