<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🗓️ Setting Jadwal Pegawai - Puskesmas Padasuka</title>
  <meta charset="UTF-8">
  <title>Data Pegawai</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f9;
    }

    /* NAVBAR */
    .navbar {
      background: #1976d2;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
    }
    .navbar h1 {
      font-size: 18px;
      margin: 0;
    }
    .navbar .menu {
      display: flex;
      gap: 15px;
    }
    .navbar .menu a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
    }
    .navbar .menu a:hover {
      text-decoration: underline;
    }
    .navbar button {
      background: #fff;
      color: #1976d2;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    /* MAIN CONTAINER */
    main {
      max-width: 1100px;
      margin: 30px auto;
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f6fa; }
    h2 { margin-bottom: 20px; }
    button { padding: 8px 12px; background: #4CAF50; color: white; border: none; cursor: pointer; border-radius: 4px; }
    button:hover { background: #45a049; }

    table { width: 100%; border-collapse: collapse; background: white; margin-top: 15px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #f0f0f0; }

    .action-btn {
      border: none; cursor: pointer; padding: 6px 8px; border-radius: 4px; margin-right: 5px;
    }
    .edit-btn { background: #2196F3; color: white; }
    .delete-btn { background: #f44336; color: white; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center; align-items: center;
    }
    .modal-content {
      background: white;
      padding: 20px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    h2 {
      font-size: 20px;
      color: #1976d2;
      margin-top: 0;
      border-bottom: 2px solid #1976d2;
      padding-bottom: 5px;
      margin-bottom: 20px;
    }

    label {
      font-size: 14px;
      font-weight: 500;
      display: block;
      margin-bottom: 5px;
      color: #333;
    }

    input[type="date"],
    input[type="text"],
    select {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      background: #fafafa;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .section {
      margin-top: 30px;
    }

    .dropdown-group {
      margin-bottom: 20px;
    }

    .dropdown-row select {
      margin-bottom: 8px;
      display: block;
    }

    button.save-btn {
      background: #1976d2;
      color: #fff;
      border: none;
      padding: 12px 20px;
      font-size: 15px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 20px;
    }
    button.save-btn:hover {
      background: #125ca1;
      width: 300px;
      position: relative;
    }

    .btn-secondary {
      background: #555;
      color: #fff;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      margin-left: 10px;
      cursor: pointer;
    .modal-content h3 { margin-top: 0; }
    .modal-content input {
      width: 100%; padding: 8px; margin: 8px 0;
      border: 1px solid #ccc; border-radius: 4px;
    }
    .btn-secondary:hover {
      background: #333;
    .close {
      position: absolute;
      right: 15px; top: 10px;
      cursor: pointer; font-size: 18px; font-weight: bold;
    }
  </style>
</head>
<body>

    <div class="menu">
      <a href="dashboard.html">Dashboard</a>

    <!-- Kegiatan Luar Gedung -->
    <div class="section">

    <button id="btnSimpanJadwal" class="save-btn">💾 Simpan Jadwal</button>

  <script type="module">
    import { db } from './app.js';
    import { ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

    const pembinaSelect = document.getElementById('pembina');
    let pegawaiList = [];

    // Ambil data pegawai dari Firebase (pegawai.html)
    const pegawaiRef = ref(db, 'pegawai');
    onValue(pegawaiRef, (snapshot) => {
      pegawaiList = [];
      pembinaSelect.innerHTML = `<option value="">-- Pilih Pembina --</option>`;
      snapshot.forEach(child => {
        const data = child.val();
        const namaLengkap = data.gelar ? `${data.gelar} ${data.nama}` : data.nama;
        pegawaiList.push(namaLengkap);
        const opt = document.createElement('option');
        opt.value = namaLengkap;
        opt.textContent = namaLengkap;
        pembinaSelect.appendChild(opt);
      });
    import { ref, push, set, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

    const modal = document.getElementById('modalPegawai');
    const btnTambah = document.getElementById('btnTambahPegawai');
    const btnSimpan = document.getElementById('btnSimpanPegawai');
    const btnClose = document.getElementById('closeModal');
    const namaInput = document.getElementById('namaPegawai');
    const gelarInput = document.getElementById('gelarPegawai');
    const tableBody = document.getElementById('pegawaiTableBody');
    const modalTitle = document.getElementById('modalTitle');

    let editId = null; // untuk cek mode edit

    // 🟢 Buka modal Tambah
    btnTambah.addEventListener('click', () => {
      modal.style.display = 'flex';
      modalTitle.textContent = 'Tambah Pegawai';
      btnSimpan.textContent = 'Simpan';
      editId = null;
      namaInput.value = '';
      gelarInput.value = '';
    });

      // Setelah list pegawai didapat → generate semua dropdown
      generateDropdowns();
    // 🔴 Tutup modal
    btnClose.addEventListener('click', () => {
      modal.style.display = 'none';
    });
    
    function generateDropdowns() {
    createDropdown(5, "screeningCKG");
    createDropdown(5, "bpjs");
    createDropdown(5, "rekamMedis");
    createDropdown(1, "pusatInformasi");
    createDropdown(3, "kasir");
    createDropdown(3, "kepegawaian");
    createDropdown(3, "mutu");
    createDropdown(3, "aset");
    createDropdown(3, "bok");
    createDropdown(3, "blud");
    createDropdown(3, "satpam");
    createDropdown(3, "supir");
    createDropdown(3, "cs");
    createDropdown(3, "koki");
    createDropdown(3, "kia");
    createDropdown(3, "mtbs");
    createDropdown(3, "poned");
    createDropdown(3, "bumil");
    createDropdown(3, "usg");
    createDropdown(3, "imunisasi");
    createDropdown(3, "asik");
    createDropdown(3, "penapisan");
    createDropdown(3, "umum");
    createDropdown(3, "lansia");
    createDropdown(3, "kb");
    createDropdown(3, "tb");
    createDropdown(3, "surveilans");
    createDropdown(2, "kesling");
    createDropdown(2, "gigi1");
    createDropdown(2, "gigi2");
    createDropdown(5, "nc");
    createDropdown(3, "farmasi");
    createDropdown(3, "lab");
    createDropdown(3, "konseling");
    createDropdown(3, "igd");
    createDropdown(3, "psikolog");
    createDropdown(3, "ckg");
    createDropdown(10, "posyandu");
    createDropdown(30, "rapat");
    createDropdown(30, "sakit");
    createDropdown(30, "cuti");
    }

    function createDropdown(jumlah, containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      for (let i = 0; i < jumlah; i++) {
        const select = document.createElement("select");
        const optDefault = document.createElement("option");
        optDefault.value = "";
        optDefault.textContent = `-- Pegawai ${i+1} --`;
        select.appendChild(optDefault);
    // 📝 Simpan atau Update ke Firebase
    btnSimpan.addEventListener('click', () => {
      const nama = namaInput.value.trim();
      const gelar = gelarInput.value.trim();

        pegawaiList.forEach(nama => {
          const opt = document.createElement("option");
          opt.value = nama;
          opt.textContent = nama;
          select.appendChild(opt);
        });
        container.appendChild(select);
      if (!nama) {
        alert('Nama tidak boleh kosong!');
        return;
      }
    }

    // Simpan Jadwal ke Firebase
    document.getElementById('btnSimpanJadwal').addEventListener('click', () => {
      const tanggal = document.getElementById('jadwalTanggal').value;
      const dressCode = document.getElementById('dressCode').value;
      const pembina = pembinaSelect.value;

      if (!tanggal || !dressCode || !pembina) {
        alert('Mohon lengkapi semua data utama!');
        return;
      if (editId) {
        // Mode Edit
        const updateRef = ref(db, 'pegawai/' + editId);
        update(updateRef, { nama, gelar })
          .then(() => {
            alert('✏️ Data berhasil diperbarui!');
            modal.style.display = 'none';
          })
          .catch(err => alert('Gagal update: ' + err.message));
      } else {
        // Mode Tambah
        const pegawaiRef = ref(db, 'pegawai');
        const newPegawaiRef = push(pegawaiRef);
        set(newPegawaiRef, { nama, gelar })
          .then(() => {
            alert('✅ Pegawai berhasil ditambahkan!');
            modal.style.display = 'none';
          })
          .catch(err => alert('Gagal simpan: ' + err.message));
      }
    });

      const dataJadwal = {
        tanggal,
        dressCode,
        pembina,
        dibuatPada: new Date().toISOString()
      };
    // 📡 Ambil data realtime dari Firebase
    const dataRef = ref(db, 'pegawai');
    onValue(dataRef, (snapshot) => {
      tableBody.innerHTML = '';
      let no = 1;
      snapshot.forEach((child) => {
        const data = child.val();
        const id = child.key;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${no++}</td>
          <td>${data.nama}</td>
          <td>${data.gelar || '-'}</td>
          <td>
            <button class="action-btn edit-btn" data-id="${id}">✏️</button>
            <button class="action-btn delete-btn" data-id="${id}">🗑️</button>
          </td>
        `;
        tableBody.appendChild(tr);
      });

      const jadwalRef = ref(db, 'jadwal');
      const newRef = push(jadwalRef);
      // ✏️ Event edit
      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          const data = snapshot.child(id).val();
          editId = id;
          namaInput.value = data.nama;
          gelarInput.value = data.gelar || '';
          modalTitle.textContent = 'Edit Pegawai';
          btnSimpan.textContent = 'Update';
          modal.style.display = 'flex';
        });
      });

      set(newRef, dataJadwal)
        .then(() => {
          alert('✅ Jadwal berhasil disimpan!');
          window.location.href = 'hasil-jadwal.html';
        })
        .catch(err => alert('❌ Gagal menyimpan jadwal: ' + err.message));
      // 🗑️ Event delete
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          const yakin = confirm('Apakah yakin ingin menghapus data ini?');
          if (yakin) {
            const delRef = ref(db, 'pegawai/' + id);
            remove(delRef)
              .then(() => alert('🗑️ Data berhasil dihapus!'))
              .catch(err => alert('Gagal hapus: ' + err.message));
          }
        });
      });
    });
  </script>
</body>
