<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📋 Daftar Pegawai - UPTD Puskesmas Padasuka</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f9;
    }

    /* NAVBAR */
    .navbar {
      background: #1976d2;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
    }
    .navbar h1 {
      font-size: 18px;
      margin: 0;
    }
    .navbar .menu {
      display: flex;
      gap: 15px;
    }
    .navbar .menu a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
    }
    .navbar .menu a:hover {
      text-decoration: underline;
    }
    .navbar button {
      background: #fff;
      color: #1976d2;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    /* PAGE CONTAINER */
    .container {
      max-width: 900px;
      margin: 30px auto;
      background: #fff;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .container h2 {
      font-size: 20px;
      color: #1976d2;
      margin-top: 0;
      margin-bottom: 15px;
    }

    /* TABLE */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    thead {
      background: #1976d2;
      color: #fff;
    }
    th, td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid #ddd;
      font-size: 14px;
    }
    tr:hover {
      background: #f9f9f9;
    }
    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      margin: 0 4px;
    }
    .edit-btn {
      color: #1976d2;
    }
    .delete-btn {
      color: #d32f2f;
    }

    /* BUTTON */
    #btnTambahPegawai {
      background: #1976d2;
      color: #fff;
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    #btnTambahPegawai:hover {
      background: #125ca1;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      width: 90%;
      max-width: 400px;
      position: relative;
    }
    .modal-content h3 {
      margin-top: 0;
      color: #1976d2;
      font-size: 18px;
    }
    .modal-content input {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .modal-content button {
      width: 100%;
      background: #1976d2;
      color: #fff;
      border: none;
      padding: 10px;
      font-size: 14px;
      border-radius: 4px;
      cursor: pointer;
    }
    .modal-content button:hover {
      background: #125ca1;
    }
    .close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 20px;
      cursor: pointer;
      color: #555;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <h1>🏛️ Data & Informasi UPTD Puskesmas Padasuka</h1>
    <div class="menu">
      <a href="dashboard.html">Dashboard</a>
      <a href="profil.html">Profil</a>
      <a href="pegawai.html">Pegawai</a>
      <a href="#">Kehadiran</a>
    </div>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- Content -->
  <div class="container">
    <h2>📋 Daftar Pegawai</h2>
    <button id="btnTambahPegawai">+ Tambah Pegawai</button>

    <table>
      <thead>
        <tr>
          <th>No</th>
          <th>Nama Lengkap</th>
          <th>Gelar</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="pegawaiTableBody">
        <!-- Data dari Firebase muncul di sini -->
      </tbody>
    </table>
  </div>

  <!-- Modal Tambah/Edit Pegawai -->
  <div id="modalPegawai" class="modal">
    <div class="modal-content">
      <span class="close" id="closeModal">&times;</span>
      <h3 id="modalTitle">Tambah Pegawai</h3>
      <input type="text" id="namaPegawai" placeholder="Nama Lengkap">
      <input type="text" id="gelarPegawai" placeholder="Gelar (contoh: dr., S.Kep)">
      <button id="btnSimpanPegawai">Simpan</button>
    </div>
  </div>

  <!-- Script Firebase -->
  <script type="module">
    import { db } from './app.js';
    import { ref, push, set, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

    const modal = document.getElementById('modalPegawai');
    const btnTambah = document.getElementById('btnTambahPegawai');
    const btnSimpan = document.getElementById('btnSimpanPegawai');
    const btnClose = document.getElementById('closeModal');
    const namaInput = document.getElementById('namaPegawai');
    const gelarInput = document.getElementById('gelarPegawai');
    const tableBody = document.getElementById('pegawaiTableBody');
    const modalTitle = document.getElementById('modalTitle');

    let editId = null;

    // 🟢 Buka modal Tambah
    btnTambah.addEventListener('click', () => {
      modal.style.display = 'flex';
      modalTitle.textContent = 'Tambah Pegawai';
      btnSimpan.textContent = 'Simpan';
      editId = null;
      namaInput.value = '';
      gelarInput.value = '';
    });

    // 🔴 Tutup modal
    btnClose.addEventListener('click', () => {
      modal.style.display = 'none';
    });

    // 📝 Simpan / Update ke Firebase
    btnSimpan.addEventListener('click', () => {
      const nama = namaInput.value.trim();
      const gelar = gelarInput.value.trim();

      if (!nama) {
        alert('Nama tidak boleh kosong!');
        return;
      }

      if (editId) {
        // Mode Edit
        const updateRef = ref(db, 'pegawai/' + editId);
        update(updateRef, { nama, gelar })
          .then(() => {
            alert('✏️ Data berhasil diperbarui!');
            modal.style.display = 'none';
          })
          .catch(err => alert('Gagal update: ' + err.message));
      } else {
        // Mode Tambah
        const pegawaiRef = ref(db, 'pegawai');
        const newPegawaiRef = push(pegawaiRef);
        set(newPegawaiRef, { nama, gelar })
          .then(() => {
            alert('✅ Pegawai berhasil ditambahkan!');
            modal.style.display = 'none';
          })
          .catch(err => alert('Gagal simpan: ' + err.message));
      }
    });

    // 📡 Ambil data realtime dari Firebase
    const dataRef = ref(db, 'pegawai');
    onValue(dataRef, (snapshot) => {
      tableBody.innerHTML = '';
      let no = 1;
      snapshot.forEach((child) => {
        const data = child.val();
        const id = child.key;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${no++}</td>
          <td>${data.nama}</td>
          <td>${data.gelar || '-'}</td>
          <td>
            <button class="action-btn edit-btn" data-id="${id}">✏️</button>
            <button class="action-btn delete-btn" data-id="${id}">🗑️</button>
          </td>
        `;
        tableBody.appendChild(tr);
      });

      // ✏️ Edit event
      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          const data = snapshot.child(id).val();
          editId = id;
          namaInput.value = data.nama;
          gelarInput.value = data.gelar || '';
          modalTitle.textContent = 'Edit Pegawai';
          btnSimpan.textContent = 'Update';
          modal.style.display = 'flex';
        });
      });

      // 🗑️ Delete event
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          const yakin = confirm('Apakah yakin ingin menghapus data ini?');
          if (yakin) {
            const delRef = ref(db, 'pegawai/' + id);
            remove(delRef)
              .then(() => alert('🗑️ Data berhasil dihapus!'))
              .catch(err => alert('Gagal hapus: ' + err.message));
          }
        });
      });
    });
  </script>
</body>
</html>
