<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - Data & Informasi UPTD Puskesmas Padasuka</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f9;
    }

    /* NAVBAR */
    .navbar {
      background: #1976d2;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
    }
    .navbar h1 {
      font-size: 18px;
      margin: 0;
    }
    .navbar .menu {
      display: flex;
      gap: 15px;
    }
    .navbar .menu a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
    }
    .navbar .menu a:hover {
      text-decoration: underline;
    }
    .navbar button {
      background: #fff;
      color: #1976d2;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    h2 {
      max-width: 1100px;
      margin: 30px auto 10px;
      padding: 0 15px;
      font-size: 20px;
    }

    /* TOMBOL TAMBAH */
    #btnTambahPegawai {
      margin: 0 auto 20px;
      display: block;
      background: #1976d2;
      color: #fff;
      border: none;
      padding: 10px 15px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 4px;
    }
    #btnTambahPegawai:hover {
      background: #125ca1;
    }

    /* TABEL */
    table {
      width: 90%;
      max-width: 1100px;
      margin: 0 auto;
      border-collapse: collapse;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: left;
      font-size: 14px;
    }
    th {
      background: #f0f0f0;
    }
    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    /* MODAL */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 999;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-content h3 {
      margin-top: 0;
    }
    .modal-content input {
      padding: 8px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .modal-content button {
      background: #1976d2;
      color: #fff;
      border: none;
      padding: 8px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 4px;
    }
    .modal-content button:hover {
      background: #125ca1;
    }
    .close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 22px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <h1>🏛️ Data & Informasi UPTD Puskesmas Padasuka</h1>
    <div class="menu">
      <a href="dashboard.html">Dashboard</a>
      <a href="profil.html">Profil</a>
      <a href="pegawai.html">Pegawai</a>
      <a href="#">Kehadiran</a>
    </div>
    <button onclick="logout()">Logout</button>
  </div>

  <h2>📋 Daftar Pegawai</h2>
  <button id="btnTambahPegawai">+ Tambah Pegawai</button>

  <table>
    <thead>
      <tr>
        <th>No</th>
        <th>Nama Lengkap</th>
        <th>Gelar</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody id="pegawaiTableBody">
      <!-- Data dari Firebase akan muncul di sini -->
    </tbody>
  </table>

  <!-- Modal Form -->
  <div id="modalPegawai" class="modal">
    <div class="modal-content">
      <span class="close" id="closeModal">&times;</span>
      <h3 id="modalTitle">Tambah Pegawai</h3>
      <input type="text" id="namaPegawai" placeholder="Nama Lengkap">
      <input type="text" id="gelarPegawai" placeholder="Gelar (contoh: dr., S.Kep)">
      <button id="btnSimpanPegawai">Simpan</button>
    </div>
  </div>

  <!-- Firebase & Script -->
  <script type="module">
    import { db } from './app.js';
    import { ref, push, set, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

    const modal = document.getElementById('modalPegawai');
    const btnTambah = document.getElementById('btnTambahPegawai');
    const btnSimpan = document.getElementById('btnSimpanPegawai');
    const btnClose = document.getElementById('closeModal');
    const namaInput = document.getElementById('namaPegawai');
    const gelarInput = document.getElementById('gelarPegawai');
    const tableBody = document.getElementById('pegawaiTableBody');
    const modalTitle = document.getElementById('modalTitle');

    let editId = null;

    // ===== Modal =====
    btnTambah.addEventListener('click', () => {
      modal.style.display = 'flex';
      modalTitle.textContent = 'Tambah Pegawai';
      btnSimpan.textContent = 'Simpan';
      editId = null;
      namaInput.value = '';
      gelarInput.value = '';
    });

    btnClose.addEventListener('click', () => {
      modal.style.display = 'none';
      namaInput.value = '';
      gelarInput.value = '';
      editId = null;
    });

    // ===== Simpan / Update =====
    btnSimpan.addEventListener('click', () => {
      const nama = namaInput.value.trim();
      const gelar = gelarInput.value.trim();

      if (!nama) {
        alert('Nama tidak boleh kosong!');
        return;
      }

      if (editId) {
        // Update
        const updateRef = ref(db, 'pegawai/' + editId);
        update(updateRef, { nama, gelar })
          .then(() => {
            alert('✏️ Data berhasil diperbarui!');
            modal.style.display = 'none';
            namaInput.value = '';
            gelarInput.value = '';
            editId = null;
          })
          .catch(err => alert('Gagal update: ' + err.message));
      } else {
        // Tambah
        const pegawaiRef = ref(db, 'pegawai');
        const newRef = push(pegawaiRef);
        set(newRef, { nama, gelar })
          .then(() => {
            alert('✅ Pegawai berhasil ditambahkan!');
            modal.style.display = 'none';
            namaInput.value = '';
            gelarInput.value = '';
          })
          .catch(err => alert('Gagal simpan: ' + err.message));
      }
    });

    // ===== List Data Realtime =====
    const dataRef = ref(db, 'pegawai');
    onValue(dataRef, (snapshot) => {
      tableBody.innerHTML = '';
      let no = 1;
      snapshot.forEach(child => {
        const data = child.val();
        const id = child.key;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${no++}</td>
          <td>${data.nama}</td>
          <td>${data.gelar || '-'}</td>
          <td>
            <button class="action-btn edit-btn" data-id="${id}">✏️</button>
            <button class="action-btn delete-btn" data-id="${id}">🗑️</button>
          </td>
        `;
        tableBody.appendChild(tr);
      });

      // Edit Event
      document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          const data = snapshot.child(id).val();
          editId = id;
          namaInput.value = data.nama;
          gelarInput.value = data.gelar || '';
          modalTitle.textContent = 'Edit Pegawai';
          btnSimpan.textContent = 'Update';
          modal.style.display = 'flex';
        });
      });

      // Delete Event
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          if (confirm('Apakah yakin ingin menghapus data ini?')) {
            remove(ref(db, 'pegawai/' + id))
              .then(() => alert('🗑️ Data berhasil dihapus!'))
              .catch(err => alert('Gagal hapus: ' + err.message));
          }
        });
      });
    });
  </script>
</body>
</html>
