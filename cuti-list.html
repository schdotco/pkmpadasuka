<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📋 Daftar Pengajuan Cuti Pegawai - UPTD Puskesmas Padasuka</title>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
    }

    /* 🔹 Navbar */
    .navbar {
      background: #1976d2;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
    }

    .navbar h1 {
      font-size: 18px;
      margin: 0;
    }

    .navbar .menu {
      display: flex;
      gap: 15px;
    }

    .navbar .menu a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
    }

    .navbar .menu a:hover {
      text-decoration: underline;
    }

    .navbar button {
      background: #fff;
      color: #1976d2;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    .navbar button:hover {
      background: #e3f2fd;
    }

    /* 🔹 Container utama */
    .container {
      max-width: 1000px;
      margin: 40px auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 25px 30px;
    }

    h2 {
      color: #1976d2;
      text-align: center;
      margin-top: 0;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #e3f2fd;
      color: #333;
    }

    tr:nth-child(even) {
      background: #fafafa;
    }

    .status-menunggu {
      background: #fff3cd;
      color: #856404;
      font-weight: 600;
      padding: 4px 6px;
      border-radius: 4px;
      display: inline-block;
    }

    .status-disetujui {
      background: #d4edda;
      color: #155724;
      font-weight: 600;
      padding: 4px 6px;
      border-radius: 4px;
      display: inline-block;
    }

    .status-ditolak {
      background: #f8d7da;
      color: #721c24;
      font-weight: 600;
      padding: 4px 6px;
      border-radius: 4px;
      display: inline-block;
    }

    footer {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-top: 30px;
      padding-bottom: 20px;
    }
  </style>
</head>

<body>

  <!-- 🔹 Navbar -->
  <div class="navbar">
    <h1>📋 Daftar Pengajuan Cuti Pegawai</h1>
    <div class="menu">
      <a href="dashboard.html">Dashboard</a>
      <a href="kalender.html">Kalender</a>
    </div>
    <button id="btnKembali" class="back-btn">Kembali</button>
  </div>

  <!-- 🔹 Tabel Data -->
  <div class="container">
    <h2>📑 Data Pengajuan Cuti Pegawai</h2>

    <table id="tabelCuti">
      <thead>
        <tr>
          <th>Nama Pegawai</th>
          <th>Jenis Cuti</th>
          <th>Tanggal</th>
          <th>Status</th>
          <th>Catatan Admin</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="5" style="text-align:center;">Memuat data...</td></tr>
      </tbody>
    </table>
  </div>

  <footer>© 2025 UPTD Puskesmas Padasuka - Semua Hak Dilindungi</footer>

<script type="module">
import { auth, db } from './app.js';
import { ref, onValue, get, child } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

// =============================
// 🔹 TOMBOL KEMBALI DENGAN ROLE
// =============================
const btnKembali = document.getElementById('btnKembali');
btnKembali.addEventListener('click', async () => {
  const user = auth.currentUser;

  if (!user) {
    window.location.href = 'login.html';
    return;
  }

  try {
    const snapshot = await get(child(ref(db), 'users/' + user.uid));
    if (snapshot.exists()) {
      const data = snapshot.val();
      if (data.isAdmin) {
        window.location.href = 'admin-dashboard.html';
      } else {
        window.location.href = 'dashboard.html';
      }
    } else {
      alert('⚠️ Data pengguna tidak ditemukan.');
    }
  } catch (error) {
    console.error(error);
    alert('Terjadi kesalahan saat memeriksa role pengguna.');
  }
});

// =============================
// 🔹 TABEL DAFTAR CUTI REALTIME
// =============================
const tbody = document.querySelector('#tabelCuti tbody');

onValue(ref(db, 'pengajuan_cuti'), (snapshot) => {
  if (!snapshot.exists()) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Belum ada data</td></tr>`;
    return;
  }

  const data = snapshot.val();
  tbody.innerHTML = '';

  Object.values(data).reverse().forEach(item => {
    const statusClass =
      item.status === 'Disetujui' ? 'status-disetujui' :
      item.status === 'Ditolak' ? 'status-ditolak' :
      'status-menunggu';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${item.nama || '-'}</td>
      <td>${item.jenisCuti || '-'}</td>
      <td>${item.tanggalMulai || '-'} s/d ${item.tanggalSelesai || '-'}</td>
      <td class="${statusClass}">${item.status}</td>
      <td>${item.catatanAdmin || '-'}</td>
    `;
    tbody.appendChild(tr);
  });
});
</script>
</body>
</html>
