<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📅 Daftar Pengajuan Cuti Pegawai</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f6f9; margin: 0; }
    .navbar { background: #1976d2; color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    .navbar .menu a { color: white; text-decoration: none; margin-left: 15px; }
    main { max-width: 1000px; background: white; padding: 20px; margin: 30px auto; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h2 { color: #1976d2; border-bottom: 2px solid #1976d2; padding-bottom: 5px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f0f0f0; }
    .status-menunggu { color: #ff9800; font-weight: bold; }
    .status-disetujui { color: #2e7d32; font-weight: bold; }
    .status-ditolak { color: #c62828; font-weight: bold; }
  </style>
</head>
<body>

  <div class="navbar">
    <div>🏛️ UPTD Puskesmas Padasuka</div>
    <div class="menu">
      <a href="dashboard.html">Dashboard</a>
      <a href="cuti-user.html">Ajukan</a>
      <a href="cuti-admin.html">Admin</a>
    </div>
  </div>

  <main>
    <h2>📋 Daftar Pengajuan Cuti Pegawai</h2>
    <table id="tabelCuti">
      <thead>
        <tr>
          <th>Nama</th>
          <th>Jenis Cuti</th>
          <th>Tanggal</th>
          <th>Status</th>
          <th>Catatan Admin</th>
        </tr>
      </thead>
      <tbody><tr><td colspan="5" style="text-align:center;">Memuat data...</td></tr></tbody>
    </table>
  </main>

<script type="module">
import { db } from './app.js';
import { ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

const tbody = document.querySelector('#tabelCuti tbody');

// Realtime listener
onValue(ref(db, 'pengajuan_cuti'), (snapshot) => {
  if (!snapshot.exists()) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Belum ada data</td></tr>`;
    return;
  }

  const data = snapshot.val();
  tbody.innerHTML = '';

  Object.values(data).reverse().forEach(item => {
    const statusClass =
      item.status === 'Disetujui' ? 'status-disetujui' :
      item.status === 'Ditolak' ? 'status-ditolak' :
      'status-menunggu';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${item.nama || '-'}</td>
      <td>${item.jenisCuti || '-'}</td>
      <td>${item.tanggalMulai || '-'} s/d ${item.tanggalSelesai || '-'}</td>
      <td class="${statusClass}">${item.status}</td>
      <td>${item.catatanAdmin || '-'}</td>
    `;
    tbody.appendChild(tr);
  });
});
</script>
</body>
</html>
