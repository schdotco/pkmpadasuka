<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📋 Hasil Jadwal Pegawai - Puskesmas Padasuka</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f9;
    }
    .navbar {
      background: #1976d2;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
    }
    .navbar h1 {
      font-size: 18px;
      margin: 0;
    }
    .navbar .menu {
      display: flex;
      gap: 15px;
    }
    .navbar .menu a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
    }
    .navbar .menu a:hover {
      text-decoration: underline;
    }
    .navbar button {
      background: #fff;
      color: #1976d2;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 20px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    h2 {
      font-size: 20px;
      color: #1976d2;
      margin-top: 0;
      border-bottom: 2px solid #1976d2;
      padding-bottom: 5px;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #f0f0f0;
      width: 30%;
    }

    .button-group {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }
    .button-group button {
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 15px;
      color: #fff;
    }
    #btnShareWA { background: #25D366; }
    #btnShareWA:hover { background: #1ebe5d; }
    #btnDelete { background: #d32f2f; }
    #btnDelete:hover { background: #b71c1c; }
  </style>
</head>
<body>
  <div class="navbar">
    <h1>🏛️ Data & Informasi UPTD Puskesmas Padasuka</h1>
    <div class="menu">
      <a href="dashboard.html">Dashboard</a>
      <a href="profil.html">Profil</a>
      <a href="jadwal.html">Jadwal</a>
    </div>
    <button onclick="window.location.href='jadwal.html'">Kembali</button>
  </div>

  <main>
    <h2>📅 Hasil Jadwal Pegawai</h2>
    <table id="tabelHasil">
      <tbody></tbody>
    </table>

    <div class="button-group">
      <button id="btnShareWA">📤 Share ke WhatsApp</button>
      <button id="btnDelete">🗑 Hapus Jadwal Ini</button>
    </div>
  </main>

<script type="module">
import { db } from './app.js';
import { ref, get, query, limitToLast, remove } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

const tbody = document.querySelector('#tabelHasil tbody');
const btnShare = document.getElementById('btnShareWA');
const btnDelete = document.getElementById('btnDelete');

let jadwalKey = null;
let dataJadwal = null;

// Ambil data terakhir dari Firebase
const jadwalRef = query(ref(db, 'jadwal'), limitToLast(1));
const snapshot = await get(jadwalRef);

if (!snapshot.exists()) {
  alert('Tidak ada data jadwal ditemukan!');
  window.location.href = 'jadwal.html';
}

snapshot.forEach(child => {
  jadwalKey = child.key;
  dataJadwal = child.val();
});

function addRow(label, value) {
  const tr = document.createElement('tr');
  tr.innerHTML = `<th>${label}</th><td>${value}</td>`;
  tbody.appendChild(tr);
}

// 🔹 Info utama
addRow('Tanggal', dataJadwal.tanggal);
addRow('Dress Code', dataJadwal.dressCode);
addRow('Pembina', dataJadwal.pembina);

// 🔹 Tampilkan seluruh kegiatan
if (dataJadwal.kegiatan && Object.keys(dataJadwal.kegiatan).length > 0) {
  Object.entries(dataJadwal.kegiatan).forEach(([namaKegiatan, pegawai]) => {
    addRow(namaKegiatan, pegawai.join(', '));
  });
} else {
  addRow('Kegiatan', '<i>Tidak ada data kegiatan.</i>');
}

// ✨ Tombol Share WhatsApp (rapi)
btnShare.onclick = () => {
  let pesan = `✨ *Jadwal Pegawai - UPTD Puskesmas Padasuka* ✨\n`;
  pesan += `───────────────────────\n`;
  pesan += `📅 *Tanggal:* ${dataJadwal.tanggal}\n`;
  pesan += `👔 *Dress Code:* ${dataJadwal.dressCode}\n`;
  pesan += `🧑‍🏫 *Pembina:* ${dataJadwal.pembina}\n`;
  pesan += `───────────────────────\n`;
  pesan += `📋 *DAFTAR KEGIATAN*\n\n`;

  if (dataJadwal.kegiatan) {
    Object.entries(dataJadwal.kegiatan).forEach(([namaKegiatan, pegawai]) => {
      pesan += `• *${namaKegiatan}*\n  👤 ${pegawai.join(', ')}\n\n`;
    });
  }

  pesan += `───────────────────────\n`;
  pesan += `📌 _Pesan ini dikirim otomatis dari Aplikasi Jadwal Pegawai_`;

  const encodedMessage = encodeURIComponent(pesan);
  window.open(`https://wa.me/?text=${encodedMessage}`, '_blank');
};

// 🗑 Fungsi Hapus Data
btnDelete.onclick = async () => {
  if (!jadwalKey) {
    alert('❌ Data jadwal tidak ditemukan.');
    return;
  }

  const konfirmasi = confirm('⚠️ Apakah Anda yakin ingin menghapus jadwal ini?');
  if (!konfirmasi) return;

  try {
    await remove(ref(db, 'jadwal/' + jadwalKey));
    alert('✅ Jadwal berhasil dihapus.');
    window.location.href = 'jadwal.html';
  } catch (err) {
    alert('❌ Gagal menghapus data: ' + err.message);
  }
};
</script>
</body>
</html>
