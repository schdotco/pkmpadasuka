<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>📋 Hasil Jadwal Pegawai</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 0; }
    header { background: #1976d2; color: #fff; text-align: center; padding: 15px; font-size: 1.3rem; }
    main { max-width: 900px; margin: 20px auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; vertical-align: top; }
    th { background: #f0f0f0; width: 30%; }
    button { background: #25D366; color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; margin-top: 20px; font-size: 15px; }
    button:hover { background: #1ebe5d; }
  </style>
</head>
<body>
  <header>✅ Jadwal Berhasil Disimpan</header>

  <main>
    <h2>📅 Detail Jadwal Pegawai</h2>
    <table id="tabelHasil">
      <tbody></tbody>
    </table>

    <button id="btnShareWA">📤 Share ke WhatsApp</button>
  </main>

  <script type="module">
    import { db } from './app.js';
    import { ref, get, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

    const tbody = document.querySelector('#tabelHasil tbody');
    const btnShare = document.getElementById('btnShareWA');

    // 🔹 Ambil data terakhir dari Firebase
    const jadwalRef = query(ref(db, 'jadwal'), limitToLast(1));
    const snapshot = await get(jadwalRef);

    if (!snapshot.exists()) {
      alert('Tidak ada data jadwal ditemukan!');
      window.location.href = 'jadwal.html';
    }

    let dataJadwal = null;
    snapshot.forEach(child => {
      dataJadwal = child.val();
    });

    function addRow(label, value) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<th>${label}</th><td>${value}</td>`;
      tbody.appendChild(tr);
    }

    // 🔹 Info utama
    addRow('Tanggal', dataJadwal.tanggal);
    addRow('Dress Code', dataJadwal.dressCode);
    addRow('Pembina', dataJadwal.pembina);

    // 🔹 Tampilkan seluruh kegiatan
    if (dataJadwal.kegiatan && Object.keys(dataJadwal.kegiatan).length > 0) {
      Object.entries(dataJadwal.kegiatan).forEach(([namaKegiatan, pegawai]) => {
        addRow(namaKegiatan, pegawai.join(', '));
      });
    } else {
      addRow('Kegiatan', '<i>Tidak ada data kegiatan.</i>');
    }

// ✨ Tombol Share WhatsApp (rapi)
btnShare.onclick = () => {
  let pesan = `✨ *Jadwal Pegawai - UPTD Puskesmas Padasuka* ✨\n`;
  pesan += `───────────────────────\n`;
  pesan += `📅 *Tanggal:* ${dataJadwal.tanggal}\n`;
  pesan += `👔 *Dress Code:* ${dataJadwal.dressCode}\n`;
  pesan += `🧑‍🏫 *Pembina:* ${dataJadwal.pembina}\n`;
  pesan += `───────────────────────\n`;
  pesan += `📋 *DAFTAR KEGIATAN*\n\n`;

  if (dataJadwal.kegiatan) {
    Object.entries(dataJadwal.kegiatan).forEach(([namaKegiatan, pegawai]) => {
      pesan += `• *${namaKegiatan}*\n  👤 ${pegawai.join(', ')}\n\n`;
    });
  }

  pesan += `───────────────────────\n`;
  pesan += `📌 _Pesan ini dikirim otomatis dari Aplikasi Jadwal Pegawai_`;

  const encodedMessage = encodeURIComponent(pesan);
  const waURL = `https://wa.me/?text=${encodedMessage}`;
  window.open(waURL, '_blank');
};
  </script>
</body>
</html>
