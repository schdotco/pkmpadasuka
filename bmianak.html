<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator BMI Anak | Puskesmas Padasuka</title>

<style>
body{
  font-family: Arial, Helvetica, sans-serif;
  background:#f4f7fb;
  margin:0;
  padding:20px;
}
.container{
  max-width:900px;
  margin:auto;
  background:#ffffff;
  border-radius:10px;
  box-shadow:0 3px 10px rgba(0,0,0,.1);
  padding:25px;
}
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:2px solid #2f6fb3;
  padding-bottom:10px;
  margin-bottom:20px;
}
.header h1{
  margin:0;
  font-size:18px;
  color:#2f6fb3;
}
.header span{
  font-size:13px;
  color:#666;
}
h2{
  text-align:center;
  color:#2f6fb3;
  margin-bottom:5px;
}
.subtitle{
  text-align:center;
  font-size:13px;
  color:#666;
  margin-bottom:25px;
}
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}
label{
  font-size:13px;
}
input, select{
  width:100%;
  padding:10px;
  border-radius:6px;
  border:1px solid #ccc;
}
.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:20px;
}
.btn-primary{
  background:#2f6fb3;
  color:#fff;
  border:none;
  padding:12px;
  border-radius:6px;
  cursor:pointer;
}
.btn-reset{
  background:#eaeaea;
  border:none;
  padding:12px;
  border-radius:6px;
  cursor:pointer;
}
.result{
  margin-top:25px;
  border:2px solid #2f6fb3;
  border-radius:8px;
  padding:15px;
  background:#f7fbff;
}
footer{
  margin-top:25px;
  text-align:center;
  font-size:12px;
  color:#666;
}
@media(max-width:700px){
  .form-grid,.buttons{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Puskesmas Padasuka</h1>
    <span>Kota Bandung</span>
  </div>

  <h2>Kalkulator BMI Anak 5–19 Tahun</h2>
  <div class="subtitle">
    Berdasarkan standar WHO (World Health Organization)
  </div>

  <!-- FORM -->
  <div class="form-grid">
    <div>
      <label>Jenis Kelamin</label>
      <select id="gender">
        <option value="">Pilih</option>
        <option value="L">Laki-laki</option>
        <option value="P">Perempuan</option>
      </select>
    </div>

    <div>
      <label>Usia (tahun)</label>
      <input type="number" id="age" placeholder="5 - 19">
    </div>

    <div>
      <label>Tinggi Badan (cm)</label>
      <input type="number" id="height" placeholder="Contoh: 120">
    </div>

    <div>
      <label>Berat Badan (kg)</label>
      <input type="number" id="weight" placeholder="Contoh: 25">
    </div>
  </div>

  <!-- BUTTON -->
  <div class="buttons">
    <button type="button" class="btn-primary" onclick="hitungBMI()">HITUNG BMI</button>
    <button type="button" class="btn-reset" onclick="resetForm()">RESET</button>
  </div>

  <!-- HASIL -->
  <div class="result" id="result">
    <h3>Hasil Perhitungan</h3>
    Masukkan data lengkap dan klik <b>"HITUNG BMI"</b>
  </div>

  <footer>
    © 2025 Puskesmas Padasuka – Dinas Kesehatan Kota Bandung<br>
    Kalkulator ini menggunakan standar WHO untuk anak dan remaja
  </footer>

</div>

<!-- SCRIPT (PASTI JALAN) -->
<script>
function hitungBMI() {
  const tinggi = document.getElementById("height").value;
  const berat = document.getElementById("weight").value;

  if (!tinggi || !berat) {
    alert("Mohon lengkapi data tinggi dan berat badan.");
    return;
  }

  const tinggiMeter = tinggi / 100;
  const bmi = (berat / (tinggiMeter * tinggiMeter)).toFixed(2);

  let kategori = "";
  if (bmi < 14) kategori = "Sangat Kurus";
  else if (bmi < 17) kategori = "Kurus";
  else if (bmi < 23) kategori = "Normal";
  else if (bmi < 27) kategori = "Gemuk";
  else kategori = "Obesitas";

  document.getElementById("result").innerHTML = `
    <h3>Hasil Perhitungan</h3>
    <p><b>BMI:</b> ${bmi}</p>
    <p><b>Kategori:</b> ${kategori}</p>
  `;
}

function resetForm() {
  document.getElementById("gender").value = "";
  document.getElementById("age").value = "";
  document.getElementById("height").value = "";
  document.getElementById("weight").value = "";
  document.getElementById("result").innerHTML = `
    <h3>Hasil Perhitungan</h3>
    Masukkan data lengkap dan klik <b>"HITUNG BMI"</b>
  `;
}
</script>

</body>
</html>
