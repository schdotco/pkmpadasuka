<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator BMI Anak 5–19 Tahun</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #e5eef7;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 18px;
      margin: 0;
      color: #1f4fa3;
    }

    header span {
      font-size: 13px;
      color: #555;
    }

    h2 {
      text-align: center;
      color: #1f4fa3;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #666;
      margin-bottom: 25px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 13px;
      margin-bottom: 5px;
      color: #333;
    }

    select, input {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #cfd8e3;
      font-size: 14px;
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 20px;
    }

    button {
      padding: 12px;
      font-size: 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-primary {
      background: #2f6fb3;
      color: #fff;
    }

    .btn-secondary {
      background: #eaeaea;
      color: #333;
    }

    .result-box {
      margin-top: 25px;
      border: 2px solid #2f6fb3;
      border-radius: 8px;
      padding: 20px;
      background: #f7fbff;
      min-height: 120px;
    }

    .result-box h3 {
      color: #2f6fb3;
      margin-top: 0;
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-top: 25px;
    }

    @media(max-width: 600px) {
      .form-grid, .button-group {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>Puskesmas Padasuka</h1>
    <span>Kota Bandung</span>
  </header>

  <h2>Kalkulator BMI Anak 5–19 Tahun</h2>
  <div class="subtitle">
    Berdasarkan standar WHO (World Health Organization)
  </div>

  <div class="form-grid">
    <div class="form-group">
      <label>Jenis Kelamin</label>
      <select id="gender">
        <option value="">Pilih</option>
        <option value="L">Laki-laki</option>
        <option value="P">Perempuan</option>
      </select>
    </div>

    <div class="form-group">
      <label>Usia (tahun)</label>
      <input type="number" id="age" min="5" max="19" placeholder="5 - 19">
    </div>

    <div class="form-group">
      <label>Tinggi Badan (cm)</label>
      <input type="number" id="height" placeholder="Contoh: 120">
    </div>

    <div class="form-group">
      <label>Berat Badan (kg)</label>
      <input type="number" id="weight" placeholder="Contoh: 25">
    </div>
  </div>

  <div class="button-group">
    <button class="btn-primary" onclick="hitungBMI()">HITUNG BMI</button>
    <button class="btn-secondary" onclick="resetForm()">RESET</button>
  </div>

  <div class="result-box" id="result">
    <h3>Hasil Perhitungan</h3>
    <p>Masukkan data lengkap dan klik <b>"HITUNG BMI"</b></p>
  </div>

  <footer>
    © 2025 Puskesmas Padasuka Dinas Kesehatan Kota Bandung <br>
    Kalkulator ini menggunakan standar WHO untuk anak dan remaja
  </footer>

</div>

<script>
  function hitungBMI() {
    const tinggi = document.getElementById("height").value;
    const berat = document.getElementById("weight").value;

    if (!tinggi || !berat) {
      alert("Mohon lengkapi data tinggi dan berat badan.");
      return;
    }

    const tinggiMeter = tinggi / 100;
    const bmi = (berat / (tinggiMeter * tinggiMeter)).toFixed(2);

    let kategori = "";

    // Kategori sederhana WHO Anak (ringkas)
    if (bmi < 14) {
      kategori = "Sangat Kurus";
    } else if (bmi < 17) {
      kategori = "Kurus";
    } else if (bmi < 23) {
      kategori = "Normal";
    } else if (bmi < 27) {
      kategori = "Gemuk";
    } else {
      kategori = "Obesitas";
    }

    document.getElementById("result").innerHTML = `
      <h3>Hasil Perhitungan</h3>
      <p><b>BMI:</b> ${bmi}</p>
      <p><b>Kategori:</b> ${kategori}</p>
    `;
  }

  function resetForm() {
    document.getElementById("gender").value = "";
    document.getElementById("age").value = "";
    document.getElementById("height").value = "";
    document.getElementById("weight").value = "";

    document.getElementById("result").innerHTML = `
      <h3>Hasil Perhitungan</h3>
      <p>Masukkan data lengkap dan klik <b>"HITUNG BMI"</b></p>
    `;
  }
</script>

</body>
</html>
