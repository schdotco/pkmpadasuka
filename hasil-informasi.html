<style>
  :root {
    --primary: #1976d2;
    --accent: #bbdefb;
    --text: #2c3e50;
    --bg-light: #e3f2fd;

    /* 📺 SCALE untuk TV — semua elemen menjadi lebih besar & nyaman dibaca */
    --scale-header: 1.45;
    --scale-body: 1.35;
    --scale-small: 1.25;
  }

  body {
    font-family: "Inter", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    background: linear-gradient(135deg, var(--bg-light), var(--accent));
    color: var(--text);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    line-height: 1.7;
  }

  /* HEADER */
  header {
    background: linear-gradient(90deg, var(--primary), #2196f3);
    color: white;
    text-align: center;
    padding: 28px 0 16px 0;
    box-shadow: 0 2px 15px rgba(0,0,0,0.15);
    font-family: "Poppins", sans-serif;
    font-size: calc(30px * var(--scale-header));   /* 📺 diperbesar */
    font-weight: 700;
    width: 100%;
  }

  #clock {
    font-family: "Inter", sans-serif;
    font-size: calc(18px * var(--scale-small));
    margin-top: 10px;
    color: #e3f2fd;
  }

  /* TICKER */
  .ticker {
    background: linear-gradient(90deg, #0d47a1, #1976d2, #2196f3);
    background-size: 200% 100%;
    color: #e3f2fd;
    font-size: calc(20px * var(--scale-body));
    overflow: hidden;
    white-space: nowrap;
    width: 100%;
    padding: 10px 0;
    animation: ticker-bg 10s linear infinite;
  }

  .ticker span {
    display: inline-block;
    padding-left: 100%;
    animation: ticker 25s linear infinite;
    font-weight: 500;
  }

  @keyframes ticker { 
    from { transform: translateX(0); } 
    to { transform: translateX(-100%); } 
  }
  
  @keyframes ticker-bg { 
    from { background-position: 0% 0; } 
    to { background-position: 100% 0; } 
  }

  /* CONTAINER */
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    padding: 26px;
    box-sizing: border-box;
    flex-grow: 1;
    gap: 28px;
  }

  /* SLIDER */
  .slider {
    width: 100%;
    max-width: 1350px;   /* 📺 lebih lebar */
    height: 280px;       /* 📺 lebih tinggi */
    background: rgba(255,255,255,0.96);
    border-radius: 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .slide {
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    width: 100%;
    height: 100%;
    animation: fadeInUp 1s ease;
  }

  .slide.active { display: flex; }

  .slide h3 {
    margin: 10px 0 15px 0;
    font-size: calc(30px * var(--scale-body));  /* 📺 diperbesar */
    color: var(--primary);
    font-weight: 700;
    font-family: "Poppins", sans-serif;
  }

  .slide p {
    font-size: calc(22px * var(--scale-body));
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .status-ada {
    color: #1b5e20;
    font-weight: 800;
  }

  .status-tidak {
    color: #b71c1c;
    font-weight: 800;
  }

  /* VIDEO SECTION */
  .video-section {
    width: 100%;
    max-width: 1350px;
    background: rgba(255,255,255,0.96);
    border-radius: 22px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.25);
    overflow: hidden;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
  }

  .video-header {
    background: var(--primary);
    color: white;
    text-align: center;
    padding: 18px 0;
    font-size: calc(22px * var(--scale-body));  /* 📺 diperbesar */
    font-weight: 600;
    font-family: "Poppins", sans-serif;
  }

  .video-container {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
  }

  .video-container iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: none;
  }

  /* FOOTER */
  .footer {
    background: #e3f2fd;
    color: #333;
    text-align: center;
    padding: 16px;
    font-size: calc(18px * var(--scale-small));  /* 📺 diperbesar */
    border-top: 1px solid #bbdefb;
    width: 100%;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
