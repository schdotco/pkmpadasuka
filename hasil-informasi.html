<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layar Informasi Dokter - Puskesmas Padasuka</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f6f8fa;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    h1 {
      text-align: center;
      color: #1976d2;
      background: #e3f2fd;
      padding: 20px;
      margin: 0;
      font-size: 28px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 20px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 14px 10px;
      text-align: center;
    }

    th {
      background: #1976d2;
      color: white;
      font-size: 22px;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    td.status-ada {
      background-color: #c8e6c9;
      color: #1b5e20;
      font-weight: bold;
    }

    td.status-tidak {
      background-color: #ffcdd2;
      color: #b71c1c;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      font-size: 16px;
      color: #555;
      padding: 15px;
      background: #e3f2fd;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
    }

    .container {
      padding: 10px 40px 80px 40px;
      box-sizing: border-box;
      height: calc(100vh - 100px);
      overflow-y: auto;
    }

    .no-data {
      text-align: center;
      font-size: 22px;
      padding: 50px;
      color: #777;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    tbody tr {
      animation: fadeIn 0.8s ease;
    }

    /* Tombol hapus di kanan bawah */
    #btnHapusData {
      position: fixed;
      bottom: 90px;
      right: 25px;
      background: #d32f2f;
      color: #fff;
      border: none;
      padding: 14px 20px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
      transition: all 0.2s ease;
      z-index: 10;
    }
    #btnHapusData:hover {
      background: #b71c1c;
      transform: scale(1.05);
    }

    /* Popup konfirmasi */
    .popup-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .popup {
      background: white;
      padding: 30px 40px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
      max-width: 400px;
    }
    .popup h3 {
      margin: 0 0 20px;
      color: #d32f2f;
    }
    .popup button {
      margin: 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }
    .btn-confirm {
      background: #d32f2f;
      color: #fff;
    }
    .btn-cancel {
      background: #ccc;
    }
    .btn-confirm:hover { background: #b71c1c; }
    .btn-cancel:hover { background: #bbb; }
  </style>
</head>
<body>

  <h1>🩺 Jadwal Dokter UPTD Puskesmas Padasuka</h1>

  <div class="container">
    <table id="tabelInfo">
      <thead>
        <tr>
          <th>Hari</th>
          <th>Nama Petugas</th>
          <th>Unit Pelayanan</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="4"><i>Memuat data...</i></td></tr>
      </tbody>
    </table>
  </div>

  <div class="footer" id="footer">Terakhir diperbarui: -</div>

  <button id="btnHapusData">🗑️ Hapus Semua Data</button>

  <!-- Popup konfirmasi -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup">
      <h3>⚠️ Hapus Semua Data?</h3>
      <p>Apakah Anda yakin ingin menghapus seluruh data jadwal dokter dari sistem?</p>
      <button class="btn-confirm" id="btnYa">Ya, Hapus</button>
      <button class="btn-cancel" id="btnBatal">Batal</button>
    </div>
  </div>

  <script type="module">
    import { db } from "./app.js";
    import { ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

    const tbody = document.querySelector("#tabelInfo tbody");
    const footer = document.getElementById("footer");
    const btnHapus = document.getElementById("btnHapusData");
    const popup = document.getElementById("popupOverlay");
    const btnYa = document.getElementById("btnYa");
    const btnBatal = document.getElementById("btnBatal");

    const infoRef = ref(db, "informasi_dokter");

    // Daftar nama hari dalam bahasa Indonesia
    const hariList = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
    const hariIni = hariList[new Date().getDay()];

    // Tampilkan data realtime
    onValue(infoRef, (snapshot) => {
      tbody.innerHTML = "";
      if (!snapshot.exists()) {
        tbody.innerHTML = `<tr><td colspan="4"><i>Tidak ada data ditemukan.</i></td></tr>`;
        return;
      }

      const data = [];
      snapshot.forEach(child => {
        const val = child.val();
        if (val.hari === hariIni) data.push(val);
      });

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="no-data">Belum ada data untuk hari ${hariIni}.</td></tr>`;
        return;
      }

      data.sort((a, b) => a.nama.localeCompare(b.nama));

      data.forEach(item => {
        const tr = document.createElement("tr");
        const tdHari = document.createElement("td");
        const tdNama = document.createElement("td");
        const tdUnit = document.createElement("td");
        const tdStatus = document.createElement("td");

        tdHari.textContent = item.hari || "-";
        tdNama.textContent = item.nama || "-";
        tdUnit.textContent = item.unit || "-";
        tdStatus.textContent = item.status || "-";

        if (item.status?.toLowerCase() === "ada") {
          tdStatus.classList.add("status-ada");
        } else {
          tdStatus.classList.add("status-tidak");
        }

        tr.append(tdHari, tdNama, tdUnit, tdStatus);
        tbody.appendChild(tr);
      });

      const now = new Date();
      const waktu = now.toLocaleString("id-ID", {
        day: "2-digit",
        month: "long",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
      footer.textContent = `Terakhir diperbarui: ${waktu} | Menampilkan jadwal hari ${hariIni}`;
    });

    // Tombol hapus data -> tampilkan popup
    btnHapus.addEventListener("click", () => {
      popup.style.display = "flex";
    });

    // Tombol batal -> tutup popup
    btnBatal.addEventListener("click", () => {
      popup.style.display = "none";
    });

    // Tombol konfirmasi hapus -> hapus semua data
    btnYa.addEventListener("click", async () => {
      try {
        await remove(infoRef);
        alert("🗑️ Semua data berhasil dihapus!");
      } catch (err) {
        alert("❌ Gagal menghapus data: " + err.message);
      } finally {
        popup.style.display = "none";
      }
    });

    // Auto-refresh setiap 1 menit agar layar selalu update
    setInterval(() => window.location.reload(), 60000);
  </script>

</body>
</html>
