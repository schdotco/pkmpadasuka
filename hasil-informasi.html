<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layar Informasi Dokter - UPTD Puskesmas Padasuka</title>

  <!-- ✅ Font: Inter + Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #1976d2;
      --accent: #bbdefb;
      --text: #2c3e50;
      --bg-light: #e3f2fd;
      --bg-dark: #0d47a1;
    }

    body {
      font-family: "Inter", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, var(--bg-light), var(--accent));
      color: var(--text);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      line-height: 1.6;
    }

    /* Header */
    header {
      background: linear-gradient(90deg, var(--primary), #2196f3);
      color: white;
      text-align: center;
      padding: 18px 0 10px 0;
      box-shadow: 0 2px 15px rgba(0,0,0,0.15);
      font-family: "Poppins", sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.5px;
      width: 100%;
      animation: fadeInDown 1s ease;
    }

    #clock {
      font-family: "Inter", sans-serif;
      font-size: 17px;
      margin-top: 5px;
      color: #e3f2fd;
    }

    /* Running text */
    .ticker {
      background: linear-gradient(90deg, #0d47a1, #1976d2, #2196f3);
      background-size: 200% 100%;
      color: #e3f2fd;
      font-size: 18px;
      overflow: hidden;
      white-space: nowrap;
      width: 100%;
      animation: ticker-bg 10s linear infinite;
    }

    .ticker span {
      display: inline-block;
      padding-left: 100%;
      animation: ticker 25s linear infinite;
      font-weight: 500;
    }

    @keyframes ticker {
      from { transform: translateX(0); }
      to { transform: translateX(-100%); }
    }

    @keyframes ticker-bg {
      from { background-position: 0% 0; }
      to { background-position: 100% 0; }
    }

    /* Layout utama dengan banner kiri kanan */
    .content-layout {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      max-width: 1600px;
      gap: 15px;
      padding: 20px;
      box-sizing: border-box;
    }

    .main-content {
      flex: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .side-banner {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(255,255,255,0.9);
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      padding: 8px;
      overflow: hidden;
      height: auto;
      max-width: 250px;
      min-width: 180px;
    }

    .side-banner img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      object-fit: cover;
      animation: float 8s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    /* SLIDER */
    .slider {
      position: relative;
      width: 100%;
      max-width: 1100px;
      height: 200px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      transition: all 0.4s ease;
    }

    .slide {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      animation: fadeInUp 1s ease;
    }

    .slide.active { display: flex; }

    .slide h3 {
      margin: 5px 0 10px 0;
      font-size: 28px;
      color: var(--primary);
      font-weight: 700;
      font-family: "Poppins", sans-serif;
    }

    .slide p {
      font-size: 22px;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status-ada { color: #1b5e20; font-weight: 700; }
    .status-tidak { color: #b71c1c; font-weight: 700; }

    /* VIDEO */
    .video-section {
      width: 100%;
      max-width: 1100px;
      background: rgba(255,255,255,0.95);
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .video-header {
      background: var(--primary);
      color: white;
      text-align: center;
      padding: 10px 0;
      font-size: 20px;
      font-weight: 600;
      font-family: "Poppins", sans-serif;
    }

    .video-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
    }

    .video-container iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }

    /* Footer */
    .footer {
      background: #e3f2fd;
      color: #333;
      text-align: center;
      padding: 10px;
      font-size: 16px;
      border-top: 1px solid #bbdefb;
      width: 100%;
      font-family: "Inter", sans-serif;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .content-layout { flex-direction: column; align-items: center; }
      .side-banner { max-width: 90%; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    🩺 Jadwal Dokter UPTD Puskesmas Padasuka
    <div id="clock"></div>
  </header>

  <div class="ticker">
    <span>Selamat datang di UPTD Puskesmas Padasuka Kota Bandung | Bersama kita wujudkan pelayanan kesehatan yang prima, cepat, dan ramah bagi masyarakat Kota Bandung</span>
  </div>

  <div class="content-layout">
    <div class="side-banner left-banner">
      <img src="https://schdotco.github.io/pkmpadasuka/banner1.jpg" alt="Edukasi Kesehatan 1">
    </div>

    <div class="main-content">
      <div class="slider" id="slider"></div>

      <section class="video-section">
        <div class="video-header">🎬 Informasi & Edukasi Kesehatan</div>
        <div class="video-container">
          <iframe 
            src="https://www.youtube.com/embed/w8q6KWrduA0?autoplay=1&mute=1&loop=1&playlist=w8q6KWrduA0&controls=0&modestbranding=1&showinfo=0&rel=0"
            title="Video Edukasi Kesehatan"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen>
          </iframe>
        </div>
      </section>
    </div>

    <div class="side-banner right-banner">
      <img src="https://schdotco.github.io/pkmpadasuka/banner2.jpg" alt="Edukasi Kesehatan 2">
    </div>
  </div>

  <div class="footer" id="footer">Terakhir diperbarui: -</div>

  <script type="module">
    import { db } from "./app.js";
    import { ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

    const slider = document.getElementById("slider");
    const footer = document.getElementById("footer");
    const clock = document.getElementById("clock");
    const infoRef = ref(db, "informasi_dokter");

    const hariList = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
    const hariIni = hariList[new Date().getDay()];
    let slides = [];
    let index = 0;

    // Jam realtime
    setInterval(() => {
      const now = new Date();
      clock.textContent = now.toLocaleString("id-ID", {
        weekday: "long", hour: "2-digit", minute: "2-digit", second: "2-digit"
      });
    }, 1000);

    // Firebase listener
    onValue(infoRef, (snapshot) => {
      slider.innerHTML = "";
      slides = [];

      if (!snapshot.exists()) {
        slider.innerHTML = `<div class='slide active'><p style="font-size:22px;color:#888;">Tidak ada data ditemukan.</p></div>`;
        return;
      }

      snapshot.forEach(child => {
        const val = child.val();
        if (val.hari === hariIni) slides.push(val);
      });

      if (slides.length === 0) {
        slider.innerHTML = `<div class='slide active'><p style="font-size:22px;color:#888;">Belum ada data untuk hari ${hariIni}.</p></div>`;
        return;
      }

      slides.sort((a,b)=>a.nama.localeCompare(b.nama));
      slides.forEach((item,i)=>{
        const div = document.createElement("div");
        div.className = "slide" + (i===0 ? " active" : "");
        div.innerHTML = `
          <h3>${item.nama || "-"}</h3>
          <p>
            📅 <b>${item.hari || "-"}</b> |
            🏥 <b>${item.unit || "-"}</b> |
            🩺 <b class="${item.status?.toLowerCase() === 'ada' ? 'status-ada' : 'status-tidak'}">
            ${item.status || "-"}
            </b>
          </p>
        `;
        slider.appendChild(div);
      });

      updateFooter();
    });

    function updateFooter() {
      const now = new Date();
      const waktu = now.toLocaleString("id-ID", {
        day: "2-digit", month: "long", year: "numeric",
        hour: "2-digit", minute: "2-digit"
      });
      footer.textContent = `Terakhir diperbarui: ${waktu} | Jadwal hari ${hariIni}`;
    }

    // Ganti slide tiap 6 detik
    setInterval(()=>{
      const all = document.querySelectorAll(".slide");
      if (all.length > 1) {
        all[index].classList.remove("active");
        index = (index + 1) % all.length;
        all[index].classList.add("active");
      }
    }, 6000);

    // Refresh otomatis tiap 30 menit
    setInterval(()=> window.location.reload(), 1800000);

    // ✅ Banner auto-slide (tambahan ringan)
    const leftImages = ["https://schdotco.github.io/pkmpadasuka/banner1.jpg"];
    const rightImages = ["https://schdotco.github.io/pkmpadasuka/banner2.jpg"];
    let bannerIndex = 0;

    setInterval(() => {
      bannerIndex = (bannerIndex + 1) % leftImages.length;
      document.querySelector(".left-banner img").src = leftImages[bannerIndex];
      document.querySelector(".right-banner img").src = rightImages[bannerIndex];
    }, 10000);
  </script>
</body>
</html>
