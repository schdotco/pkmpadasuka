<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layar Informasi Dokter - UPTD Puskesmas Padasuka</title>

  <!-- Font lama (TIDAK DIUBAH) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #1976d2;
    --accent: #bbdefb;
    --text: #2c3e50;
    --bg-light: #e3f2fd;

    --scale-header: 1.45;
    --scale-body: 1.35;
    --scale-small: 1.25;
  }

  body {
    font-family: "Inter", sans-serif;
    margin: 0;
    background: linear-gradient(135deg, var(--bg-light), var(--accent));
    color: var(--text);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    line-height: 1.7;
  }

  header {
    background: linear-gradient(90deg, var(--primary), #2196f3);
    color: white;
    text-align: center;
    padding: 28px 0 16px 0;
    box-shadow: 0 2px 15px rgba(0,0,0,0.15);
    font-family: "Poppins", sans-serif;
    font-size: calc(30px * var(--scale-header));
    font-weight: 700;
    width: 100%;
  }

  #clock {
    font-size: calc(18px * var(--scale-small));
    margin-top: 10px;
    color: #e3f2fd;
  }

  .ticker {
    background: linear-gradient(90deg, #0d47a1, #1976d2, #2196f3);
    background-size: 200% 100%;
    color: #e3f2fd;
    font-size: calc(20px * var(--scale-body));
    white-space: nowrap;
    width: 100%;
    padding: 10px 0;
    animation: ticker-bg 10s linear infinite;
  }

  .ticker span {
    display: inline-block;
    padding-left: 100%;
    animation: ticker 25s linear infinite;
    font-weight: 500;
  }

  @keyframes ticker {
    from { transform: translateX(0); }
    to { transform: translateX(-100%); }
  }
  @keyframes ticker-bg {
    from { background-position: 0% 0; }
    to { background-position: 100% 0; }
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    padding: 26px;
    flex-grow: 1;
    gap: 28px;
  }

  .slider {
    width: 100%;
    max-width: 1350px;
    height: 280px;
    background: rgba(255,255,255,0.96);
    border-radius: 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .slide {
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    width: 100%;
    height: 100%;
    animation: fadeInUp 1s ease;
  }

  .slide.active { display: flex; }

  .slide h3 {
    margin: 10px 0 15px 0;
    font-size: calc(30px * var(--scale-body));
    color: var(--primary);
    font-weight: 700;
  }

  .slide p {
    font-size: calc(22px * var(--scale-body));
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .status-ada { color: #1b5e20; font-weight: 800; }
  .status-tidak { color: #b71c1c; font-weight: 800; }

  .video-section {
    width: 100%;
    max-width: 1350px;
    background: rgba(255,255,255,0.96);
    border-radius: 22px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.25);
    overflow: hidden;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
  }

  .video-header {
    background: var(--primary);
    color: white;
    text-align: center;
    padding: 18px 0;
    font-size: calc(22px * var(--scale-body));
    font-weight: 600;
  }

  .video-container {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
  }

  .video-container iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: none;
  }

  .footer {
    background: #e3f2fd;
    color: #333;
    text-align: center;
    padding: 16px;
    font-size: calc(18px * var(--scale-small));
    border-top: 1px solid #bbdefb;
    width: 100%;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <header>
    🩺 Jadwal Dokter UPTD Puskesmas Padasuka
    <div id="clock"></div>
  </header>

  <div class="ticker">
    <span>Selamat datang di UPTD Puskesmas Padasuka Kota Bandung | Pelayanan cepat, ramah dan prima</span>
  </div>

  <div class="container">
    <div class="slider" id="slider"></div>

    <section class="video-section">
      <div class="video-header">🎬 Informasi & Edukasi Kesehatan</div>

      <div class="video-container">
        <!-- IFRAME DINAMIS (video berganti otomatis) -->
        <iframe 
          id="video"
          src=""
          allow="autoplay; encrypted-media"
          allowfullscreen>
        </iframe>
      </div>

    </section>
  </div>

  <div class="footer" id="footer">Terakhir diperbarui: -</div>

  <script type="module">
    import { db } from "./app.js";
    import { ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

    const slider = document.getElementById("slider");
    const footer = document.getElementById("footer");
    const clock = document.getElementById("clock");
    const infoRef = ref(db, "informasi_dokter");

    const hariList = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
    const hariIni = hariList[new Date().getDay()];
    let slides = [];
    let index = 0;

    // JAM
    setInterval(() => {
      const now = new Date();
      clock.textContent = now.toLocaleString("id-ID", {
        weekday: "long", hour: "2-digit", minute: "2-digit", second: "2-digit"
      });
    }, 1000);

    // FIREBASE
    onValue(infoRef, (snapshot) => {
      slider.innerHTML = "";
      slides = [];

      if (!snapshot.exists()) {
        slider.innerHTML = "<div class='slide active'><p style='font-size:22px;color:#888;'>Tidak ada data ditemukan.</p></div>";
        return;
      }

      snapshot.forEach(child => {
        const val = child.val();
        if (val.hari === hariIni) slides.push(val);
      });

      if (slides.length === 0) {
        slider.innerHTML = `<div class='slide active'><p style="font-size:22px;color:#888;">Belum ada data untuk hari ${hariIni}.</p></div>`;
        return;
      }

      slides.sort((a,b)=>a.nama.localeCompare(b.nama));
      slides.forEach((item,i)=>{
        const div = document.createElement("div");
        div.className = "slide" + (i===0 ? " active" : "");
        div.innerHTML = `
          <h3>${item.nama || "-"}</h3>
          <p>
            📅 <b>${item.hari || "-"}</b> |
            🏥 <b>${item.unit || "-"}</b> |
            🩺 <b class="${item.status?.toLowerCase()==='ada' ? 'status-ada':'status-tidak'}">${item.status || "-"}</b>
          </p>
        `;
        slider.appendChild(div);
      });

      updateFooter();
    });

    function updateFooter() {
      const now = new Date();
      footer.textContent = `Terakhir diperbarui: ${now.toLocaleString("id-ID", {
        day: "2-digit", month: "long", year: "numeric",
        hour: "2-digit", minute: "2-digit"
      })} | Jadwal hari ${hariIni}`;
    }

    // SLIDER OTOMATIS
    setInterval(()=>{
      const all = document.querySelectorAll(".slide");
      if (all.length > 1) {
        all[index].classList.remove("active");
        index = (index + 1) % all.length;
        all[index].classList.add("active");
      }
    }, 6000);

    /* ===========================
       SISTEM PLAYLIST 3 VIDEO
       =========================== */

    const videoList = [
      "https://www.youtube.com/embed/w8q6KWrduA0?autoplay=1&mute=1&loop=1&playlist=w8q6KWrduA0&controls=0&modestbranding=1&showinfo=0&rel=0",

      "https://www.youtube.com/embed/RzHj55bH9n4?autoplay=1&mute=1&loop=1&playlist=RzHj55bH9n4&controls=0&modestbranding=1&showinfo=0&rel=0",

      "https://www.youtube.com/embed/dMpP4Q-IinU?autoplay=1&mute=1&loop=1&playlist=dMpP4Q-IinU&controls=0&modestbranding=1&showinfo=0&rel=0"
    ];

    let vidIndex = 0;

    function playVideo() {
      document.getElementById("video").src = videoList[vidIndex];
      vidIndex = (vidIndex + 1) % videoList.length;
    }

    playVideo();                 // play video pertama
    setInterval(playVideo, 60000); // ganti video tiap 60 detik

    // UNMUTE saat klik pertama (untuk TV)
    document.addEventListener("click", () => {
      const iframe = document.getElementById("video");
      iframe.src = iframe.src.replace("mute=1", "mute=0");
    });

    // AUTO REFRESH 30 menit
    setInterval(()=> window.location.reload(), 1800000);
  </script>
</body>
</html>
