<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layar Informasi Dokter - Puskesmas Padasuka</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f6f8fa;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    h1 {
      text-align: center;
      color: #1976d2;
      background: #e3f2fd;
      padding: 20px;
      margin: 0;
      font-size: 28px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 20px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 14px 10px;
      text-align: center;
    }

    th {
      background: #1976d2;
      color: white;
      font-size: 22px;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    td.status-ada {
      background-color: #c8e6c9;
      color: #1b5e20;
      font-weight: bold;
    }

    td.status-tidak {
      background-color: #ffcdd2;
      color: #b71c1c;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      font-size: 16px;
      color: #555;
      padding: 15px;
      background: #e3f2fd;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
    }

    .container {
      padding: 10px 40px 70px 40px;
      box-sizing: border-box;
      height: calc(100vh - 100px);
      overflow-y: auto;
    }

    .no-data {
      text-align: center;
      font-size: 22px;
      padding: 50px;
      color: #777;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    tbody tr {
      animation: fadeIn 0.8s ease;
    }
  </style>
</head>
<body>

  <h1>🩺 Jadwal Dokter UPTD Puskesmas Padasuka</h1>

  <div class="container">
    <table id="tabelInfo">
      <thead>
        <tr>
          <th>Hari</th>
          <th>Nama Petugas</th>
          <th>Unit Pelayanan</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="4"><i>Memuat data...</i></td></tr>
      </tbody>
    </table>
  </div>

  <div class="footer" id="footer">Terakhir diperbarui: -</div>

  <script type="module">
    import { db } from "./app.js";
    import { ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

    const tbody = document.querySelector("#tabelInfo tbody");
    const footer = document.getElementById("footer");
    const infoRef = ref(db, "informasi_dokter");

    // Ambil nama hari ini dalam bahasa Indonesia
    const hariList = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
    const hariIni = hariList[new Date().getDay()];

    onValue(infoRef, (snapshot) => {
      tbody.innerHTML = "";
      if (!snapshot.exists()) {
        tbody.innerHTML = `<tr><td colspan="4"><i>Tidak ada data ditemukan.</i></td></tr>`;
        return;
      }

      // Ambil dan filter hanya hari ini
      const data = [];
      snapshot.forEach(child => {
        const val = child.val();
        if (val.hari === hariIni) data.push(val);
      });

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="no-data">Belum ada data untuk hari ${hariIni}.</td></tr>`;
        return;
      }

      // Urutkan agar tampil rapi
      data.sort((a, b) => a.nama.localeCompare(b.nama));

      // Tampilkan data ke tabel
      data.forEach(item => {
        const tr = document.createElement("tr");

        const tdHari = document.createElement("td");
        tdHari.textContent = item.hari || "-";

        const tdNama = document.createElement("td");
        tdNama.textContent = item.nama || "-";

        const tdUnit = document.createElement("td");
        tdUnit.textContent = item.unit || "-";

        const tdStatus = document.createElement("td");
        tdStatus.textContent = item.status || "-";
        if (item.status?.toLowerCase() === "ada") {
          tdStatus.classList.add("status-ada");
        } else {
          tdStatus.classList.add("status-tidak");
        }

        tr.append(tdHari, tdNama, tdUnit, tdStatus);
        tbody.appendChild(tr);
      });

      // Update waktu pembaruan
      const now = new Date();
      const waktu = now.toLocaleString("id-ID", {
        day: "2-digit",
        month: "long",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
      footer.textContent = `Terakhir diperbarui: ${waktu} | Menampilkan jadwal hari ${hariIni}`;
    });

    // Auto-refresh setiap 1 menit
    setInterval(() => window.location.reload(), 60000);
  </script>

</body>
</html>
