<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Rekapan Absensi Pegawai</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .combo-box { position: relative; width: 100%; }
    .combo-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
      outline: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .combo-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }
    .combo-list {
      position: absolute;
      top: 100%; left: 0; right: 0;
      background: white;
      border: 1px solid #ddd;
      border-top: none;
      border-radius: 0 0 0.5rem 0.5rem;
      max-height: 240px;
      overflow-y: auto;
      z-index: 50;
      display: none;
      animation: fadeIn 0.15s ease-in-out;
    }
    .combo-item {
      padding: 0.5rem 1rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .combo-item:hover { background: #f3f4f6; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-4xl">
    <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">
      Input Rekapan Absensi Pegawai
    </h1>

    <!-- Jenis Pegawai -->
    <div class="mb-5">
      <label class="block text-gray-700 font-medium mb-2">1. Jenis Pegawai</label>
      <select id="jenisPegawai" class="w-full p-3 border rounded-lg focus:ring focus:ring-blue-300">
        <option value="">-- Pilih Jenis Pegawai --</option>
        <option value="BLUD">BLUD</option>
        <option value="ASN">ASN</option>
      </select>
    </div>

    <!-- Nama Pegawai (Dropdown Searchable - versi final) -->
    <div class="mb-5 combo-box">
      <label class="block text-gray-700 font-medium mb-2">2. Nama Pegawai</label>
      <input id="comboInput" type="text" placeholder="Cari atau pilih pegawai..." class="combo-input">
      <div id="comboList" class="combo-list"></div>
    </div>

    <!-- 🗓️ Input Bulan -->
    <div class="mb-5">
      <label class="block text-gray-700 font-medium mb-2">3. Bulan Rekapan</label>
      <input id="bulanInput" type="month" class="w-full p-3 border rounded-lg focus:ring focus:ring-blue-300">
    </div>

    <!-- Form Input Rekap -->
    <div class="grid grid-cols-2 gap-4">
      <div><label>4. Akumulasi Terlambat</label><input id="ak_terlambat" class="w-full p-2 border rounded"></div>
      <div><label>5. Akumulasi Pulang Cepat</label><input id="ak_pulangCepat" class="w-full p-2 border rounded"></div>

      <!-- Sakit < 3 Hari -->
      <div><label>6. Sakit &lt; 3 Hari</label><input id="ak_sakit_kurang3" type="number" class="w-full p-2 border rounded"></div>
      <!-- Sakit ≥ 3 Hari -->
      <div><label>7. Sakit ≥ 3 Hari</label><input id="ak_sakit_lebih3" type="number" class="w-full p-2 border rounded"></div>

      <div><label>8. Akumulasi Total Hari Kerja dalam 1 Bulan</label><input id="ak_hariKerja" type="number" class="w-full p-2 border rounded"></div>
      <div><label>9. Jumlah Keterlambatan (Hari)</label><input id="telat_hari" class="w-full p-2 border rounded"></div>

      <div><label>10. Jumlah Keterlambatan (Jam)</label><input id="telat_jam" class="w-full p-2 border rounded"></div>

      <!-- DL < 3 Hari -->
      <div><label>11. DL &lt; 3 Hari</label><input id="dl_kurang3" type="number" class="w-full p-2 border rounded"></div>
      <!-- DL ≥ 3 Hari -->
      <div><label>12. DL ≥ 3 Hari</label><input id="dl_lebih3" type="number" class="w-full p-2 border rounded"></div>

      <div><label>13. Jumlah CAP</label><input id="ak_CAP" type="number" class="w-full p-2 border rounded"></div>
      <div><label>14. Jumlah CT</label><input id="ak_CT" type="number" class="w-full p-2 border rounded"></div>

      <div><label>15. Jumlah CM</label><input id="ak_CM" type="number" class="w-full p-2 border rounded"></div>
      <div><label>16. Jumlah GL</label><input id="ak_GL" type="number" class="w-full p-2 border rounded"></div>

      <div><label>17. Jumlah CTB</label><input id="ak_CTB" type="number" class="w-full p-2 border rounded"></div>
      <div><label>18. Jumlah LM (Shift)</label><input id="shift_LM" type="number" class="w-full p-2 border rounded"></div>

      <div><label>19. Jumlah Pagi (Shift)</label><input id="shift_P" type="number" class="w-full p-2 border rounded"></div>
      <div><label>20. Jumlah Siang (Shift)</label><input id="shift_S" type="number" class="w-full p-2 border rounded"></div>

      <div><label>21. Jumlah Malam (Shift)</label><input id="shift_M" type="number" class="w-full p-2 border rounded"></div>
      <div><label>22. Jumlah Off/Libur (Shift)</label><input id="shift_OFF" type="number" class="w-full p-2 border rounded"></div>

      <div><label>23. Total Hari Kerja (Shift)</label><input id="shift_total" type="number" class="w-full p-2 border rounded"></div>
      <div class="col-span-2"><label>24. Total % Kehadiran</label><input id="persenKehadiran" class="w-full p-2 border rounded" placeholder="contoh: 95%"></div>
    </div>

    <button id="uploadBtn"
      class="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
      💾 Simpan Rekapan
    </button>

    <div id="statusMsg" class="text-center text-gray-600 mt-4"></div>
  </div>

  <!-- 🔥 Firebase + Dropdown + Simpan Rekap -->
<script type="module">
import { db } from './app.js';
import { ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

const jenisPegawai = document.getElementById('jenisPegawai');
const comboInput = document.getElementById('comboInput');
const comboList = document.getElementById('comboList');
const uploadBtn = document.getElementById('uploadBtn');
const statusMsg = document.getElementById('statusMsg');
const bulanInput = document.getElementById('bulanInput');

let semuaPegawai = [];
let filteredPegawai = [];
let selectedPegawai = null;

// ✅ Ambil data pegawai dari Firebase
const pegawaiRef = ref(db, 'Pegawai');
onValue(pegawaiRef, snapshot => {
  semuaPegawai = [];
  snapshot.forEach(child => {
    const data = child.val();
    if (data && data.nama) {
      semuaPegawai.push({
        id: child.key,
        nama: data.nama,
        gelar: data.gelar || ''
      });
    }
  });
  filteredPegawai = semuaPegawai;
  renderDropdown();
});

// 🔍 Pencarian Dropdown
comboInput.addEventListener('input', () => {
  const keyword = comboInput.value.toLowerCase();
  filteredPegawai = semuaPegawai.filter(p =>
    (p.nama && p.nama.toLowerCase().includes(keyword)) ||
    (p.gelar && p.gelar.toLowerCase().includes(keyword))
  );
  renderDropdown();
  comboList.style.display = keyword ? 'block' : 'none';
});

// 🧾 Render Dropdown
function renderDropdown() {
  comboList.innerHTML = '';
  if (filteredPegawai.length === 0) {
    comboList.innerHTML = `<p class="text-gray-500 text-center py-2">Tidak ada pegawai ditemukan</p>`;
    return;
  }
  filteredPegawai.forEach(p => {
    const item = document.createElement('div');
    item.className = 'combo-item';
    item.textContent = `${p.nama}${p.gelar ? ' ' + p.gelar : ''}`;
    item.dataset.nama = p.nama;
    comboList.appendChild(item);
  });
}

// 🧠 Pilih Pegawai
comboList.addEventListener('click', e => {
  if (e.target.classList.contains('combo-item')) {
    selectedPegawai = e.target.dataset.nama;
    comboInput.value = selectedPegawai;
    comboList.style.display = 'none';
  }
});

// Tutup dropdown
document.addEventListener('click', e => {
  if (!e.target.closest('.combo-box')) comboList.style.display = 'none';
});

// 💾 Simpan ke Firebase
uploadBtn.addEventListener('click', async () => {
  const jenis = jenisPegawai.value;
  const bulanValue = bulanInput.value;
  if (!jenis) return statusMsg.textContent = "⚠️ Pilih jenis pegawai!";
  if (!selectedPegawai) return statusMsg.textContent = "⚠️ Pilih nama pegawai!";
  if (!bulanValue) return statusMsg.textContent = "⚠️ Pilih bulan rekap!";

  const sakitKurang3 = Number(ak_sakit_kurang3.value) || 0;
  const sakitLebih3 = Number(ak_sakit_lebih3.value) || 0;
  const dlKurang3 = Number(dl_kurang3.value) || 0;
  const dlLebih3 = Number(dl_lebih3.value) || 0;

  const [year, month] = bulanValue.split("-");
  const bulanFormatted = new Date(`${month}/01/${year}`).toLocaleString("id-ID", { month: "long", year: "numeric" });

  const hasilRekap = {
    jenisPegawai: jenis,
    namaPegawai: selectedPegawai,
    ak_terlambat: ak_terlambat.value || 0,
    ak_pulangCepat: ak_pulangCepat.value || 0,
    ak_sakit_kurang3: sakitKurang3,
    ak_sakit_lebih3: sakitLebih3,
    ak_hariKerja: ak_hariKerja.value || 0,
    telat_hari: telat_hari.value || 0,
    telat_jam: telat_jam.value || 0,
    dl_kurang3: dlKurang3,
    dl_lebih3: dlLebih3,
    ak_CAP: ak_CAP.value || 0,
    ak_CT: ak_CT.value || 0,
    ak_CM: ak_CM.value || 0,
    ak_GL: ak_GL.value || 0,
    ak_CTB: ak_CTB.value || 0,
    shift: `LM:${shift_LM.value || 0}, P:${shift_P.value || 0}, S:${shift_S.value || 0}, M:${shift_M.value || 0}, OFF:${shift_OFF.value || 0}, Total:${shift_total.value || 0}`,
    persenKehadiran: persenKehadiran.value || '-',
    bulan: bulanFormatted,
    timestamp: new Date().toISOString()
  };

  try {
    await set(push(ref(db, 'RekapAbsensi')), hasilRekap);
    statusMsg.textContent = "✅ Data absensi berhasil disimpan ke database!";
    statusMsg.classList.add("text-green-600");
    document.querySelectorAll('input').forEach(i => i.value = '');
  } catch (error) {
    console.error("❌ Gagal menyimpan ke Firebase:", error);
    statusMsg.textContent = "❌ Terjadi kesalahan saat menyimpan data.";
    statusMsg.classList.add("text-red-600");
  }
});
</script>
</body>
</html>
