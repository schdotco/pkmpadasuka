<script type="module">
import { db } from './js/app.js';
import { ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";
import { auth } from './js/app.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

// 🔒 Cek login
onAuthStateChanged(auth, (user) => {
  if (!user) {
    alert("⚠️ Silakan login terlebih dahulu!");
    window.location.href = "login.html";
  }
});

const jenisPegawai = document.getElementById('jenisPegawai');
const comboInput = document.getElementById('comboInput');
const comboList = document.getElementById('comboList');
const fileUpload = document.getElementById('fileUpload');
const uploadBtn = document.getElementById('uploadBtn');
const statusMsg = document.getElementById('statusMsg');

let semuaPegawai = [];
let filteredPegawai = [];
let selectedPegawai = null;

// 🔹 Ambil data pegawai saat jenis dipilih
jenisPegawai.addEventListener('change', () => {
  const jenis = jenisPegawai.value;
  if (!jenis) return;

  comboInput.value = "";
  comboList.innerHTML = `<p class="text-gray-500 text-center py-2">Memuat data pegawai...</p>`;

  const pegawaiRef = ref(db, `Pegawai/${jenis}`);
  onValue(pegawaiRef, snapshot => {
    semuaPegawai = [];
    snapshot.forEach(child => {
      const data = child.val();
      if (data && data.nama) {
        semuaPegawai.push({
          id: child.key,
          nama: data.nama,
          gelar: data.gelar || '',
          jabatan: data.jabatan || ''
        });
      }
    });

    // Urutkan nama A-Z
    semuaPegawai.sort((a, b) => a.nama.localeCompare(b.nama));

    filteredPegawai = semuaPegawai;
    renderDropdown();
  });
});

// 🔍 Pencarian nama
comboInput.addEventListener('input', () => {
  const keyword = comboInput.value.toLowerCase();
  filteredPegawai = semuaPegawai.filter(p =>
    (p.nama && p.nama.toLowerCase().includes(keyword)) ||
    (p.gelar && p.gelar.toLowerCase().includes(keyword))
  );
  renderDropdown();
  comboList.style.display = keyword ? 'block' : 'none';
});

// 🔽 Render dropdown nama pegawai
function renderDropdown() {
  comboList.innerHTML = '';
  if (filteredPegawai.length === 0) {
    comboList.innerHTML = `<p class="text-gray-500 text-center py-2">Tidak ada pegawai ditemukan</p>`;
    return;
  }
  filteredPegawai.forEach(p => {
    const item = document.createElement('div');
    item.className = 'combo-item';
    item.innerHTML = `
      <div class="flex flex-col">
        <span class="font-medium">${p.nama}${p.gelar ? ' ' + p.gelar : ''}</span>
        ${p.jabatan ? `<span class="text-sm text-gray-500">${p.jabatan}</span>` : ''}
      </div>
    `;
    item.dataset.nama = p.nama;
    comboList.appendChild(item);
  });
}

// 🖱️ Klik pilihan pegawai
comboList.addEventListener('click', e => {
  if (e.target.closest('.combo-item')) {
    const item = e.target.closest('.combo-item');
    selectedPegawai = item.dataset.nama;
    comboInput.value = selectedPegawai;
    comboList.style.display = 'none';
  }
});

// Klik di luar -> tutup dropdown
document.addEventListener('click', e => {
  if (!e.target.closest('.combo-box')) comboList.style.display = 'none';
});

// 📤 Upload file + simpan ke Firebase
uploadBtn.addEventListener('click', async () => {
  const jenis = jenisPegawai.value;
  const file = fileUpload.files[0];

  if (!jenis) return statusMsg.textContent = "⚠️ Pilih jenis pegawai!";
  if (!selectedPegawai) return statusMsg.textContent = "⚠️ Pilih nama pegawai!";
  if (!file) return statusMsg.textContent = "⚠️ Pilih file rekap absensi!";

  statusMsg.textContent = `📤 Mengunggah "${file.name}" untuk ${selectedPegawai} (${jenis})...`;
  statusMsg.classList.remove("text-green-600", "text-red-600");

  try {
    const hasilRekap = {
      nama: selectedPegawai,
      jenisPegawai: jenis,
      fileName: file.name,
      uploadTime: new Date().toISOString()
    };

    await set(push(ref(db, 'RekapAbsensi')), hasilRekap);

    statusMsg.textContent = "✅ Data absensi berhasil disimpan ke database!";
    statusMsg.classList.add("text-green-600");

    fileUpload.value = "";
    comboInput.value = "";
    selectedPegawai = null;

  } catch (error) {
    console.error("❌ Gagal menyimpan:", error);
    statusMsg.textContent = "❌ Terjadi kesalahan saat menyimpan data.";
    statusMsg.classList.add("text-red-600");
  }
});
</script>
