<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Rekapan Absensi Pegawai</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-lg">
    <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">
      Upload Rekapan Absensi Pegawai
    </h1>

    <!-- Jenis Pegawai -->
    <div class="mb-4">
      <label for="jenisPegawai" class="block text-gray-700 font-medium mb-2">Jenis Pegawai</label>
      <select id="jenisPegawai" class="w-full p-3 border rounded-lg focus:ring focus:ring-blue-300">
        <option value="">-- Pilih Jenis Pegawai --</option>
        <option value="BLUD">BLUD</option>
        <option value="ASN">ASN</option>
      </select>
    </div>

    <!-- Nama Pegawai -->
    <div class="mb-4">
      <label for="namaPegawai" class="block text-gray-700 font-medium mb-2">Nama Pegawai</label>
      <input id="namaPegawai" type="text" placeholder="Masukkan Nama Pegawai"
             class="w-full p-3 border rounded-lg focus:ring focus:ring-blue-300">
    </div>

    <!-- Upload File -->
    <div class="mb-6">
      <label for="fileUpload" class="block text-gray-700 font-medium mb-2">Upload File Rekap Absensi (PDF/Excel)</label>
      <input id="fileUpload" type="file" accept=".pdf,.xls,.xlsx"
             class="w-full p-3 border rounded-lg cursor-pointer focus:ring focus:ring-blue-300">
    </div>

    <!-- Tombol Upload -->
    <button id="uploadBtn"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
      Upload & Proses Data
    </button>

    <!-- Status -->
    <div id="statusMsg" class="text-center text-gray-600 mt-4"></div>
  </div>

  <script>
    document.getElementById("uploadBtn").addEventListener("click", function () {
      const jenis = document.getElementById("jenisPegawai").value;
      const nama = document.getElementById("namaPegawai").value;
      const file = document.getElementById("fileUpload").files[0];

      if (!jenis || !nama || !file) {
        document.getElementById("statusMsg").textContent = "⚠️ Lengkapi semua field terlebih dahulu!";
        return;
      }

      document.getElementById("statusMsg").textContent = `📤 File "${file.name}" sedang diproses untuk ${nama} (${jenis})...`;
      // Tahap selanjutnya: kirim file ke backend untuk parsing & analisis
    });
  </script>

</body>
</html>
