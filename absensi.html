<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Rekapan Absensi Pegawai</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .combo-box { position: relative; width: 100%; }
    .combo-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
      outline: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .combo-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }
    .combo-list {
      position: absolute;
      top: 100%; left: 0; right: 0;
      background: white;
      border: 1px solid #ddd;
      border-top: none;
      border-radius: 0 0 0.5rem 0.5rem;
      max-height: 240px;
      overflow-y: auto;
      z-index: 50;
      display: none;
      animation: fadeIn 0.15s ease-in-out;
    }
    .combo-item {
      padding: 0.5rem 1rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .combo-item:hover { background: #f3f4f6; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-3xl">
    <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">
      Upload Rekapan Absensi Pegawai
    </h1>

    <!-- Jenis Pegawai -->
    <div class="mb-5">
      <label class="block text-gray-700 font-medium mb-2">Jenis Pegawai</label>
      <select id="jenisPegawai" class="w-full p-3 border rounded-lg focus:ring focus:ring-blue-300">
        <option value="">-- Pilih Jenis Pegawai --</option>
        <option value="BLUD">BLUD</option>
        <option value="ASN">ASN</option>
      </select>
    </div>

    <!-- Nama Pegawai (Dropdown Searchable) -->
    <div class="mb-5 combo-box">
      <label class="block text-gray-700 font-medium mb-2">Nama Pegawai</label>
      <input id="comboInput" type="text" placeholder="Cari atau pilih pegawai..." class="combo-input">
      <div id="comboList" class="combo-list"></div>
    </div>

    <!-- Upload File -->
    <div class="mb-6">
      <label class="block text-gray-700 font-medium mb-2">Upload File Rekap Absensi (PDF/Excel)</label>
      <input id="fileUpload" type="file" accept=".pdf,.xls,.xlsx"
             class="w-full p-3 border rounded-lg cursor-pointer focus:ring focus:ring-blue-300">
    </div>

    <button id="uploadBtn"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
      Upload & Proses Data
    </button>

    <div id="statusMsg" class="text-center text-gray-600 mt-4"></div>
  </div>

  <!-- 🔥 Firebase + Pegawai Dropdown -->
  <script type="module">
    import { db } from './app.js';
    import { ref, onValue } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    const jenisPegawai = document.getElementById('jenisPegawai');
    const comboInput = document.getElementById('comboInput');
    const comboList = document.getElementById('comboList');
    const fileUpload = document.getElementById('fileUpload');
    const uploadBtn = document.getElementById('uploadBtn');
    const statusMsg = document.getElementById('statusMsg');

    let semuaPegawai = [];
    let filteredPegawai = [];
    let selectedPegawai = null;

    // ✅ Ambil data pegawai dari Firebase
    const pegawaiRef = ref(db, 'Pegawai');
    onValue(pegawaiRef, snapshot => {
      semuaPegawai = [];
      snapshot.forEach(child => semuaPegawai.push({ id: child.key, ...child.val() }));
      filteredPegawai = semuaPegawai;
      renderDropdown();
    });

    // 🔍 Cari nama pegawai
    comboInput.addEventListener('input', () => {
      const keyword = comboInput.value.toLowerCase();
      filteredPegawai = semuaPegawai.filter(p =>
        p.nama.toLowerCase().includes(keyword) ||
        (p.gelar && p.gelar.toLowerCase().includes(keyword))
      );
      renderDropdown();
      comboList.style.display = keyword ? 'block' : 'none';
    });

    // 🧾 Render dropdown
    function renderDropdown() {
      comboList.innerHTML = '';
      if (filteredPegawai.length === 0) {
        comboList.innerHTML = `<p class="text-gray-500 text-center py-2">Tidak ada pegawai ditemukan</p>`;
        return;
      }
      filteredPegawai.forEach(p => {
        const item = document.createElement('div');
        item.className = 'combo-item';
        item.textContent = `${p.nama}${p.gelar ? ' ' + p.gelar : ''}`;
        item.dataset.nama = p.nama;
        comboList.appendChild(item);
      });
    }

    // 🧠 Pilih pegawai
    comboList.addEventListener('click', e => {
      if (e.target.classList.contains('combo-item')) {
        selectedPegawai = e.target.dataset.nama;
        comboInput.value = selectedPegawai;
        comboList.style.display = 'none';
      }
    });

    // ⬆️ Tutup dropdown kalau klik di luar
    document.addEventListener('click', e => {
      if (!e.target.closest('.combo-box')) comboList.style.display = 'none';
    });

    // 📤 Upload file
    uploadBtn.addEventListener('click', () => {
      const jenis = jenisPegawai.value;
      const file = fileUpload.files[0];
      if (!jenis) return statusMsg.textContent = "⚠️ Pilih jenis pegawai!";
      if (!selectedPegawai) return statusMsg.textContent = "⚠️ Pilih nama pegawai!";
      if (!file) return statusMsg.textContent = "⚠️ Pilih file rekap absensi!";
      statusMsg.textContent = `📤 File "${file.name}" sedang diproses untuk ${selectedPegawai} (${jenis})...`;
    });
  </script>
</body>
</html>
