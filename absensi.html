<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dropdown Searchable Pegawai</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* styling custom dropdown combobox */
    .combo-box {
      position: relative;
      width: 100%;
    }
    .combo-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #ccc;
      border-radius: 0.375rem;
      cursor: pointer;
    }
    .combo-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background-color: white;
      border: 1px solid #ccc;
      border-top: none;
      max-height: 200px;
      overflow-y: auto;
      z-index: 10;
      display: none;
    }
    .combo-item {
      padding: 0.5rem 1rem;
      cursor: pointer;
    }
    .combo-item:hover {
      background-color: #f3f4f6;
    }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-lg">
    <h2 class="text-xl font-semibold mb-4">Pilih Nama Pegawai</h2>

    <div class="combo-box">
      <input type="text" id="comboInput" class="combo-input" placeholder="Cari atau pilih nama pegawai…">
      <div id="comboList" class="combo-list"></div>
    </div>

    <div class="mt-4">
      <button id="btnSelect" class="px-4 py-2 bg-blue-600 text-white rounded-lg">Pilih</button>
    </div>

    <div id="selectedPegawai" class="mt-4 text-gray-700"></div>
  </div>

  <script type="module">
    import { db } from './app.js';
    import { ref, onValue } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    const comboInput = document.getElementById('comboInput');
    const comboList = document.getElementById('comboList');
    const btnSelect = document.getElementById('btnSelect');
    const selectedPegawaiDiv = document.getElementById('selectedPegawai');

    let semuaPegawai = [];
    let filteredPegawai = [];
    let selectedPegawai = null;

    // Ambil data pegawai
    const pegawaiRef = ref(db, 'Pegawai');
    onValue(pegawaiRef, snapshot => {
      semuaPegawai = [];
      snapshot.forEach(child => {
        semuaPegawai.push({ id: child.key, ...child.val() });
      });
      filteredPegawai = semuaPegawai;
      renderList();
    });

    // Render daftar dropdown
    function renderList() {
      comboList.innerHTML = '';
      filteredPegawai.forEach(p => {
        const div = document.createElement('div');
        div.className = 'combo-item';
        div.textContent = p.nama + (p.gelar ? ` ${p.gelar}` : '');
        div.dataset.id = p.id;
        div.dataset.nama = p.nama;
        comboList.append(div);

        div.addEventListener('click', () => {
          selectedPegawai = p;
          comboInput.value = p.nama + (p.gelar ? ` ${p.gelar}` : '');
          comboList.style.display = 'none';
        });
      });
    }

    // Event input search
    comboInput.addEventListener('input', () => {
      const kw = comboInput.value.toLowerCase();
      filteredPegawai = semuaPegawai.filter(p => {
        const full = p.nama.toLowerCase() + (p.gelar ? ` ${p.gelar.toLowerCase()}` : '');
        return full.includes(kw);
      });
      renderList();
      comboList.style.display = 'block';
    });

    // Klik di luar untuk menutup
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.combo-box')) {
        comboList.style.display = 'none';
      }
    });

    // Tombol “Pilih”
    btnSelect.addEventListener('click', () => {
      if (selectedPegawai) {
        selectedPegawaiDiv.textContent = `Pegawai terpilih: ${selectedPegawai.nama}` + (selectedPegawai.gelar ? ` ${selectedPegawai.gelar}` : '');
      } else {
        selectedPegawaiDiv.textContent = `⚠️ Belum memilih pegawai`;
      }
    });
  </script>

</body>
</html>
