<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Rekapan Absensi Pegawai</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Dropdown searchable style */
    .dropdown-container { position: relative; }
    .dropdown-list {
      position: absolute;
      z-index: 50;
      background: white;
      border: 1px solid #ddd;
      border-radius: 0.5rem;
      max-height: 200px;
      overflow-y: auto;
      width: 100%;
      display: none;
    }
    .dropdown-item {
      padding: 8px 12px;
      cursor: pointer;
    }
    .dropdown-item:hover {
      background-color: #f1f5f9;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-3xl">
    <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">
      Upload Rekapan Absensi Pegawai
    </h1>

    <!-- Jenis Pegawai -->
    <div class="mb-5">
      <label class="block text-gray-700 font-medium mb-2">Jenis Pegawai</label>
      <select id="jenisPegawai" class="w-full p-3 border rounded-lg focus:ring focus:ring-blue-300">
        <option value="">-- Pilih Jenis Pegawai --</option>
        <option value="BLUD">BLUD</option>
        <option value="ASN">ASN</option>
      </select>
    </div>

    <!-- Dropdown Nama Pegawai -->
    <div class="mb-5 dropdown-container">
      <label class="block text-gray-700 font-medium mb-2">Nama Pegawai</label>
      <input id="searchNama" type="text" placeholder="Cari atau pilih pegawai..."
             class="w-full p-3 border rounded-lg focus:ring focus:ring-blue-300">
      <div id="dropdownList" class="dropdown-list"></div>
    </div>

    <!-- Upload File -->
    <div class="mb-6">
      <label class="block text-gray-700 font-medium mb-2">Upload File Rekap Absensi (PDF/Excel)</label>
      <input id="fileUpload" type="file" accept=".pdf,.xls,.xlsx"
             class="w-full p-3 border rounded-lg cursor-pointer focus:ring focus:ring-blue-300">
    </div>

    <!-- Tombol Upload -->
    <button id="uploadBtn"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
      Upload & Proses Data
    </button>

    <!-- Status -->
    <div id="statusMsg" class="text-center text-gray-600 mt-4"></div>
  </div>

  <!-- Script Firebase -->
  <script type="module">
    import { db } from './app.js';
    import { ref, onValue } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    const jenisPegawai = document.getElementById('jenisPegawai');
    const searchNama = document.getElementById('searchNama');
    const dropdownList = document.getElementById('dropdownList');
    const fileUpload = document.getElementById('fileUpload');
    const uploadBtn = document.getElementById('uploadBtn');
    const statusMsg = document.getElementById('statusMsg');

    let semuaPegawai = [];
    let selectedPegawai = null;

    // 🔹 Ambil data Pegawai dari Firebase
    const dataRef = ref(db, 'Pegawai');
    onValue(dataRef, (snapshot) => {
      semuaPegawai = [];
      snapshot.forEach(child => {
        semuaPegawai.push({
          id: child.key,
          ...child.val()
        });
      });
      renderDropdown(semuaPegawai);
    });

    // 🔍 Filter saat mengetik
    searchNama.addEventListener('input', () => {
      const keyword = searchNama.value.toLowerCase();
      const filtered = semuaPegawai.filter(p =>
        p.nama.toLowerCase().includes(keyword) ||
        (p.gelar && p.gelar.toLowerCase().includes(keyword))
      );
      renderDropdown(filtered);
      dropdownList.style.display = keyword ? 'block' : 'none';
    });

    // ⬇️ Render daftar pegawai
    function renderDropdown(data) {
      dropdownList.innerHTML = '';
      if (data.length === 0) {
        dropdownList.innerHTML = `<p class="text-gray-500 text-center py-2">Tidak ada data pegawai.</p>`;
        return;
      }
      data.forEach(p => {
        const item = document.createElement('div');
        item.className = 'dropdown-item';
        item.textContent = `${p.nama}${p.gelar ? ' ' + p.gelar : ''}`;
        item.dataset.id = p.id;
        item.dataset.nama = p.nama;
        dropdownList.appendChild(item);
      });
    }

    // 🧠 Pilih pegawai dari dropdown
    dropdownList.addEventListener('click', (e) => {
      if (e.target.classList.contains('dropdown-item')) {
        const nama = e.target.dataset.nama;
        selectedPegawai = nama;
        searchNama.value = nama;
        dropdownList.style.display = 'none';
      }
    });

    // 📤 Tombol Upload
    uploadBtn.addEventListener('click', () => {
      const jenis = jenisPegawai.value;
      const file = fileUpload.files[0];

      if (!jenis) return (statusMsg.textContent = "⚠️ Pilih jenis pegawai!");
      if (!selectedPegawai) return (statusMsg.textContent = "⚠️ Pilih nama pegawai!");
      if (!file) return (statusMsg.textContent = "⚠️ Pilih file rekap absensi!");

      statusMsg.textContent = `📤 File "${file.name}" sedang diproses untuk ${selectedPegawai} (${jenis})...`;

      // TODO: kirim file + data pegawai ke backend
    });

    // ⬆️ Tutup dropdown kalau klik di luar
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.dropdown-container')) {
        dropdownList.style.display = 'none';
      }
    });
  </script>

</body>
</html>
