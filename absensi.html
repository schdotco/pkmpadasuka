<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Input Hasil Absensi Pegawai</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Choices.js (dropdown searchable) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

  <style>
    body { background:#f3f4f6 }
    .card { background:#fff; border-radius:12px; padding:28px; box-shadow:0 6px 20px rgba(2,6,23,0.08); max-width:960px; margin:40px auto; }
    label{ font-weight:600; display:block; margin-bottom:6px; color:#374151; }
    .combo-box .choices__inner { min-height:44px; border-radius:8px; }
  </style>
</head>

<body>
  <div class="card">
    <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">Input Hasil Rekapan Absensi Pegawai</h1>

    <!-- Nama Pegawai -->
    <div class="mb-4">
      <label for="namaPegawai">Nama Pegawai</label>
      <select id="namaPegawai">
        <option value="">-- Pilih Pegawai --</option>
      </select>
    </div>

    <!-- Bulan Rekapan -->
    <div class="mb-4">
      <label for="bulanRekap">Bulan Rekapan (Format: YYYY-MM)</label>
      <input id="bulanRekap" type="month" class="w-full p-3 border rounded-lg focus:ring focus:ring-blue-300">
    </div>

    <!-- Input hasil absensi -->
    <div class="grid grid-cols-2 gap-4 mb-4">
      <div>
        <label>1. Akumulasi Terlambat</label>
        <input id="ak_terlambat" class="w-full p-2 border rounded" />
      </div>
      <div>
        <label>2. Akumulasi Pulang Cepat</label>
        <input id="ak_pulangCepat" class="w-full p-2 border rounded" />
      </div>

      <div>
        <label>3. Akumulasi Sakit</label>
        <input id="ak_sakit" type="number" class="w-full p-2 border rounded" />
      </div>
      <div>
        <label>4. Akumulasi Sakit &gt; 3 Hari</label>
        <input id="ak_sakit3hari" type="number" readonly class="w-full p-2 border rounded bg-gray-50" />
      </div>

      <div>
        <label>5. Akumulasi Hari Kerja</label>
        <input id="ak_hariKerja" type="number" class="w-full p-2 border rounded" />
      </div>
      <div>
        <label>6. Jumlah Telat (hari & jam)</label>
        <input id="telat_hari_jam" class="w-full p-2 border rounded" placeholder="contoh: 3 hari (2j 30m)" />
      </div>

      <div>
        <label>7. Akumulasi DL &lt; 3 Hari</label>
        <input id="dl_kurang3" type="number" class="w-full p-2 border rounded" />
      </div>
      <div>
        <label>8. Akumulasi DL &gt; 3 Hari</label>
        <input id="dl_lebih3" type="number" readonly class="w-full p-2 border rounded bg-gray-50" />
      </div>

      <div>
        <label>9. Akumulasi CAP</label>
        <input id="ak_CAP" type="number" class="w-full p-2 border rounded" />
      </div>
      <div>
        <label>10. Akumulasi CT</label>
        <input id="ak_CT" type="number" class="w-full p-2 border rounded" />
      </div>

      <div>
        <label>11. Akumulasi CM</label>
        <input id="ak_CM" type="number" class="w-full p-2 border rounded" />
      </div>
      <div>
        <label>12. Akumulasi GL</label>
        <input id="ak_GL" type="number" class="w-full p-2 border rounded" />
      </div>

      <div>
        <label>13. Akumulasi CTB</label>
        <input id="ak_CTB" type="number" class="w-full p-2 border rounded" />
      </div>
      <div>
        <label>14. Untuk 3 Shift (LM, M, S, P, OFF, Total)</label>
        <input id="shift" class="w-full p-2 border rounded" placeholder="contoh: LM:5,M:8,S:6,P:4,OFF:7,Total:30" />
      </div>

      <div class="col-span-2">
        <label>15. Persen Kehadiran</label>
        <input id="persenKehadiran" class="w-full p-2 border rounded" placeholder="contoh: 95%" />
      </div>
    </div>

    <button id="saveBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg">
      💾 Simpan Hasil
    </button>

    <p id="statusMsg" class="text-center text-gray-600 mt-4"></p>
  </div>

  <!-- Firebase + logic -->
  <script type="module">
    import { db, auth } from './js/app.js';
    import { ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    // Pastikan login
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        alert('⚠️ Silakan login terlebih dahulu!');
        window.location.href = 'login.html';
      }
    });

    const namaSelect = document.getElementById('namaPegawai');
    const bulanRekap = document.getElementById('bulanRekap');
    const saveBtn = document.getElementById('saveBtn');
    const statusMsg = document.getElementById('statusMsg');

    // input elemen
    const ak_terlambat = document.getElementById('ak_terlambat');
    const ak_pulangCepat = document.getElementById('ak_pulangCepat');
    const ak_sakit = document.getElementById('ak_sakit');
    const ak_sakit3hari = document.getElementById('ak_sakit3hari');
    const ak_hariKerja = document.getElementById('ak_hariKerja');
    const telat_hari_jam = document.getElementById('telat_hari_jam');
    const dl_kurang3 = document.getElementById('dl_kurang3');
    const dl_lebih3 = document.getElementById('dl_lebih3');
    const ak_CAP = document.getElementById('ak_CAP');
    const ak_CT = document.getElementById('ak_CT');
    const ak_CM = document.getElementById('ak_CM');
    const ak_GL = document.getElementById('ak_GL');
    const ak_CTB = document.getElementById('ak_CTB');
    const shift = document.getElementById('shift');
    const persenKehadiran = document.getElementById('persenKehadiran');

    let choicesInstance = null;
    let pegawaiCache = [];

    // Ambil data pegawai dari Firebase
    const pegawaiRef = ref(db, 'Pegawai');
    onValue(pegawaiRef, snapshot => {
      pegawaiCache = [];
      snapshot.forEach(child => {
        const data = child.val();
        pegawaiCache.push({
          id: child.key,
          nama: data.nama || '',
          gelar: data.gelar || ''
        });
      });
      renderNamaOptions();
    });

    // Tampilkan nama ke dropdown
    function renderNamaOptions() {
      namaSelect.innerHTML = '<option value="">-- Pilih Pegawai --</option>';
      pegawaiCache.forEach(p => {
        const namaGelar = p.gelar ? `${p.nama} ${p.gelar}` : p.nama;
        const opt = document.createElement('option');
        opt.value = namaGelar;
        opt.textContent = namaGelar;
        namaSelect.appendChild(opt);
      });

      // aktifkan searchable dropdown
      if (choicesInstance) {
        choicesInstance.destroy();
        choicesInstance = null;
      }
      choicesInstance = new Choices(namaSelect, {
        searchEnabled: true,
        shouldSort: false,
        itemSelectText: '',
        searchPlaceholderValue: 'Cari nama pegawai...',
        removeItemButton: false
      });
    }

    // otomatis isi field pasangan
    ak_sakit.addEventListener('input', () => ak_sakit3hari.value = ak_sakit.value);
    dl_kurang3.addEventListener('input', () => dl_lebih3.value = dl_kurang3.value);

    // Simpan ke Firebase
    saveBtn.addEventListener('click', async () => {
      const nama = namaSelect.value;
      if (!nama) { statusMsg.textContent = '⚠️ Pilih nama pegawai!'; return; }
      if (!bulanRekap.value) { statusMsg.textContent = '⚠️ Pilih bulan rekap!'; return; }

      const hasil = {
        namaPegawai: nama,
        bulan: bulanRekap.value,
        ak_terlambat: ak_terlambat.value || '-',
        ak_pulangCepat: ak_pulangCepat.value || '-',
        ak_sakit: ak_sakit.value || '0',
        ak_sakit3hari: ak_sakit3hari.value || '0',
        ak_hariKerja: ak_hariKerja.value || '0',
        telat_hari_jam: telat_hari_jam.value || '-',
        dl_kurang3: dl_kurang3.value || '0',
        dl_lebih3: dl_lebih3.value || '0',
        ak_CAP: ak_CAP.value || '0',
        ak_CT: ak_CT.value || '0',
        ak_CM: ak_CM.value || '0',
        ak_GL: ak_GL.value || '0',
        ak_CTB: ak_CTB.value || '0',
        shift: shift.value || '-',
        persenKehadiran: persenKehadiran.value || '-',
        timestamp: new Date().toISOString()
      };

      try {
        await set(push(ref(db, 'RekapAbsensi')), hasil);
        statusMsg.textContent = '✅ Data berhasil disimpan!';
        statusMsg.classList.add('text-green-600');

        // reset form
        document.querySelectorAll('input').forEach(i => i.value = '');
        if (choicesInstance) choicesInstance.clearStore();
        renderNamaOptions();
      } catch (err) {
        console.error(err);
        statusMsg.textContent = '❌ Gagal menyimpan data.';
        statusMsg.classList.add('text-red-600');
      }
    });
  </script>
</body>
</html>
