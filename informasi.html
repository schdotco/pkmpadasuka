<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Input Jadwal Dokter - Puskesmas Padasuka</title>

  <!-- Choices.js untuk dropdown searchable -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js" defer></script>

  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:#f6f8fa; margin:0; }
    .navbar { background:#1976d2; color:#fff; display:flex; justify-content:space-between; align-items:center; padding:12px 20px; }
    .navbar h1{margin:0;font-size:18px}
    .container{max-width:900px;margin:30px auto;background:#fff;padding:24px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,0.08)}
    label{display:block;font-weight:600;margin-top:12px}
    select,input[type="text"]{width:100%;padding:10px;border-radius:6px;border:1px solid #ccc;margin-top:6px}
    button{margin-top:16px;width:100%;padding:12px;border-radius:6px;border:0;background:#1976d2;color:#fff;font-size:15px;cursor:pointer}
    button:hover{background:#125ca1}
    .note{margin-top:14px;color:#555;font-size:13px}
    .local-list { margin-top:18px; border-radius:6px; padding:12px; background:#fbfbfb; border:1px solid #eee; font-size:14px; }
    .local-list b{display:block;margin-bottom:8px}
  </style>
</head>
<body>
  <div class="navbar">
    <h1>🏥 Input Jadwal Dokter - Puskesmas Padasuka</h1>
    <div>
      <a href="dashboard.html" style="color:#fff;text-decoration:none;margin-right:12px">Dashboard</a>
      <a href="hasil-informasi.html" style="color:#fff;text-decoration:underline" target="_blank">Lihat Data (hasil-informasi)</a>
    </div>
  </div>

  <div class="container">
    <h2 style="color:#1976d2;margin:0 0 8px 0">🩺 Tambah Jadwal Dokter</h2>

    <label for="hari">Hari</label>
    <select id="hari">
      <option value="">-- Pilih Hari --</option>
      <option>Senin</option><option>Selasa</option><option>Rabu</option>
      <option>Kamis</option><option>Jumat</option><option>Sabtu</option>
    </select>

    <label for="nama">Nama Petugas</label>
    <select id="nama"><option value="">Memuat daftar pegawai...</option></select>

    <label for="unit">Unit Pelayanan</label>
    <input type="text" id="unit" placeholder="Contoh: Umum, Gigi, Lansia, KIA, dll">

    <label for="status">Status Kehadiran</label>
    <select id="status">
      <option value="">-- Pilih Status --</option>
      <option value="Ada">Ada</option>
      <option value="Tidak Ada">Tidak Ada</option>
      <option value="Cuti">Cuti</option>
    </select>

    <button id="btnSimpan">💾 Simpan Informasi</button>

    <div class="note">
      Data akan disimpan ke Firebase dan otomatis direset setiap jam 00:00. Untuk menampilkan data gunakan <code>hasil-informasi.html</code>.
    </div>

    <!-- Optional: List lokal ringkasan entri yang baru disimpan (client-side only, bukan realtime) -->
    <div class="local-list" id="localList" style="display:none">
      <b>Entri terbaru (sesi ini)</b>
      <div id="localItems"></div>
    </div>
  </div>

  <script type="module">
    import { db } from "./app.js";
    import { ref, get, push, set, update, remove } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

    const hariEl = document.getElementById('hari');
    const namaEl = document.getElementById('nama');
    const unitEl = document.getElementById('unit');
    const statusEl = document.getElementById('status');
    const btnSimpan = document.getElementById('btnSimpan');

    const localListWrap = document.getElementById('localList');
    const localItems = document.getElementById('localItems');
    const localBuffer = []; // menyimpan entri yang baru dibuat pada sesi ini (client-side)

    let choicesNamaInstance = null;
    let editKey = null; // untuk fitur edit (jika kamu pakai nanti)

    // Ambil daftar pegawai SEKALI (get) -> inisialisasi Choices.js
    (async function loadPegawai() {
      try {
        const pegawaiRef = ref(db, "Pegawai");
        const snap = await get(pegawaiRef);
        namaEl.innerHTML = `<option value="">-- Pilih Pegawai --</option>`;
        snap.forEach(ch => {
          const d = ch.val();
          const nama = d.gelar ? `${d.nama} ${d.gelar}` : d.nama;
          const opt = document.createElement('option');
          opt.value = nama;
          opt.textContent = nama;
          namaEl.appendChild(opt);
        });

        // init Choices once
        if (typeof Choices !== 'undefined') {
          if (choicesNamaInstance) choicesNamaInstance.destroy();
          choicesNamaInstance = new Choices(namaEl, {
            searchEnabled: true,
            shouldSort: false,
            itemSelectText: '',
            searchPlaceholderValue: 'Cari nama pegawai...'
          });
        }
      } catch (err) {
        console.error('Gagal memuat daftar pegawai:', err);
        alert('Gagal memuat daftar pegawai. Periksa koneksi atau konfigurasi Firebase.');
      }
    })();

    // Simpan data (push)
    btnSimpan.addEventListener('click', async () => {
      const hari = hariEl.value?.trim();
      const nama = namaEl.value?.trim();
      const unit = unitEl.value?.trim();
      const status = statusEl.value?.trim();

      if (!hari || !nama || !unit || !status) {
        alert('Lengkapi semua field sebelum menyimpan!');
        return;
      }

      try {
        const infoRef = ref(db, "informasi_dokter");
        if (editKey) {
          // Jika kelak ingin support edit dari halaman ini:
          await update(ref(db, `informasi_dokter/${editKey}`), { hari, nama, unit, status });
          alert('Data berhasil diperbarui.');
          editKey = null;
        } else {
          const newRef = push(infoRef);
          await set(newRef, {
            hari, nama, unit, status,
            tanggalInput: new Date().toISOString()
          });
          alert('Data berhasil disimpan.');
          // simpan ringkasan di local buffer (client-only)
          localBuffer.unshift({ hari, nama, unit, status, id: newRef.key, waktu: new Date().toLocaleString() });
          renderLocalBuffer();
        }

        // reset form
        hariEl.value = '';
        unitEl.value = '';
        statusEl.value = '';
        if (choicesNamaInstance) choicesNamaInstance.setChoiceByValue('');
      } catch (err) {
        console.error('Gagal menyimpan:', err);
        alert('❌ Gagal menyimpan: ' + (err.message || err));
      }
    });

    function renderLocalBuffer() {
      if (localBuffer.length === 0) {
        localListWrap.style.display = 'none';
        return;
      }
      localListWrap.style.display = 'block';
      localItems.innerHTML = '';
      localBuffer.slice(0, 10).forEach(it => {
        const div = document.createElement('div');
        div.style.marginBottom = '8px';
        div.textContent = `${it.waktu} — ${it.hari} • ${it.nama} • ${it.unit} • ${it.status}`;
        localItems.appendChild(div);
      });
    }

    // Reset otomatis jam 00:00 (lokal browser) — ini akan menghapus node 'informasi_dokter'
    function scheduleMidnightReset() {
      const now = new Date();
      const nextMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5);
      const ms = nextMidnight - now;
      setTimeout(async () => {
        try {
          await remove(ref(db, "informasi_dokter"));
          console.log('🔁 Reset otomatis: informasi_dokter dihapus pada', new Date().toLocaleString());
        } catch (err) {
          console.error('Gagal reset otomatis:', err);
        } finally {
          scheduleMidnightReset(); // jadwalkan untuk besok
        }
      }, ms);
    }
    scheduleMidnightReset();
  </script>
</body>
</html>
