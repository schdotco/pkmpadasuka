<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Jadwal Dokter - UPTD Puskesmas Padasuka</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
  <style>
    body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f6f8fa;margin:0; }
    .navbar { background:#1976d2;color:white;display:flex;justify-content:space-between;align-items:center;padding:12px 20px; }
    .navbar h1 { font-size:18px;margin:0; }
    .navbar .menu a { color:white;text-decoration:none;margin-left:15px;font-size:14px; }
    .navbar .menu a:hover { text-decoration:underline; }
    main { max-width:900px;margin:30px auto;background:white;padding:25px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    h2 { text-align:center;color:#1976d2;margin-bottom:20px; }
    select,input[type="text"]{width:100%;padding:10px;margin-bottom:15px;border-radius:6px;border:1px solid #ccc;font-size:14px;}
    button {width:100%;background:#1976d2;color:white;border:none;padding:12px;border-radius:6px;cursor:pointer;font-size:15px;}
    button:hover{background:#125ca1;}
    table{width:100%;border-collapse:collapse;margin-top:25px;}
    th,td{border:1px solid #ccc;padding:10px;text-align:center;}
    th{background-color:#1976d2;color:white;}
    tr:nth-child(even){background-color:#f2f2f2;}
    .action-btn{padding:6px 10px;border:none;border-radius:4px;color:white;cursor:pointer;font-size:13px;}
    .edit-btn{background:#ffa000;}
    .delete-btn{background:#d32f2f;}
    .edit-btn:hover{background:#ff8f00;}
    .delete-btn:hover{background:#b71c1c;}
    .footer{text-align:center;margin-top:20px;font-size:13px;color:#777;}
  </style>
</head>
<body>
  <div class="navbar">
    <h1>🏥 Input Jadwal Dokter - Puskesmas Padasuka</h1>
    <div class="menu">
      <a href="dashboard.html">Dashboard</a>
      <a href="hasil-informasi.html" target="_blank">Lihat Jadwal</a>
    </div>
  </div>

  <main>
    <h2>🩺 Tambah Jadwal Dokter</h2>

    <label>Hari</label>
    <select id="hari">
      <option value="">-- Pilih Hari --</option>
      <option>Senin</option><option>Selasa</option><option>Rabu</option>
      <option>Kamis</option><option>Jumat</option><option>Sabtu</option>
    </select>

    <label>Nama Petugas</label>
    <select id="nama"><option value="">Memuat daftar pegawai...</option></select>

    <label>Unit Pelayanan</label>
    <input type="text" id="unit" placeholder="Contoh: Umum, Gigi, Lansia, KIA, dll">

    <label>Status Kehadiran</label>
    <select id="status">
      <option value="">-- Pilih Status --</option>
      <option value="Ada">Ada</option>
      <option value="Tidak Ada">Tidak Ada</option>
      <option value="Cuti">Cuti</option>
    </select>

    <button id="btnSimpan">💾 Simpan Informasi</button>

    <h2 style="margin-top:40px;">📋 Daftar Jadwal Dokter</h2>
    <table id="tabelInformasi">
      <thead>
        <tr><th>Hari</th><th>Nama</th><th>Unit</th><th>Status</th><th>Aksi</th></tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="footer">Terhubung realtime & reset otomatis 00:00</div>
  </main>

  <script type="module">
    import { db } from "./app.js";
    import {
      ref, get, push, set, update, remove,
      onChildAdded, onChildChanged, onChildRemoved
    } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

    const hariSelect = document.getElementById("hari");
    const namaSelect = document.getElementById("nama");
    const unitInput = document.getElementById("unit");
    const statusSelect = document.getElementById("status");
    const btnSimpan = document.getElementById("btnSimpan");
    const tbody = document.querySelector("#tabelInformasi tbody");

    let editKey = null;
    let choicesNama;

    // --- Ambil daftar pegawai (sekali saja)
    const pegawaiRef = ref(db, "Pegawai");
    get(pegawaiRef).then((snap) => {
      namaSelect.innerHTML = `<option value="">-- Pilih Pegawai --</option>`;
      snap.forEach(child => {
        const data = child.val();
        const nama = data.gelar ? `${data.nama} ${data.gelar}` : data.nama;
        const opt = document.createElement("option");
        opt.value = nama;
        opt.textContent = nama;
        namaSelect.appendChild(opt);
      });
      choicesNama = new Choices(namaSelect, { searchEnabled:true, shouldSort:false, itemSelectText:'' });
    });

    const infoRef = ref(db, "informasi_dokter");

    // --- Tambah data
    btnSimpan.onclick = async () => {
      const hari = hariSelect.value.trim();
      const nama = namaSelect.value.trim();
      const unit = unitInput.value.trim();
      const status = statusSelect.value.trim();

      if (!hari || !nama || !unit || !status) {
        alert("⚠️ Lengkapi semua field!");
        return;
      }

      try {
        if (editKey) {
          await update(ref(db, "informasi_dokter/" + editKey), { hari, nama, unit, status });
          alert("✅ Data diperbarui!");
          editKey = null;
          btnSimpan.textContent = "💾 Simpan Informasi";
        } else {
          const newRef = push(infoRef);
          await set(newRef, { hari, nama, unit, status, tanggalInput: new Date().toISOString() });
          alert("✅ Data berhasil disimpan!");
        }
        // reset input
        hariSelect.value = "";
        unitInput.value = "";
        statusSelect.value = "";
        choicesNama.setChoiceByValue("");
      } catch (err) {
        alert("❌ Gagal menyimpan: " + err.message);
      }
    };

    // --- Realtime listener tanpa loop
    const renderRow = (id, data) => {
      const tr = document.createElement("tr");
      tr.id = `row-${id}`;
      tr.innerHTML = `
        <td>${data.hari}</td>
        <td>${data.nama}</td>
        <td>${data.unit}</td>
        <td>${data.status}</td>
        <td>
          <button class="action-btn edit-btn" data-id="${id}">✏️</button>
          <button class="action-btn delete-btn" data-id="${id}">🗑️</button>
        </td>`;
      tbody.prepend(tr);
    };

    onChildAdded(infoRef, (snap) => renderRow(snap.key, snap.val()));

    onChildChanged(infoRef, (snap) => {
      const row = document.getElementById(`row-${snap.key}`);
      if (row) row.outerHTML = `
        <tr id="row-${snap.key}">
          <td>${snap.val().hari}</td>
          <td>${snap.val().nama}</td>
          <td>${snap.val().unit}</td>
          <td>${snap.val().status}</td>
          <td>
            <button class="action-btn edit-btn" data-id="${snap.key}">✏️</button>
            <button class="action-btn delete-btn" data-id="${snap.key}">🗑️</button>
          </td>
        </tr>`;
    });

    onChildRemoved(infoRef, (snap) => {
      const row = document.getElementById(`row-${snap.key}`);
      if (row) row.remove();
    });

    // --- Edit / Delete handler
    tbody.onclick = async (e) => {
      const id = e.target.dataset.id;
      if (!id) return;
      if (e.target.classList.contains("edit-btn")) {
        const snap = await get(ref(db, "informasi_dokter/" + id));
        if (snap.exists()) {
          const d = snap.val();
          hariSelect.value = d.hari;
          unitInput.value = d.unit;
          statusSelect.value = d.status;
          choicesNama.setChoiceByValue(d.nama);
          editKey = id;
          btnSimpan.textContent = "🔄 Perbarui Data";
        }
      } else if (e.target.classList.contains("delete-btn")) {
        if (confirm("Hapus data ini?")) {
          await remove(ref(db, "informasi_dokter/" + id));
          alert("🗑️ Data dihapus!");
        }
      }
    };

    // --- Reset otomatis 00:00
    function resetDaily() {
      const now = new Date();
      const nextMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 2);
      setTimeout(async () => {
        await remove(infoRef);
        console.log("🕛 Data direset otomatis!");
        resetDaily();
      }, nextMidnight - now);
    }
    resetDaily();
  </script>
</body>
</html>
