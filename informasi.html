<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Jadwal Dokter - UPTD Puskesmas Padasuka</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
  <style>
    body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background:#f6f8fa; margin:0; padding:0; }
    .navbar { background:#1976d2; color:white; display:flex; justify-content:space-between; align-items:center; padding:12px 20px; }
    .navbar h1 { font-size:18px; margin:0; }
    .navbar .menu a { color:white; text-decoration:none; margin-left:15px; font-size:14px; }
    .navbar .menu a:hover { text-decoration:underline; }
    main { max-width:900px; margin:30px auto; background:white; padding:25px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    h2 { text-align:center; color:#1976d2; margin-bottom:20px; }
    label { font-weight:500; display:block; margin-bottom:6px; }
    select,input[type=text]{ width:100%; padding:10px; margin-bottom:15px; border-radius:6px; border:1px solid #ccc; font-size:14px; }
    button{ width:100%; background:#1976d2; color:white; border:none; padding:12px; border-radius:6px; cursor:pointer; font-size:15px; }
    button:hover{ background:#125ca1; }
    table{ width:100%; border-collapse:collapse; margin-top:25px; }
    th,td{ border:1px solid #ccc; padding:10px; text-align:center; }
    th{ background:#1976d2; color:white; }
    tr:nth-child(even){ background:#f2f2f2; }
    .action-btn{ padding:6px 10px; border:none; border-radius:4px; color:white; cursor:pointer; font-size:13px; }
    .edit-btn{ background:#ffa000; } .edit-btn:hover{ background:#ff8f00; }
    .delete-btn{ background:#d32f2f; } .delete-btn:hover{ background:#b71c1c; }
    .footer{ text-align:center; margin-top:20px; font-size:13px; color:#777; }
  </style>
</head>
<body>

  <div class="navbar">
    <h1>🏥 Input Jadwal Dokter - Puskesmas Padasuka</h1>
    <div class="menu">
      <a href="dashboard.html">Dashboard</a>
      <a href="hasil-informasi.html" target="_blank">Lihat Jadwal</a>
    </div>
  </div>

  <main>
    <h2>🩺 Tambah Jadwal Dokter</h2>

    <label for="hari">Hari</label>
    <select id="hari">
      <option value="">-- Pilih Hari --</option>
      <option>Senin</option><option>Selasa</option>
      <option>Rabu</option><option>Kamis</option>
      <option>Jumat</option><option>Sabtu</option>
    </select>

    <label for="nama">Nama Petugas</label>
    <select id="nama"><option>Memuat daftar pegawai...</option></select>

    <label for="unit">Unit Pelayanan</label>
    <input type="text" id="unit" placeholder="Contoh: Umum, Gigi, Lansia, KIA, dll">

    <label for="status">Status Kehadiran</label>
    <select id="status">
      <option value="">-- Pilih Status --</option>
      <option value="Ada">Ada</option>
      <option value="Tidak Ada">Tidak Ada</option>
      <option value="Cuti">Cuti</option>
    </select>

    <button id="btnSimpan">💾 Simpan Informasi</button>

    <h2 style="margin-top:40px;">📋 Daftar Jadwal Dokter</h2>
    <table id="tabelInformasi">
      <thead>
        <tr>
          <th>Hari</th><th>Nama</th><th>Unit</th><th>Status</th><th>Aksi</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="footer">🔄 Realtime & reset otomatis setiap 00:00</div>
  </main>

  <script type="module">
    import { db } from "./app.js";
    import { ref, onValue, push, set, update, remove, get } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

    const hariSelect = document.getElementById("hari");
    const namaSelect = document.getElementById("nama");
    const unitInput = document.getElementById("unit");
    const statusSelect = document.getElementById("status");
    const btnSimpan = document.getElementById("btnSimpan");
    const tbody = document.querySelector("#tabelInformasi tbody");

    let editKey = null;
    let choicesNama;
    let initialized = false;

    // 🔹 Ambil daftar pegawai hanya sekali
    const pegawaiRef = ref(db, "Pegawai");
    onValue(pegawaiRef, (snap) => {
      namaSelect.innerHTML = `<option value="">-- Pilih Pegawai --</option>`;
      snap.forEach(ch => {
        const d = ch.val();
        const nama = d.gelar ? `${d.nama} ${d.gelar}` : d.nama;
        const opt = document.createElement("option");
        opt.value = nama;
        opt.textContent = nama;
        namaSelect.appendChild(opt);
      });
      if (initialized && choicesNama) choicesNama.destroy();
      choicesNama = new Choices(namaSelect, {
        searchEnabled: true, shouldSort: false,
        itemSelectText: '', searchPlaceholderValue: 'Cari nama pegawai...'
      });
      initialized = true;
    }, { onlyOnce: true });

    // 🔹 Simpan atau update data
    btnSimpan.onclick = async () => {
      const hari = hariSelect.value.trim();
      const nama = namaSelect.value.trim();
      const unit = unitInput.value.trim();
      const status = statusSelect.value.trim();

      if (!hari || !nama || !unit || !status) return alert("⚠️ Lengkapi semua field!");

      try {
        if (editKey) {
          await update(ref(db, `informasi_dokter/${editKey}`), { hari, nama, unit, status });
          alert("✅ Data diperbarui!");
          editKey = null;
          btnSimpan.textContent = "💾 Simpan Informasi";
        } else {
          await push(ref(db, "informasi_dokter"), {
            hari, nama, unit, status, tanggalInput: new Date().toISOString()
          });
          alert("✅ Data berhasil disimpan!");
        }
        hariSelect.value = ""; unitInput.value = ""; statusSelect.value = "";
        choicesNama.setChoiceByValue("");
      } catch (err) {
        console.error(err);
        alert("❌ Gagal menyimpan: " + err.message);
      }
    };

    // 🔹 Tampilkan data realtime
    const infoRef = ref(db, "informasi_dokter");
    onValue(infoRef, (snap) => {
      tbody.innerHTML = "";
      const data = [];
      snap.forEach(ch => data.push({ key: ch.key, ...ch.val() }));
      data.sort((a,b)=> new Date(b.tanggalInput)-new Date(a.tanggalInput));
      data.forEach(d => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${d.hari}</td><td>${d.nama}</td><td>${d.unit}</td><td>${d.status}</td>
          <td>
            <button class="action-btn edit-btn" data-id="${d.key}">✏️</button>
            <button class="action-btn delete-btn" data-id="${d.key}">🗑️</button>
          </td>`;
        tbody.appendChild(tr);
      });
    });

    // 🔹 Edit / Delete handler
    tbody.onclick = async e => {
      const id = e.target.dataset.id;
      if (!id) return;

      if (e.target.classList.contains("edit-btn")) {
        const snap = await get(ref(db, `informasi_dokter/${id}`));
        if (!snap.exists()) return;
        const d = snap.val();
        hariSelect.value = d.hari;
        unitInput.value = d.unit;
        statusSelect.value = d.status;
        choicesNama.setChoiceByValue(d.nama);
        editKey = id;
        btnSimpan.textContent = "🔄 Perbarui Data";
      }

      if (e.target.classList.contains("delete-btn")) {
        if (confirm("Hapus data ini?")) {
          await remove(ref(db, `informasi_dokter/${id}`));
          alert("🗑️ Data dihapus!");
        }
      }
    };

    // 🔹 Reset otomatis jam 00:00 lokal
    const resetDaily = () => {
      const now = new Date();
      const nextMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1, 0, 0, 5);
      const ms = nextMidnight - now;
      setTimeout(async () => {
        await remove(ref(db, "informasi_dokter"));
        console.log("🕛 Data direset otomatis");
        resetDaily();
      }, ms);
    };
    resetDaily();
  </script>

</body>
</html>
