<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Input Jadwal Dokter - Puskesmas Padasuka</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

  <style>
    body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background:#f6f8fa; margin:0; }
    .navbar { background:#1976d2; color:#fff; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; }
    .navbar a { color:#fff; text-decoration:none; margin-left:15px; font-size:14px; }
    .navbar a:hover { text-decoration:underline; }

    main { max-width:600px; margin:30px auto; background:#fff; padding:25px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    h2 { color:#1976d2; text-align:center; }
    label { display:block; font-weight:600; margin-top:12px; }
    select, input[type=text] { width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; margin-top:6px; }
    button { width:100%; padding:12px; border:none; border-radius:6px; background:#1976d2; color:#fff; font-size:15px; margin-top:16px; cursor:pointer; }
    button:hover { background:#125ca1; }
    .footer { text-align:center; margin-top:15px; font-size:13px; color:#555; }
  </style>
</head>
<body>

  <div class="navbar">
    <h1>🏥 Input Jadwal Dokter</h1>
    <div>
      <a href="dashboard.html">Dashboard</a>
      <a href="hasil-informasi.html" target="_blank">Lihat Jadwal</a>
    </div>
  </div>

  <main>
    <h2>🩺 Tambah Jadwal Dokter</h2>

    <label>Hari</label>
    <select id="hari">
      <option value="">-- Pilih Hari --</option>
      <option>Senin</option><option>Selasa</option><option>Rabu</option>
      <option>Kamis</option><option>Jumat</option><option>Sabtu</option>
    </select>

    <label>Nama Petugas</label>
    <select id="nama"><option value="">Memuat daftar Pegawai...</option></select>

    <label>Unit Pelayanan</label>
    <input type="text" id="unit" placeholder="Contoh: Umum, Gigi, Lansia, KIA, dll">

    <label>Status Kehadiran</label>
    <select id="status">
      <option value="">-- Pilih Status --</option>
      <option value="Ada">Ada</option>
      <option value="Tidak Ada">Tidak Ada</option>
      <option value="Cuti">Cuti</option>
    </select>

    <button id="btnSimpan">💾 Simpan Informasi</button>

    <div class="footer">Data disimpan otomatis dan direset jam 00:00</div>
  </main>

  <script type="module">
    import { db } from "./app.js";
    import { ref, get, push, set, remove } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

    const hari = document.getElementById("hari");
    const nama = document.getElementById("nama");
    const unit = document.getElementById("unit");
    const status = document.getElementById("status");
    const btn = document.getElementById("btnSimpan");
    let choicesNama = null;

    // ================================
    //  🔥 LOAD DATA PEGAWAI (FIXED)
    // ================================
    const pegawaiRef = ref(db, "Pegawai");
    const snap = await get(pegawaiRef);

    // reset isi <select>
    nama.innerHTML = `<option value="">-- Pilih Pegawai --</option>`;

    snap.forEach(ch => {
      const d = ch.val();
      const nm = d.gelar ? `${d.nama} ${d.gelar}` : d.nama;

      const opt = document.createElement("option");
      opt.value = nm;
      opt.textContent = nm;
      nama.appendChild(opt);
    });

    // FIX: Refresh Choices setelah data terisi
    if (choicesNama) choicesNama.destroy();

    choicesNama = new Choices(nama, {
      searchEnabled: true,
      shouldSort: false,
      itemSelectText: '',
      searchPlaceholderValue: 'Cari nama pegawai...'
    });

    // ================================
    //  🔥 SIMPAN DATA
    // ================================
    btn.addEventListener("click", async () => {
      if (!hari.value || !nama.value || !unit.value || !status.value) {
        alert("⚠️ Lengkapi semua field!");
        return;
      }
      try {
        const infoRef = ref(db, "informasi_dokter");
        const newData = {
          hari: hari.value,
          nama: nama.value,
          unit: unit.value,
          status: status.value,
          tanggalInput: new Date().toISOString()
        };
        await set(push(infoRef), newData);
        alert("✅ Data berhasil disimpan!");
        window.location.reload();
      } catch (err) {
        console.error(err);
        alert("❌ Gagal menyimpan: " + err.message);
      }
    });

    // ================================
    //  🔥 RESET OTOMATIS 00:00
    // ================================
    const resetAtMidnight = () => {
      const now = new Date();
      const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 5);
      setTimeout(async () => {
        try {
          await remove(ref(db, "informasi_dokter"));
          console.log("🕛 Data reset otomatis:", new Date().toLocaleString());
        } catch (err) {
          console.error("Reset gagal:", err);
        } finally {
          resetAtMidnight();
        }
      }, next - now);
    };
    resetAtMidnight();
  </script>
</body>
</html>
