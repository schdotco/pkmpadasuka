<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Jadwal Dokter - UPTD Puskesmas Padasuka</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f6f8fa;
      margin: 0;
      padding: 0;
    }

    .navbar {
      background: #1976d2;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
    }
    .navbar h1 {
      font-size: 18px;
      margin: 0;
    }
    .navbar .menu a {
      color: white;
      text-decoration: none;
      margin-left: 15px;
      font-size: 14px;
    }
    .navbar .menu a:hover {
      text-decoration: underline;
    }

    main {
      max-width: 600px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #1976d2;
      margin-bottom: 20px;
    }

    label {
      font-weight: 500;
      display: block;
      margin-bottom: 6px;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    button {
      width: 100%;
      background: #1976d2;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #125ca1;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <h1>🏥 Input Jadwal Dokter - Puskesmas Padasuka</h1>
    <div class="menu">
      <a href="dashboard.html">Dashboard</a>
      <a href="hasil-informasi.html">Lihat Jadwal</a>
    </div>
  </div>

  <main>
    <h2>🩺 Tambah Jadwal Dokter</h2>

    <label for="hari">Hari</label>
    <select id="hari">
      <option value="">-- Pilih Hari --</option>
      <option>Senin</option>
      <option>Selasa</option>
      <option>Rabu</option>
      <option>Kamis</option>
      <option>Jumat</option>
      <option>Sabtu</option>
    </select>

    <label for="nama">Nama Petugas</label>
    <select id="nama">
      <option value="">Memuat daftar pegawai...</option>
    </select>

    <label for="unit">Unit Pelayanan</label>
    <input type="text" id="unit" placeholder="Contoh: Umum, Gigi, Lansia, KIA, dll">

    <label for="status">Status Kehadiran</label>
    <select id="status">
      <option value="">-- Pilih Status --</option>
      <option value="Ada">Ada</option>
      <option value="Tidak Ada">Tidak Ada</option>
      <option value="Cuti">Cuti</option>
    </select>

    <button id="btnSimpan">💾 Simpan Informasi</button>

    <div class="footer">Data akan muncul di halaman hasil-informasi.html</div>
  </main>

  <script type="module">
    import { db } from "./app.js";
    import { ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

    const namaSelect = document.getElementById("nama");
    const hariSelect = document.getElementById("hari");
    const unitInput = document.getElementById("unit");
    const statusSelect = document.getElementById("status");
    const btnSimpan = document.getElementById("btnSimpan");

    let PegawaiList = [];

    // 🔹 Ambil daftar pegawai dari Firebase (node: Pegawai)
    const pegawaiRef = ref(db, "Pegawai");
    onValue(pegawaiRef, (snapshot) => {
      PegawaiList = [];
      namaSelect.innerHTML = `<option value="">-- Pilih Pegawai --</option>`;
      snapshot.forEach(child => {
        const data = child.val();
        const namaLengkap = data.gelar ? `${data.nama} ${data.gelar}` : data.nama;
        PegawaiList.push(namaLengkap);
        const opt = document.createElement("option");
        opt.value = namaLengkap;
        opt.textContent = namaLengkap;
        namaSelect.appendChild(opt);
      });

      // Aktifkan searchable dropdown
      new Choices(namaSelect, {
        searchEnabled: true,
        shouldSort: false,
        itemSelectText: '',
        searchPlaceholderValue: 'Cari nama pegawai...'
      });
    });

    // 🔹 Simpan ke Firebase
    btnSimpan.addEventListener("click", async () => {
      const hari = hariSelect.value;
      const nama = namaSelect.value;
      const unit = unitInput.value.trim();
      const status = statusSelect.value;

      if (!hari || !nama || !unit || !status) {
        alert("⚠️ Lengkapi semua field sebelum menyimpan!");
        return;
      }

      try {
        const infoRef = ref(db, "informasi_dokter");
        const newRef = push(infoRef);
        await set(newRef, {
          hari,
          nama,
          unit,
          status,
          tanggalInput: new Date().toISOString()
        });

        alert("✅ Data berhasil disimpan!");
        hariSelect.value = "";
        unitInput.value = "";
        statusSelect.value = "";
        namaSelect.value = "";
      } catch (err) {
        alert("❌ Gagal menyimpan data: " + err.message);
      }
    });
  </script>

</body>
</html>
