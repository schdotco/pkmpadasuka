<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Padasuka - Sistem Jadwal</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css"/>

<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

<style>

body{
font-family:Segoe UI;
background:#f4f6f9;
margin:0;
}

/* HEADER */

header{
background:#2d73b9;
color:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:12px 20px;
}

header .title{
display:flex;
align-items:center;
gap:10px;
font-weight:600;
}

header nav a{
color:white;
text-decoration:none;
margin:0 10px;
font-size:14px;
}

header nav a:hover{
text-decoration:underline;
}

.logout{
background:white;
color:#2d73b9;
border:none;
padding:6px 12px;
border-radius:4px;
cursor:pointer;
}

/* MAIN */

main{
max-width:1200px;
margin:auto;
background:white;
padding:30px;
margin-top:20px;
border-radius:8px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

h2{
color:#1976d2;
border-bottom:2px solid #1976d2;
padding-bottom:6px;
}

.section{
margin-top:30px;
}

.row{
display:grid;
grid-template-columns:300px 1fr;
gap:15px;
margin-bottom:10px;
}

select,input{
padding:8px;
border:1px solid #ccc;
border-radius:4px;
}

.multi{
width:100%;
}

#preview{
margin-top:25px;
background:#f7f7f7;
padding:20px;
border-radius:6px;
white-space:pre-line;
}

button{
margin-top:10px;
padding:10px 15px;
border:none;
border-radius:4px;
cursor:pointer;
}

.preview-btn{background:#555;color:white}
.save-btn{background:#1976d2;color:white}

/* FOOTER */

footer{
background:#2d73b9;
color:white;
text-align:center;
padding:12px;
margin-top:40px;
font-size:13px;
}

</style>
</head>

<body>

<header>

<div class="title">
<img src="logo.png" height="35">
<span>Data & Informasi UPTD Puskesmas Padasuka</span>
</div>

<nav>
<a href="admin-dashboard.html">Dashboard</a>
<a href="profil.html">Profil</a>
<a href="pegawai.html">Pegawai</a>
<a href="kalender.html">Kalender</a>
</nav>

<button class="logout">Logout</button>

</header>

<main>

<h2>Daily Padasuka</h2>

<div class="row">
<label>Tanggal</label>
<input type="date" id="tanggal">
</div>

<div class="row">
<label>Dress Code</label>
<input type="text" id="dress">
</div>

<div class="row">
<label>Kegiatan Pagi</label>
<select id="kegiatanPagi">
<option>Apel</option>
<option>Morning Briefing</option>
<option>Rabu Mengaji</option>
</select>
</div>

<div class="row">
<label>Pemimpin Kegiatan</label>
<select class="pegawai multi" id="penceramah" multiple></select>
</div>

<div class="row">
<label>Penyuluhan 7.15</label>
<input type="text" id="penyuluhan">
</div>


<div class="section">

<h3>Tim Anjungan dan Piket</h3>

<div class="row">
<label>Pengatur Alur</label>
<select class="pegawai multi" id="alur" multiple></select>
</div>

<div class="row">
<label>Skrining BPJS</label>
<select class="pegawai multi" id="bpjs" multiple></select>
</div>

<div class="row">
<label>Cetak Antrol</label>
<select class="pegawai multi" id="antrol" multiple></select>
</div>

<div class="row">
<label>Pendaftaran + Kasir</label>
<select class="pegawai multi" id="daftarKasir" multiple></select>
</div>

<div class="row">
<label>Kasir</label>
<select class="pegawai multi" id="kasir" multiple></select>
</div>

<div class="row">
<label>Rekam Medis</label>
<select class="pegawai multi" id="rm" multiple></select>
</div>

<div class="row">
<label>Informasi & Rujukan</label>
<select class="pegawai multi" id="rujukan" multiple></select>
</div>

<div id="extraAnjungan"></div>
<button onclick="tambahKegiatan('extraAnjungan')">+ Tambah Kegiatan</button>

</div>


<button class="preview-btn" onclick="preview()">Preview</button>
<button class="save-btn" onclick="shareWA()">Share WhatsApp</button>

<div id="preview"></div>

</main>

<footer>
© 2025 UPTD Puskesmas Padasuka - Kota Bandung. All Rights Reserved.
</footer>

<script type="module">

import { db } from './app.js'
import { ref,onValue,set } from
"https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js"

let pegawai=[]

const pegawaiRef=ref(db,"Pegawai")
const autosaveRef=ref(db,"autosaveDaily/latest")

onValue(pegawaiRef,(snap)=>{

pegawai=[]

snap.forEach(c=>{
pegawai.push(c.val().nama)
})

loadDropdown()

setTimeout(loadAutosave,500)

})


function loadDropdown(){

document.querySelectorAll(".pegawai")
.forEach(sel=>{

sel.innerHTML=""

pegawai.forEach(n=>{
const o=document.createElement("option")
o.value=n
o.text=n
sel.appendChild(o)
})

const choice=new Choices(sel,{
removeItemButton:true,
searchEnabled:true
})

sel.choices=choice

})

}


function ambil(id){
return [...document.getElementById(id).selectedOptions]
.map(o=>o.value)
}

function ambilText(id){
return ambil(id).join(", ")
}


function tambahKegiatan(containerId){

const container=document.getElementById(containerId)

const index=container.querySelectorAll(".extra-item").length

const div=document.createElement("div")

div.className="extra-item"

div.innerHTML=`

<div class="row">
<label>Nama Kegiatan</label>
<input type="text" id="${containerId}_nama${index}">
</div>

<div class="row">
<label>Petugas</label>
<select class="pegawai multi" id="${containerId}_petugas${index}" multiple></select>
</div>

`

container.appendChild(div)

const select=document.getElementById(containerId+"_petugas"+index)

pegawai.forEach(n=>{
const opt=document.createElement("option")
opt.value=n
opt.text=n
select.appendChild(opt)
})

const choice=new Choices(select,{
removeItemButton:true,
searchEnabled:true
})

select.choices=choice

}


/* FUNGSI BARU UNTUK KEGIATAN TAMBAHAN */

function generateExtra(containerId){

let txt=""

const container=document.getElementById(containerId)

const items=container.querySelectorAll(".extra-item")

items.forEach((item,i)=>{

const nama=document.getElementById(containerId+"_nama"+i)?.value
const petugas=ambilText(containerId+"_petugas"+i)

if(nama){
txt+=nama+" : "+petugas+"\n"
}

})

return txt

}


async function simpanAutosave(){

const data={}

document.querySelectorAll("input, select").forEach(el=>{

if(!el.id) return

if(el.multiple){

data[el.id]=[...el.selectedOptions].map(o=>o.value)

}else{

data[el.id]=el.value

}

})

await set(autosaveRef,data)

}


function loadAutosave(){

onValue(autosaveRef,(snap)=>{

const data=snap.val()

if(!data) return

Object.keys(data).forEach(id=>{

const el=document.getElementById(id)

if(!el) return

if(el.multiple){

const values=data[id]

for(let opt of el.options){
if(values.includes(opt.value)){
opt.selected=true
}
}

if(el.choices){
el.choices.setChoiceByValue(values)
}

}else{
el.value=data[id]
}

})

})

}


function preview(){

simpanAutosave()

const txt=generate()

document.getElementById("preview").innerText=txt

}


function generate(){

let t=""

t+="*Daily Padasuka*\n"

t+= new Date(document.getElementById("tanggal").value)
.toLocaleDateString("id-ID",
{weekday:"long",day:"numeric",month:"long",year:"numeric"})+"\n"

t+="Dress code: "+document.getElementById("dress").value+"\n\n"

t+=document.getElementById("kegiatanPagi").value+" : "
+ambilText("penceramah")+"\n\n"

t+="*Penyuluhan 7.15 : "
+document.getElementById("penyuluhan").value+"*\n\n"

t+="*07.00 : Anjungan Antrian Daftar online*\n"
t+="*07.30 : Pendaftaran antrian offline*\n\n"

t+="*Tim Anjungan dan piket*\n"

t+="1. Pengatur Alur : "+ambilText("alur")+"\n"
t+="2. Skrining BPJS : "+ambilText("bpjs")+"\n"
t+="3. Cetak antrol : "+ambilText("antrol")+"\n"
t+="4. Pendaftaran + Kasir : "+ambilText("daftarKasir")+"\n"
t+="5. Kasir : "+ambilText("kasir")+"\n"
t+="6. Rekam Medis : "+ambilText("rm")+"\n"
t+="7. Informasi & Rujukan : "+ambilText("rujukan")+"\n"

t+=generateExtra("extraAnjungan")

t+="\n*KLASTER 1*\n"

t+="Rekon Aset : "+ambilText("aset")+"\n"
t+="Keuangan : "+ambilText("keuangan")+"\n"
t+="Surat Masuk : "+ambilText("surat")+"\n"
t+="Kepegawaian : "+ambilText("pegawai")+"\n"

t+=generateExtra("extraK1")

t+="\n*KLASTER 2*\n"

t+="KIA : "+ambilText("kia")+"\n"
t+="USG : "+ambilText("usg")+"\n"
t+="PONED PAGI : "+ambilText("ponedPagi")+"\n"
t+="PONED SORE : "+ambilText("ponedSore")+"\n"
t+="PONED MALAM : "+ambilText("ponedMalam")+"\n"

t+=generateExtra("extraK2")

t+="\n*KLASTER 3*\n"

t+="Penapisan : "+ambilText("penapisan")+"\n"
t+="Dewasa : "+ambilText("dewasa")+"\n"
t+="Lansia : "+ambilText("lansia")+"\n"

t+=generateExtra("extraK3")

t+="\n*KLASTER 5*\n"

t+="Gigi : "+ambilText("gigi")+"\n"
t+="Farmasi : "+ambilText("farmasi")+"\n"
t+="Lab : "+ambilText("lab")+"\n"
t+="IGD : "+ambilText("igd")+"\n"
t+="KIR/CKG : "+ambilText("kir")+"\n"

t+=generateExtra("extraK5")

t+="\n*Keamanan*\n"
t+=ambilText("satpam")+"\n\n"

t+="*Driver*\n"
t+=ambilText("driver")+"\n\n"

t+="*Cleaning Service*\n"
t+=ambilText("cs")+"\n"

t+=generateExtra("extraCS")

t+="\n🤍Siap Melayani Dengan Hati🤍"

return t
}


function shareWA(){

simpanAutosave()

const text=generate()

window.open(
"https://wa.me/?text="+encodeURIComponent(text)
)

}

window.preview=preview
window.shareWA=shareWA
window.tambahKegiatan=tambahKegiatan

</script>

</body>
</html>
