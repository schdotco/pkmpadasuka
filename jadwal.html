<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🗓️ Setting Jadwal Pegawai - Puskesmas Padasuka</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css"/>

<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

<style>

body{
font-family:Segoe UI;
margin:0;
background:#f4f6f9;
}

.navbar{
background:#1976d2;
color:white;
padding:12px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.navbar a{
color:white;
text-decoration:none;
margin-right:10px;
}

main{
max-width:1100px;
margin:auto;
background:white;
padding:20px;
margin-top:20px;
border-radius:8px;
}

.form-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.dropdown-row{
display:flex;
flex-wrap:wrap;
gap:8px;
}

.dropdown-row select{
width:200px;
height:38px;
}

button{
cursor:pointer;
}

.save-btn{
background:#1976d2;
color:white;
border:none;
padding:10px 20px;
border-radius:5px;
}

.btn-secondary{
background:#555;
color:white;
border:none;
padding:10px 15px;
border-radius:5px;
}

#previewBox{
margin-top:25px;
background:#f7f7f7;
padding:15px;
border-radius:6px;
white-space:pre-line;
display:none;
}

</style>
</head>

<body>

<div class="navbar">

<h3>🏛️ Data & Informasi UPTD Puskesmas Padasuka</h3>

<div>
<a href="admin-dashboard.html">Dashboard</a>
<a href="jadwal.html">Jadwal</a>
<a href="kalender.html">Kalender</a>
</div>

</div>


<main>

<h2>🗓️ Setting Jadwal Pegawai</h2>

<div class="form-grid">

<div>
<label>Tanggal</label>
<input type="date" id="jadwalTanggal">
</div>

<div>
<label>Dress Code</label>
<input type="text" id="dressCode">
</div>

<div>
<label>Pembina Briefing</label>
<select id="pembina"></select>
</div>

</div>


<h3>Screening CKG</h3>
<div class="dropdown-row" id="screeningCKG"></div>

<h3>BPJS</h3>
<div class="dropdown-row" id="bpjs"></div>

<h3>Rekam Medis</h3>
<div class="dropdown-row" id="rekamMedis"></div>

<h3>Kasir</h3>
<div class="dropdown-row" id="kasir"></div>

<h3>Farmasi</h3>
<div class="dropdown-row" id="farmasi"></div>


<div id="previewBox"></div>

<br>

<button id="previewBtn" class="btn-secondary">
Preview Jadwal
</button>

<button id="btnSimpanJadwal" class="save-btn">
💾 Simpan Jadwal
</button>

<button id="btnShareWA" class="btn-secondary">
📤 Share WhatsApp
</button>


</main>


<script type="module">

import {db} from './app.js';

import {
ref,
onValue,
push,
set
} from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";


let pegawaiList=[]

const pembinaSelect=document.getElementById("pembina")


const pegawaiRef=ref(db,"Pegawai")

onValue(pegawaiRef,(snapshot)=>{

pegawaiList=[]

pembinaSelect.innerHTML=""

snapshot.forEach(child=>{

const data=child.val()

const nama=data.gelar
? data.nama+" "+data.gelar
: data.nama

pegawaiList.push(nama)

const opt=document.createElement("option")
opt.value=nama
opt.textContent=nama

pembinaSelect.appendChild(opt)

})

generateDropdown()

})


function generateDropdown(){

createDropdown("screeningCKG",5)
createDropdown("bpjs",5)
createDropdown("rekamMedis",5)
createDropdown("kasir",3)
createDropdown("farmasi",3)

}


function createDropdown(id,jumlah){

const container=document.getElementById(id)

container.innerHTML=""

for(let i=0;i<jumlah;i++){

const select=document.createElement("select")

const def=document.createElement("option")

def.text="-- pilih pegawai --"
def.value=""

select.appendChild(def)

pegawaiList.forEach(n=>{

const opt=document.createElement("option")

opt.value=n
opt.text=n

select.appendChild(opt)

})

container.appendChild(select)

}

}



function ambilDataDropdown(){

const data={}

document.querySelectorAll(".dropdown-row")
.forEach(row=>{

const key=row.id

const nama=[]

row.querySelectorAll("select")
.forEach(sel=>{

if(sel.value!="")
nama.push(sel.value)

})

data[key]=nama

})

return data

}



function formatWA(data){

let txt=""

txt+="Daily Padasuka\n\n"

txt+="Tanggal : "+data.tanggal+"\n"
txt+="Dress Code : "+data.dressCode+"\n"
txt+="Pembina : "+data.pembina+"\n\n"

txt+="07.00 : Antrian online\n"
txt+="07.30 : Antrian offline\n\n"

Object.entries(data.kegiatan)
.forEach(([k,v])=>{

if(v.length>0)
txt+=k+" : "+v.join(", ")+"\n"

})

txt+="\n🤍Siap Melayani Dengan Hati🤍"

return txt

}



function previewJadwal(){

const data={

tanggal:document.getElementById("jadwalTanggal").value,

dressCode:document.getElementById("dressCode").value,

pembina:pembinaSelect.value,

kegiatan:ambilDataDropdown()

}

const txt=formatWA(data)

const box=document.getElementById("previewBox")

box.innerText=txt

box.style.display="block"

}


document
.getElementById("previewBtn")
.onclick=previewJadwal



document
.getElementById("btnSimpanJadwal")
.onclick=async()=>{

const data={

tanggal:document.getElementById("jadwalTanggal").value,

dressCode:document.getElementById("dressCode").value,

pembina:pembinaSelect.value,

kegiatan:ambilDataDropdown(),

dibuat:new Date().toISOString()

}

const jadwalRef=ref(db,"jadwal")

const newRef=push(jadwalRef)

await set(newRef,data)

alert("Jadwal berhasil disimpan")

}



document
.getElementById("btnShareWA")
.onclick=()=>{

const data={

tanggal:document.getElementById("jadwalTanggal").value,

dressCode:document.getElementById("dressCode").value,

pembina:pembinaSelect.value,

kegiatan:ambilDataDropdown()

}

const txt=formatWA(data)

const url="https://wa.me/?text="+encodeURIComponent(txt)

window.open(url)

}



function loadLastSchedule(){

const jadwalRef=ref(db,"jadwal")

onValue(jadwalRef,(snap)=>{

let last=null

snap.forEach(c=>{
last=c.val()
})

if(!last) return

document
.getElementById("jadwalTanggal")
.value=last.tanggal

document
.getElementById("dressCode")
.value=last.dressCode

pembinaSelect.value=last.pembina

})

}

setTimeout(loadLastSchedule,2000)

</script>


</body>
</html>
