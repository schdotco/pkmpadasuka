<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🗓️ Setting Jadwal Pegawai - Puskesmas Padasuka</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css"/>

<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

<style>

body{
font-family:Segoe UI;
margin:0;
background:#f4f6f9;
}

.navbar{
background:#1976d2;
color:white;
padding:12px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.navbar a{
color:white;
text-decoration:none;
margin-right:10px;
}

main{
max-width:1100px;
margin:auto;
background:white;
padding:20px;
margin-top:20px;
border-radius:8px;
}

.form-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.dropdown-row{
display:flex;
flex-wrap:wrap;
gap:8px;
}

.dropdown-row select{
width:200px;
height:38px;
}

button{
cursor:pointer;
}

.save-btn{
background:#1976d2;
color:white;
border:none;
padding:10px 20px;
border-radius:5px;
}

.btn-secondary{
background:#555;
color:white;
border:none;
padding:10px 15px;
border-radius:5px;
}

#previewBox{
margin-top:25px;
background:#f7f7f7;
padding:15px;
border-radius:6px;
white-space:pre-line;
display:none;
}

</style>
</head>

<body>

<div class="navbar">

<h3>🏛️ Data & Informasi UPTD Puskesmas Padasuka</h3>

<div>
<a href="admin-dashboard.html">Dashboard</a>
<a href="jadwal.html">Jadwal</a>
<a href="kalender.html">Kalender</a>
</div>

</div>


<main>

<h2>🗓️ Setting Jadwal Pegawai</h2>

<div class="form-grid">

<div>
<label>Tanggal</label>
<input type="date" id="jadwalTanggal">
</div>

<div>
<label>Dress Code</label>
<input type="text" id="dressCode">
</div>

<div>
<label>Pembina Briefing</label>
<select id="pembina"></select>
</div>

</div>


<h3>Screening CKG</h3>
<div class="dropdown-row" id="screeningCKG"></div>

<h3>BPJS</h3>
<div class="dropdown-row" id="bpjs"></div>

<h3>Rekam Medis</h3>
<div class="dropdown-row" id="rekamMedis"></div>

<h3>Kasir</h3>
<div class="dropdown-row" id="kasir"></div>

<h3>Farmasi</h3>
<div class="dropdown-row" id="farmasi"></div>


<div id="previewBox"></div>

<br>

<button id="previewBtn" class="btn-secondary">
Preview Jadwal
</button>

<button id="btnSimpanJadwal" class="save-btn">
💾 Simpan Jadwal
</button>

<button id="btnShareWA" class="btn-secondary">
📤 Share WhatsApp
</button>


</main>


<script type="module">

import { db } from './app.js';
import { ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

const pembinaSelect = document.getElementById("pembina");

let PegawaiList = [];


// =============================
// SANITIZE KEY
// =============================

function sanitizeKey(str){

return str.replace(/[.#$/\[\]/]/g,'_');

}


// =============================
// AMBIL DATA PEGAWAI
// =============================

const PegawaiRef = ref(db,"Pegawai");

onValue(PegawaiRef,(snapshot)=>{

PegawaiList=[];

pembinaSelect.innerHTML=`<option value="">-- Pilih Pembina --</option>`;

snapshot.forEach(child=>{

const data = child.val();

const namaLengkap = data.gelar
? `${data.nama} ${data.gelar}`
: data.nama;

PegawaiList.push(namaLengkap);

const opt=document.createElement("option");

opt.value=namaLengkap;
opt.textContent=namaLengkap;

pembinaSelect.appendChild(opt);

});

generateDropdowns();

});



// =============================
// GENERATE SEMUA DROPDOWN
// =============================

function generateDropdowns(){

document
.querySelectorAll(".dropdown-row")
.forEach(container=>{

const jumlah = container.dataset.jumlah || container.children.length || 3;

createDropdown(container.id,jumlah);

});



setTimeout(()=>{

document
.querySelectorAll(".dropdown-row select")
.forEach(sel=>{

if(typeof Choices!=="undefined"){

new Choices(sel,{
searchEnabled:true,
shouldSort:false,
itemSelectText:'',
searchPlaceholderValue:'Cari nama...'
});

}

});

},500);

}



// =============================
// CREATE DROPDOWN
// =============================

function createDropdown(containerId,jumlah){

const container=document.getElementById(containerId);

if(!container) return;

container.innerHTML="";

for(let i=0;i<jumlah;i++){

const select=document.createElement("select");

const optDefault=document.createElement("option");

optDefault.value="";
optDefault.textContent=`-- Pegawai ${i+1} --`;

select.appendChild(optDefault);

PegawaiList.forEach(nama=>{

const opt=document.createElement("option");

opt.value=nama;
opt.textContent=nama;

select.appendChild(opt);

});

container.appendChild(select);

}

}



// =============================
// AMBIL DATA SEMUA DROPDOWN
// =============================

function ambilSemuaData(){

const kegiatan={};

document
.querySelectorAll(".dropdown-group")
.forEach(group=>{

const label = group.querySelector("label").textContent.trim();

const key = sanitizeKey(label);

const pegawaiList = Array
.from(group.querySelectorAll("select"))
.map(sel=>sel.value)
.filter(v=>v!="");

kegiatan[key] = pegawaiList.length>0
? pegawaiList
: ["-"];

});

return kegiatan;

}



// =============================
// FORMAT WHATSAPP
// =============================

function formatWA(data){

const hari = new Date(data.tanggal)
.toLocaleDateString("id-ID",{
weekday:"long",
day:"numeric",
month:"long",
year:"numeric"
});

let text="";

text += `Daily Padasuka\n`;
text += `${hari}\n\n`;

text += `Dress code : ${data.dressCode}\n\n`;

text += `07.00 : Anjungan Antrian Daftar online\n`;
text += `07.30 : Pendaftaran antrian offline\n\n`;

text += `Tim Anjungan dan Piket\n`;

Object.entries(data.kegiatan)
.forEach(([kegiatan,pegawai])=>{

const nama = kegiatan.replace(/_/g," ");

text += `${nama} : ${pegawai.join(", ")}\n`;

});

text += `\n🤍Siap Melayani Dengan Hati🤍`;

return text;

}



// =============================
// PREVIEW
// =============================

document
.getElementById("btnPreview")
.addEventListener("click",()=>{

const data={

tanggal:document.getElementById("jadwalTanggal").value,

dressCode:document.getElementById("dressCode").value,

pembina:pembinaSelect.value,

kegiatan:ambilSemuaData()

};

const text = formatWA(data);

const preview=document.getElementById("previewBox");

preview.innerText=text;

preview.style.display="block";

});



// =============================
// SIMPAN FIREBASE
// =============================

document
.getElementById("btnSimpanJadwal")
.addEventListener("click",async()=>{

const dataJadwal={

tanggal:document.getElementById("jadwalTanggal").value,

dressCode:document.getElementById("dressCode").value,

pembina:pembinaSelect.value,

kegiatan:ambilSemuaData(),

dibuatPada:new Date().toISOString()

};

try{

const jadwalRef = ref(db,"jadwal");

const newRef = push(jadwalRef);

await set(newRef,dataJadwal);

alert("✅ Jadwal berhasil disimpan");

}
catch(err){

alert("❌ Gagal menyimpan jadwal : "+err.message);

}

});



// =============================
// SHARE WHATSAPP
// =============================

document
.getElementById("btnShareWA")
.addEventListener("click",()=>{

const data={

tanggal:document.getElementById("jadwalTanggal").value,

dressCode:document.getElementById("dressCode").value,

pembina:pembinaSelect.value,

kegiatan:ambilSemuaData()

};

const text = formatWA(data);

const url = "https://wa.me/?text="+encodeURIComponent(text);

window.open(url,"_blank");

});



// =============================
// LOAD JADWAL TERAKHIR
// =============================

function loadLastSchedule(){

const jadwalRef = ref(db,"jadwal");

onValue(jadwalRef,(snapshot)=>{

let lastData=null;

snapshot.forEach(child=>{
lastData=child.val();
});

if(!lastData) return;

document
.getElementById("jadwalTanggal")
.value = lastData.tanggal;

document
.getElementById("dressCode")
.value = lastData.dressCode;

pembinaSelect.value = lastData.pembina;

});

}

setTimeout(loadLastSchedule,1500);

</script>


</body>
</html>
