<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Daily Padasuka - Super Admin</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css"/>

<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

body{
font-family:Segoe UI;
background:#f4f6f9;
margin:0;
}

main{
max-width:1200px;
margin:auto;
background:white;
padding:30px;
margin-top:20px;
border-radius:8px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

h2{
color:#1976d2;
border-bottom:2px solid #1976d2;
padding-bottom:6px;
}

.section{
margin-top:30px;
}

.row{
display:grid;
grid-template-columns:300px 1fr;
gap:15px;
margin-bottom:10px;
}

select,input{
padding:8px;
border:1px solid #ccc;
border-radius:4px;
}

.multi{
width:100%;
}

#preview{
margin-top:25px;
background:#f7f7f7;
padding:20px;
border-radius:6px;
white-space:pre-line;
}

button{
margin-top:10px;
padding:10px 15px;
border:none;
border-radius:4px;
cursor:pointer;
}

.preview-btn{background:#555;color:white}
.save-btn{background:#1976d2;color:white}

.admin-btn{
background:#444;
color:white;
margin-right:5px;
}

</style>
</head>

<body>

<main>

<h2>Daily Padasuka</h2>

<div class="row">
<label>Tanggal</label>
<input type="date" id="tanggal">
</div>

<div class="row">
<label>Dress Code</label>
<input type="text" id="dress">
</div>

<div class="row">
<label>Kegiatan Pagi</label>
<select id="kegiatanPagi">
<option>Apel</option>
<option>Morning Briefing</option>
<option>Rabu Mengaji</option>
</select>
</div>

<div class="row">
<label>Pemimpin Kegiatan</label>
<select class="pegawai multi" id="penceramah" multiple></select>
</div>

<div class="row">
<label>Penyuluhan 7.15</label>
<input type="text" id="penyuluhan">
</div>

<!-- Struktur form utama Anda tetap sama -->
<!-- bagian lain tidak diubah -->

<div class="section">

<h3>Kegiatan Tambahan</h3>

<div id="extraContainer"></div>

<button onclick="tambahKegiatan()">+ Tambah Kegiatan</button>

</div>

<button class="preview-btn" onclick="preview()">Preview</button>
<button class="save-btn" onclick="shareWA()">Share WhatsApp</button>

<hr>

<button class="admin-btn" onclick="copyKemarin()">Copy Jadwal Kemarin</button>
<button class="admin-btn" onclick="simpanJadwal()">Simpan Jadwal</button>
<button class="admin-btn" onclick="loadRiwayat()">Riwayat Jadwal</button>
<button class="admin-btn" onclick="exportPDF()">Export PDF</button>

<div id="preview"></div>

</main>

<script type="module">

import { db } from './app.js'

import { ref,onValue,set,get }
from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js"

let pegawai=[]

const pegawaiRef=ref(db,"Pegawai")

onValue(pegawaiRef,(snap)=>{

pegawai=[]

snap.forEach(c=>{
pegawai.push(c.val().nama)
})

loadDropdown()

})


function loadDropdown(){

document.querySelectorAll(".pegawai")
.forEach(sel=>{

sel.innerHTML=""

pegawai.forEach(n=>{

const o=document.createElement("option")
o.value=n
o.text=n

sel.appendChild(o)

})

new Choices(sel,{
removeItemButton:true,
searchEnabled:true
})

})

}


function ambil(id){

const el=document.getElementById(id)

if(!el) return ""

return [...el.selectedOptions]
.map(o=>o.value).join(", ")

}


function tambahKegiatan(){

const container=document.getElementById("extraContainer")

const i=document.querySelectorAll(".extra-item").length

const div=document.createElement("div")

div.className="extra-item"

div.innerHTML=`
<div class="row">
<label>Nama Kegiatan</label>
<input type="text" id="extraNama${i}">
</div>

<div class="row">
<label>Petugas</label>
<select class="pegawai multi" id="extraPetugas${i}" multiple></select>
</div>
`

container.appendChild(div)

const sel=document.getElementById("extraPetugas"+i)

pegawai.forEach(n=>{
const o=document.createElement("option")
o.value=n
o.text=n
sel.appendChild(o)
})

new Choices(sel,{
removeItemButton:true,
searchEnabled:true
})

}


function generate(){

let t=""

t+="*Daily Padasuka*\n"

t+= new Date(document.getElementById("tanggal").value)
.toLocaleDateString("id-ID",
{weekday:"long",day:"numeric",month:"long",year:"numeric"})+"\n"

t+="Dress code: "+document.getElementById("dress").value+"\n\n"

t+=document.getElementById("kegiatanPagi").value+" : "
+ambil("penceramah")+"\n\n"

t+="*Penyuluhan 7.15 : "
+document.getElementById("penyuluhan").value+"*\n\n"

const extras=document.querySelectorAll(".extra-item")

extras.forEach((e,i)=>{

const nama=document.getElementById("extraNama"+i).value
const petugas=ambil("extraPetugas"+i)

if(nama){
t+=nama+" : "+petugas+"\n"
}

})

t+="\n🤍Siap Melayani Dengan Hati🤍"

return t

}


function preview(){

document.getElementById("preview").innerText=generate()

}


function shareWA(){

const text=generate()

window.open(
"https://wa.me/?text="+encodeURIComponent(text)
)

}


function kumpulkanData(){

const data={}

document.querySelectorAll("input,select").forEach(el=>{

if(el.tagName=="INPUT")
data[el.id]=el.value

else
data[el.id]=[...el.selectedOptions].map(o=>o.value)

})

return data

}


function simpanJadwal(){

const tanggal=document.getElementById("tanggal").value

if(!tanggal){
alert("Isi tanggal")
return
}

set(ref(db,"jadwal/"+tanggal),kumpulkanData())

alert("Jadwal tersimpan")

}


async function copyKemarin(){

const t=document.getElementById("tanggal").value

const d=new Date(t)

d.setDate(d.getDate()-1)

const key=d.toISOString().slice(0,10)

const snap=await get(ref(db,"jadwal/"+key))

if(!snap.exists()){
alert("Tidak ada jadwal kemarin")
return
}

const data=snap.val()

Object.keys(data).forEach(id=>{

const el=document.getElementById(id)

if(!el) return

if(el.tagName=="INPUT"){
el.value=data[id]
}else{
[...el.options].forEach(o=>{
o.selected=data[id]?.includes(o.value)
})
}

})

}


function loadRiwayat(){

onValue(ref(db,"jadwal"),snap=>{

let txt="Riwayat Jadwal\n\n"

snap.forEach(c=>{
txt+=c.key+"\n"
})

alert(txt)

})

}


function exportPDF(){

const el=document.getElementById("preview")

html2pdf().from(el).save("Daily-Padasuka.pdf")

}


window.preview=preview
window.shareWA=shareWA
window.tambahKegiatan=tambahKegiatan
window.copyKemarin=copyKemarin
window.simpanJadwal=simpanJadwal
window.loadRiwayat=loadRiwayat
window.exportPDF=exportPDF

</script>

</body>
</html>
