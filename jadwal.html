<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Setting Jadwal Pegawai - Puskesmas Padasuka</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css"/>

<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

<style>

body{
font-family:Segoe UI;
background:#f4f6f9;
margin:0;
}

.navbar{
background:#1976d2;
color:white;
padding:12px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.navbar a{
color:white;
text-decoration:none;
margin-right:10px;
}

main{
max-width:1200px;
margin:auto;
background:white;
padding:25px;
margin-top:25px;
border-radius:8px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

h2{
color:#1976d2;
border-bottom:2px solid #1976d2;
padding-bottom:5px;
}

.form-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.dropdown-row{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-bottom:10px;
}

.dropdown-row select{
width:200px;
height:38px;
}

.section{
margin-top:30px;
}

button{
cursor:pointer;
border:none;
border-radius:4px;
padding:10px 15px;
}

.save-btn{
background:#1976d2;
color:white;
}

.btn-secondary{
background:#555;
color:white;
}

#previewBox{
margin-top:25px;
background:#f7f7f7;
border:1px solid #ddd;
padding:20px;
border-radius:6px;
white-space:pre-line;
display:none;
}

</style>
</head>

<body>

<div class="navbar">

<h3>🏛️ Data & Informasi UPTD Puskesmas Padasuka</h3>

<div>
<a href="#">Dashboard</a>
<a href="#">Jadwal</a>
<a href="#">Kalender</a>
</div>

</div>


<main>

<h2>🗓️ Setting Jadwal Pegawai</h2>

<div class="form-grid">

<div>
<label>Tanggal</label>
<input type="date" id="jadwalTanggal">
</div>

<div>
<label>Dress Code</label>
<input type="text" id="dressCode">
</div>

<div>
<label>Pembina Briefing</label>
<select id="pembina"></select>
</div>

</div>


<div class="section">

<h3>Screening CKG</h3>
<div class="dropdown-group">
<div class="dropdown-row" id="screeningCKG"></div>
</div>

<h3>Pendaftaran & Skrining BPJS</h3>
<div class="dropdown-group">
<div class="dropdown-row" id="bpjs"></div>
</div>

<h3>Rekam Medis</h3>
<div class="dropdown-group">
<div class="dropdown-row" id="rekamMedis"></div>
</div>

<h3>Kasir</h3>
<div class="dropdown-group">
<div class="dropdown-row" id="kasir"></div>
</div>

<h3>Farmasi</h3>
<div class="dropdown-group">
<div class="dropdown-row" id="farmasi"></div>
</div>

<h3>Laboratorium</h3>
<div class="dropdown-group">
<div class="dropdown-row" id="lab"></div>
</div>

<h3>IGD Tindakan</h3>
<div class="dropdown-group">
<div class="dropdown-row" id="igd"></div>
</div>

<h3>Posyandu</h3>
<div class="dropdown-group">
<div class="dropdown-row" id="posyandu"></div>
</div>

<h3>Pusling</h3>
<div class="dropdown-group">
<div class="dropdown-row" id="pusling"></div>
</div>

<h3>Security</h3>
<div class="dropdown-group">
<div class="dropdown-row" id="satpam"></div>
</div>

<h3>Driver</h3>
<div class="dropdown-group">
<div class="dropdown-row" id="supir"></div>
</div>

<h3>Cleaning Service</h3>
<div class="dropdown-group">
<div class="dropdown-row" id="cs"></div>
</div>

</div>


<div id="previewBox"></div>

<br>

<button id="btnPreview" class="btn-secondary">Preview Jadwal</button>

<button id="btnSimpanJadwal" class="save-btn">💾 Simpan Jadwal</button>

<button id="btnShareWA" class="btn-secondary">📤 Share WhatsApp</button>


</main>



<script type="module">

import { db } from './app.js';

import {
ref,
onValue,
push,
set
} from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";


let pegawaiList=[];

const pembinaSelect=document.getElementById("pembina");



function sanitizeKey(str){
return str.replace(/[.#$/\[\]/]/g,'_');
}



const pegawaiRef=ref(db,"Pegawai");

onValue(pegawaiRef,(snapshot)=>{

pegawaiList=[];

pembinaSelect.innerHTML="";

snapshot.forEach(child=>{

const data=child.val();

const nama=data.gelar
? data.nama+" "+data.gelar
: data.nama;

pegawaiList.push(nama);

const opt=document.createElement("option");

opt.value=nama;
opt.textContent=nama;

pembinaSelect.appendChild(opt);

});

generateDropdowns();

});



function generateDropdowns(){

document
.querySelectorAll(".dropdown-row")
.forEach(row=>{

createDropdown(row.id,5);

});

}



function createDropdown(id,jumlah){

const container=document.getElementById(id);

container.innerHTML="";

for(let i=0;i<jumlah;i++){

const select=document.createElement("select");

const opt=document.createElement("option");

opt.value="";
opt.text="-- pilih pegawai --";

select.appendChild(opt);

pegawaiList.forEach(n=>{

const o=document.createElement("option");

o.value=n;
o.text=n;

select.appendChild(o);

});

container.appendChild(select);

}

}



function ambilSemuaData(){

const kegiatan={};

document
.querySelectorAll(".dropdown-row")
.forEach(row=>{

const key=row.id;

const nama=[];

row.querySelectorAll("select")
.forEach(sel=>{

if(sel.value!="")
nama.push(sel.value);

});

kegiatan[key]=nama;

});

return kegiatan;

}



function formatDaily(data){

let txt="";

txt+="*Daily Padasuka*\n\n";

txt+="Tanggal : "+data.tanggal+"\n";
txt+="Dress code : "+data.dressCode+"\n";
txt+="Pembina : "+data.pembina+"\n\n";

txt+="07.00 : Antrian online\n";
txt+="07.30 : Antrian offline\n\n";

Object.entries(data.kegiatan)
.forEach(([k,v])=>{

if(v.length>0)

txt+=k+" : "+v.join(", ")+"\n";

});

txt+="\n🤍Siap Melayani Dengan Hati🤍";

return txt;

}



document
.getElementById("btnPreview")
.onclick=()=>{

const data={

tanggal:document.getElementById("jadwalTanggal").value,

dressCode:document.getElementById("dressCode").value,

pembina:pembinaSelect.value,

kegiatan:ambilSemuaData()

};

const txt=formatDaily(data);

const box=document.getElementById("previewBox");

box.innerText=txt;

box.style.display="block";

};



document
.getElementById("btnSimpanJadwal")
.onclick=async()=>{

const data={

tanggal:document.getElementById("jadwalTanggal").value,

dressCode:document.getElementById("dressCode").value,

pembina:pembinaSelect.value,

kegiatan:ambilSemuaData(),

dibuat:new Date().toISOString()

};

const jadwalRef=ref(db,"jadwal");

const newRef=push(jadwalRef);

await set(newRef,data);

alert("Jadwal berhasil disimpan");

};



document
.getElementById("btnShareWA")
.onclick=()=>{

const data={

tanggal:document.getElementById("jadwalTanggal").value,

dressCode:document.getElementById("dressCode").value,

pembina:pembinaSelect.value,

kegiatan:ambilSemuaData()

};

const txt=formatDaily(data);

const url="https://wa.me/?text="+encodeURIComponent(txt);

window.open(url);

};



function loadLastSchedule(){

const jadwalRef=ref(db,"jadwal");

onValue(jadwalRef,(snap)=>{

let last=null;

snap.forEach(c=>{
last=c.val();
});

if(!last) return;

document
.getElementById("jadwalTanggal")
.value=last.tanggal;

document
.getElementById("dressCode")
.value=last.dressCode;

pembinaSelect.value=last.pembina;

});

}

setTimeout(loadLastSchedule,1500);

</script>


</body>
</html>
