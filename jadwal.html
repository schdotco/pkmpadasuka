<!DOCTYPE html> 
<html lang="id"> 
<head> 

<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 

<title>Daily Padasuka - Sistem Jadwal</title> 

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css"/>

<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

<style>

body{
font-family:Segoe UI;
background:#f4f6f9;
margin:0;
}

main{
max-width:1200px;
margin:auto;
background:white;
padding:30px;
margin-top:20px;
border-radius:8px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

h2{
color:#1976d2;
border-bottom:2px solid #1976d2;
padding-bottom:6px;
}

.section{
margin-top:30px;
}

.row{
display:grid;
grid-template-columns:300px 1fr;
gap:15px;
margin-bottom:10px;
}

select,input{
padding:8px;
border:1px solid #ccc;
border-radius:4px;
}

.multi{
width:100%;
}

#preview{
margin-top:25px;
background:#f7f7f7;
padding:20px;
border-radius:6px;
white-space:pre-line;
}

button{
margin-top:10px;
padding:10px 15px;
border:none;
border-radius:4px;
cursor:pointer;
}

.preview-btn{background:#555;color:white}
.save-btn{background:#1976d2;color:white}

</style>
</head>

<body>

<main>

<h2>Daily Padasuka</h2>

<div class="row">
<label>Tanggal</label>
<input type="date" id="tanggal">
</div>

<div class="row">
<label>Dress Code</label>
<input type="text" id="dress">
</div>

<div class="row">
<label>Kegiatan Pagi</label>
<select id="kegiatanPagi">
<option>Apel</option>
<option>Morning Briefing</option>
<option>Rabu Mengaji</option>
</select>
</div>

<div class="row">
<label>Pemimpin Kegiatan</label>
<select class="pegawai multi" id="penceramah" multiple></select>
</div>

<div class="row">
<label>Penyuluhan 7.15</label>
<input type="text" id="penyuluhan">
</div>

<div class="section">

<h3>Tim Anjungan dan Piket</h3>

<div class="row">
<label>Pengatur Alur</label>
<select class="pegawai multi" id="alur" multiple></select>
</div>

<div class="row">
<label>Skrining BPJS</label>
<select class="pegawai multi" id="bpjs" multiple></select>
</div>

<div class="row">
<label>Cetak Antrol</label>
<select class="pegawai multi" id="antrol" multiple></select>
</div>

<div class="row">
<label>Pendaftaran + Kasir</label>
<select class="pegawai multi" id="daftarKasir" multiple></select>
</div>

<div class="row">
<label>Kasir</label>
<select class="pegawai multi" id="kasir" multiple></select>
</div>

<div class="row">
<label>Rekam Medis</label>
<select class="pegawai multi" id="rm" multiple></select>
</div>

<div class="row">
<label>Informasi & Rujukan</label>
<select class="pegawai multi" id="rujukan" multiple></select>
</div>

</div>


<div class="section">

<h3>KLASTER 1</h3>

<div class="row">
<label>Rekon Aset</label>
<select class="pegawai multi" id="aset" multiple></select>
</div>

<div class="row">
<label>Keuangan</label>
<select class="pegawai multi" id="keuangan" multiple></select>
</div>

<div class="row">
<label>Surat Masuk</label>
<select class="pegawai multi" id="surat" multiple></select>
</div>

<div class="row">
<label>Kepegawaian</label>
<select class="pegawai multi" id="pegawai" multiple></select>
</div>

</div>


<div class="section">

<h3>KLASTER 2</h3>

<div class="row">
<label>KIA</label>
<select class="pegawai multi" id="kia" multiple></select>
</div>

<div class="row">
<label>USG</label>
<select class="pegawai multi" id="usg" multiple></select>
</div>

<div class="row">
<label>PONED PAGI</label>
<select class="pegawai multi" id="ponedPagi" multiple></select>
</div>

<div class="row">
<label>PONED SORE</label>
<select class="pegawai multi" id="ponedSore" multiple></select>
</div>

<div class="row">
<label>PONED MALAM</label>
<select class="pegawai multi" id="ponedMalam" multiple></select>
</div>

</div>


<div class="section">

<h3>KLASTER 3</h3>

<div class="row">
<label>Penapisan</label>
<select class="pegawai multi" id="penapisan" multiple></select>
</div>

<div class="row">
<label>Dewasa</label>
<select class="pegawai multi" id="dewasa" multiple></select>
</div>

<div class="row">
<label>Lansia</label>
<select class="pegawai multi" id="lansia" multiple></select>
</div>

</div>


<div class="section">

<h3>KLASTER 5</h3>

<div class="row">
<label>Gigi</label>
<select class="pegawai multi" id="gigi" multiple></select>
</div>

<div class="row">
<label>Farmasi</label>
<select class="pegawai multi" id="farmasi" multiple></select>
</div>

<div class="row">
<label>Lab</label>
<select class="pegawai multi" id="lab" multiple></select>
</div>

<div class="row">
<label>IGD</label>
<select class="pegawai multi" id="igd" multiple></select>
</div>

</div>


<div class="section">

<h3>Keamanan</h3>
<select class="pegawai multi" id="satpam" multiple></select>

<h3>Driver</h3>
<select class="pegawai multi" id="driver" multiple></select>

<h3>Cleaning Service</h3>
<select class="pegawai multi" id="cs" multiple></select>

</div>


<button class="preview-btn" onclick="preview()">Preview</button>

<button class="save-btn" onclick="shareWA()">Share WhatsApp</button>

<div id="preview"></div>

</main>


<script type="module">

import { db } from './app.js'
import { ref,onValue } from
"https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js"

let pegawai=[]

const pegawaiRef=ref(db,"Pegawai")

onValue(pegawaiRef,(snap)=>{

pegawai=[]

snap.forEach(c=>{
pegawai.push(c.val().nama)
})

loadDropdown()

})


function loadDropdown(){

document.querySelectorAll(".pegawai")
.forEach(sel=>{

sel.innerHTML=""

pegawai.forEach(n=>{

const o=document.createElement("option")
o.value=n
o.text=n

sel.appendChild(o)

})

new Choices(sel,{
removeItemButton:true,
searchEnabled:true
})

})

}


function ambil(id){
return [...document.getElementById(id).selectedOptions]
.map(o=>o.value).join(", ")
}


function preview(){
const txt = generate()
document.getElementById("preview").innerText = txt
}


function generate(){

let t=""

t+="*Daily Padasuka*\n"

t+= new Date(document.getElementById("tanggal").value)
.toLocaleDateString("id-ID",
{weekday:"long",day:"numeric",month:"long",year:"numeric"})+"\n"

t+="Dress code: "+document.getElementById("dress").value+"\n\n"

t+=document.getElementById("kegiatanPagi").value+" : "
+ambil("penceramah")+"\n\n"

t+="*Penyuluhan 7.15 : "
+document.getElementById("penyuluhan").value+"*\n\n"

t+="*07.00 : Anjungan Antrian Daftar online*\n"
t+="*07.30 : Pendaftaran antrian offline*\n\n"

t+="*Tim Anjungan dan piket*\n"

t+="1. Pengatur Alur : "+ambil("alur")+"\n"
t+="2. Skrining BPJS : "+ambil("bpjs")+"\n"
t+="3. Cetak antrol : "+ambil("antrol")+"\n"
t+="4. Pendaftaran + Kasir : "+ambil("daftarKasir")+"\n"
t+="5. Kasir : "+ambil("kasir")+"\n"
t+="6. Rekam Medis : "+ambil("rm")+"\n"
t+="7. Informasi & Rujukan : "+ambil("rujukan")+"\n\n"

t+="*KLASTER 1*\n"
t+="Rekon Aset : "+ambil("aset")+"\n"
t+="Keuangan : "+ambil("keuangan")+"\n"
t+="Surat : "+ambil("surat")+"\n"
t+="Kepegawaian : "+ambil("pegawai")+"\n\n"

t+="*KLASTER 2*\n"
t+="KIA : "+ambil("kia")+"\n"
t+="USG : "+ambil("usg")+"\n"
t+="PONED PAGI : "+ambil("ponedPagi")+"\n"
t+="PONED SORE : "+ambil("ponedSore")+"\n"
t+="PONED MALAM : "+ambil("ponedMalam")+"\n\n"

t+="*KLASTER 3*\n"
t+="Penapisan : "+ambil("penapisan")+"\n"
t+="Dewasa : "+ambil("dewasa")+"\n"
t+="Lansia : "+ambil("lansia")+"\n\n"

t+="*KLASTER 5*\n"
t+="Gigi : "+ambil("gigi")+"\n"
t+="Farmasi : "+ambil("farmasi")+"\n"
t+="Lab : "+ambil("lab")+"\n"
t+="IGD : "+ambil("igd")+"\n\n"

t+="*Keamanan*\n"+ambil("satpam")+"\n\n"
t+="*Driver*\n"+ambil("driver")+"\n\n"
t+="*Cleaning Service*\n"+ambil("cs")+"\n\n"

t+="🤍Siap Melayani Dengan Hati🤍"

return t
}


function shareWA(){

const text = generate()

window.open(
"https://wa.me/?text="+encodeURIComponent(text)
)

}

window.preview = preview;
window.shareWA = shareWA;

</script>

</body>
</html>
