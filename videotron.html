<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fullscreen YouTube Loop</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: black;
    height: 100%;
    width: 100%;
  }
  #player {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none; /* agar layar tidak bisa diklik */
  }
  /* Tombol pertama untuk enable suara */
  #startBtn {
    position: fixed;
    inset: 0;
    margin: auto;
    padding: 20px 40px;
    background: #ffffffcc;
    border-radius: 8px;
    font-size: 22px;
    cursor: pointer;
    border: none;
  }
</style>
</head>
<body>

<button id="startBtn">▶ Mulai</button>
<div id="player"></div>

<script>
const VIDEO_ID = "O_VENeZ58yY"; // ← GANTI DENGAN ID VIDEO KAMU

let player;

function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', {
    videoId: VIDEO_ID,
    playerVars: {
      autoplay: 1,
      controls: 0,
      loop: 1,
      playlist: VIDEO_ID,
      modestbranding: 1,
      mute: 1, // awalnya mute, nanti kita unmute saat user klik
      playsinline: 1
    },
    events: {
      onReady: function() { player.playVideo(); }
    }
  });
}

document.getElementById("startBtn").addEventListener("click", () => {
  player.unMute();    // Hidupkan suara
  player.setVolume(100);
  player.playVideo();
  document.getElementById("startBtn").style.display = "none"; // Sembunyikan tombol
});

// Load YouTube API
const tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);
</script>
</body>
</html>
