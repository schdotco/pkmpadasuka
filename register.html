<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registrasi - Data & Informasi UPTD Puskesmas Padasuka</title>
  <style>
    /* 🌐 Gaya umum */
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: #f4f6f9;
    }

    header {
      background: linear-gradient(90deg, #1565c0, #1976d2);
      color: #fff;
      text-align: center;
      padding: 16px;
      font-size: 18px;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      letter-spacing: 0.3px;
    }

    main {
      display: flex;
      flex: 1;
      flex-wrap: wrap;
    }

    /* 🔹 Panel kiri */
    .left-panel {
      background: linear-gradient(180deg, #1976d2, #1565c0);
      color: #fff;
      flex: 1;
      min-width: 320px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      text-align: center;
    }

    .left-panel img {
      width: 160px;
      margin-bottom: 25px;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,0.2));
    }

    .left-panel h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .left-panel p {
      font-size: 15px;
      line-height: 1.6;
      max-width: 340px;
      opacity: 0.9;
    }

    /* 🔹 Panel kanan */
    .right-panel {
      flex: 1;
      min-width: 320px;
      background: #f9fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .card {
      background: #fff;
      padding: 30px 28px;
      border-radius: 12px;
      box-shadow: 0 5px 12px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid #e3e8ef;
      transition: box-shadow 0.3s ease;
    }

    .card:hover {
      box-shadow: 0 8px 18px rgba(25,118,210,0.15);
    }

    .card h3 {
      text-align: center;
      color: #1976d2;
      margin-bottom: 6px;
      font-size: 20px;
      font-weight: 600;
    }

    .card input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
      transition: border 0.2s ease;
    }

    .card input:focus {
      outline: none;
      border-color: #1976d2;
      box-shadow: 0 0 0 2px rgba(25,118,210,0.2);
    }

    .card button {
      background: #1976d2;
      color: #fff;
      border: none;
      padding: 10px;
      font-size: 15px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      font-weight: 500;
      transition: background 0.2s ease;
    }

    .card button:hover {
      background: #125ca1;
    }

    .link {
      text-align: center;
      font-size: 14px;
      margin-top: 5px;
    }

    .link a {
      color: #1976d2;
      text-decoration: none;
      font-weight: 500;
    }

    .link a:hover {
      text-decoration: underline;
    }

    #adminCode {
      margin-top: 5px;
      display: none;
    }

    footer {
      background: #1976d2;
      color: #e3f2fd;
      text-align: center;
      padding: 12px;
      font-size: 13px;
    }

    footer b {
      color: #fff;
    }

    @media (max-width: 768px) {
      .left-panel {
        padding: 30px 20px;
      }
      .left-panel img {
        width: 120px;
      }
      .left-panel h1 {
        font-size: 22px;
      }
      .card {
        padding: 25px;
      }
    }
  </style>
</head>
<body>
  <header>Registrasi Akun - Data & Informasi UPTD Puskesmas Padasuka</header>

  <main>
    <!-- Panel kiri -->
    <div class="left-panel">
      <img src="https://imgbox.com/0ptQ0Rmm" alt="Logo Puskesmas" />
      <h1>Gabung Sekarang</h1>
      <p>Buat akun untuk mengakses portal <b>Data & Informasi UPTD Puskesmas Padasuka</b>.</p>
    </div>

    <!-- Panel kanan -->
    <div class="right-panel">
      <div class="card">
        <h3>Registrasi</h3>
        <input type="text" id="regName" placeholder="Nama Lengkap" />
        <input type="email" id="regEmail" placeholder="Email" />
        <input type="password" id="regPassword" placeholder="Password" />

        <!-- Kolom kode rahasia admin -->
        <input type="text" id="adminCode" placeholder="Masukkan kode admin (optional)" />

        <!-- Tombol untuk menampilkan kolom kode -->
        <div class="link">
          <a href="#" onclick="toggleAdminCode(event)">Punya kode admin?</a>
        </div>

        <button id="btnRegister">Daftar</button>
        <div class="link">Sudah punya akun? <a href="login.html">Login</a></div>
      </div>
    </div>
  </main>

  <footer>© 2025 <b>UPTD Puskesmas Padasuka</b> - Kota Bandung</footer>

  <!-- Script Registrasi -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDciAiNKFbh8aoM8joIywSeH9Boml1tK5s",
      authDomain: "aplikasi-jadwal-1d54d.firebaseapp.com",
      databaseURL: "https://aplikasi-jadwal-1d54d-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "aplikasi-jadwal-1d54d",
      storageBucket: "aplikasi-jadwal-1d54d.firebasestorage.app",
      messagingSenderId: "860941812271",
      appId: "1:860941812271:web:458bd63c5b0d2514fcbcda"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    window.toggleAdminCode = (e) => {
      e.preventDefault();
      const codeField = document.getElementById('adminCode');
      codeField.style.display = codeField.style.display === 'none' ? 'block' : 'none';
    };

    document.getElementById('btnRegister').addEventListener('click', async () => {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const adminCode = document.getElementById('adminCode').value.trim();

      if (!name || !email || !password) {
        alert("Harap isi semua kolom.");
        return;
      }

      const SECRET_ADMIN_CODE = "jayajayajayakayaraya";

      let role = "user";
      if (adminCode && adminCode === SECRET_ADMIN_CODE) {
        role = "admin";
      } else if (adminCode && adminCode !== SECRET_ADMIN_CODE) {
        alert("Kode admin salah!");
        return;
      }

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        await updateProfile(user, { displayName: name });

        await set(ref(db, 'users/' + user.uid), {
          name: name,
          email: email,
          role: role
        });

        alert(`Registrasi berhasil sebagai ${role === 'admin' ? '👑 Admin' : '👤 User'}`);
        window.location.href = "login.html";
      } catch (err) {
        alert("Registrasi gagal: " + err.message);
      }
    });
  </script>
</body>
</html>
