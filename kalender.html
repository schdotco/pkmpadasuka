<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📅 Kalender Cuti Pegawai - Admin | UPTD Puskesmas Padasuka</title>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
    }

    /* 🔹 Navbar */
    .navbar {
      background: #1976d2;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
    }

    .navbar h1 {
      font-size: 18px;
      margin: 0;
    }

    .navbar .menu {
      display: flex;
      gap: 15px;
    }

    .navbar .menu a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
    }

    .navbar .menu a:hover {
      text-decoration: underline;
    }

    .navbar button {
      background: #fff;
      color: #1976d2;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    .navbar button:hover {
      background: #e3f2fd;
    }

    /* 🔹 Container utama */
    .container {
      max-width: 1100px;
      margin: 40px auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 25px 30px;
    }

    h2 {
      color: #1976d2;
      text-align: center;
      margin-top: 0;
      margin-bottom: 20px;
    }

    /* 🔹 Header kalender */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .calendar-header button {
      background: #1976d2;
      color: white;
      border: none;
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 4px;
    }

    .calendar-header button:hover {
      background: #125ca1;
    }

    /* 🔹 Grid kalender */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .day-header {
      font-weight: bold;
      text-align: center;
      background: #e3f2fd;
      padding: 6px;
      border-radius: 4px;
    }

    .day-cell {
      min-height: 110px;
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 6px;
      font-size: 13px;
      position: relative;
      overflow-y: auto;
      max-height: 160px;
    }

    .day-number {
      font-weight: bold;
      margin-bottom: 3px;
      color: #1976d2;
    }

    .cuti-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .cuti-list li {
      background: #e1f5fe;
      color: #1976d2;
      padding: 3px 5px;
      margin-bottom: 3px;
      border-radius: 3px;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .no-day {
      background: transparent;
      border: none;
    }

    footer {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-top: 30px;
      padding-bottom: 20px;
    }
  </style>
</head>

<body>

  <!-- 🔹 Navbar -->
  <div class="navbar">
    <h1>📅 Kalender Cuti Pegawai</h1>
    <div class="menu">
      <a href="dashboard.html">Dashboard</a>
      <a href="cuti-user.html">Pengajuan</a>
      <a href="cuti-admin.html">Persetujuan</a>
      <a href="cuti-list.html">Daftar</a>
      <a href="kalender.html"><b>Kalender</b></a>
    </div>
    <button onclick="window.location.href='admin-dashboard.html'">Kembali</button>
  </div>
  
  <!-- 🔹 Kalender -->
  <div class="container">
    <div class="calendar-header">
      <button id="prevMonth">&lt; Sebelumnya</button>
      <h2 id="monthYear"></h2>
      <button id="nextMonth">Berikutnya &gt;</button>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

  <footer>© 2025 UPTD Puskesmas Padasuka - Semua Hak Dilindungi</footer>

  <!-- 🔹 Script Kalender -->
  <script type="module">
    import { db } from './app.js';
    import { ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

    const calendarGrid = document.getElementById('calendarGrid');
    const monthYearLabel = document.getElementById('monthYear');
    const prevMonthBtn = document.getElementById('prevMonth');
    const nextMonthBtn = document.getElementById('nextMonth');

    const dayNames = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
    let currentDate = new Date();
    let approvedCuti = [];

      // 👤 Load data user saat login
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "login.html";
      return;
    }
    document.getElementById('profileName').value = user.displayName || "";
    document.getElementById('profileEmail').value = user.email;

    // Ambil foto profil dari database jika ada (optional)
    const snap = await get(ref(db, 'users/' + user.uid));
    if (snap.exists() && snap.val().photoURL) {
      document.getElementById('profilePicPreview').src = snap.val().photoURL;
    }
  });

    // 🔹 Ambil data cuti yang sudah Disetujui
    onValue(ref(db, 'pengajuan_cuti'), (snapshot) => {
      approvedCuti = [];

      snapshot.forEach(child => {
        const data = child.val();
        const status = (data.status || '').toLowerCase();

        if (status === 'disetujui' || status === 'approved' || status === 'approve') {
          approvedCuti.push({
            nama: data.nama || 'Tidak diketahui',
            start: new Date(data.tanggalMulai),
            end: new Date(data.tanggalSelesai)
          });
        }
      });

      renderCalendar(currentDate);
    });

    // 🔹 Fungsi render kalender
    function renderCalendar(date) {
      calendarGrid.innerHTML = '';

      // Header hari
      dayNames.forEach(day => {
        const div = document.createElement('div');
        div.className = 'day-header';
        div.textContent = day;
        calendarGrid.appendChild(div);
      });

      const year = date.getFullYear();
      const month = date.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      monthYearLabel.textContent = date.toLocaleString('id-ID', { month: 'long', year: 'numeric' });

      // Sel kosong sebelum tanggal 1
      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-cell no-day';
        calendarGrid.appendChild(emptyCell);
      }

      // Tanggal dalam bulan
      for (let day = 1; day <= daysInMonth; day++) {
        const cellDate = new Date(year, month, day);
        const cell = document.createElement('div');
        cell.className = 'day-cell';

        // Nomor tanggal
        const dayNumber = document.createElement('div');
        dayNumber.className = 'day-number';
        dayNumber.textContent = day;
        cell.appendChild(dayNumber);

        // Daftar cuti
        const ul = document.createElement('ul');
        ul.className = 'cuti-list';

        // 🔹 Tambahkan semua pegawai yang cuti di tanggal ini
        approvedCuti.forEach(cuti => {
          if (cellDate >= cuti.start && cellDate <= cuti.end) {
            const li = document.createElement('li');
            li.textContent = cuti.nama;
            ul.appendChild(li);
          }
        });

        cell.appendChild(ul);
        calendarGrid.appendChild(cell);
      }
    }

    // 🔹 Navigasi bulan
    prevMonthBtn.onclick = () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar(currentDate);
    };

    nextMonthBtn.onclick = () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar(currentDate);
    };

    // 🔹 Render awal
    renderCalendar(currentDate);
  </script>
</body>
</html>
