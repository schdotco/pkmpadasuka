<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Pencarian Data Anak Berdasarkan NIK</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: Arial, sans-serif; background:#f4f6f8; padding:20px; }
.box { background:white; padding:20px; border-radius:10px; max-width:480px; margin:auto; box-shadow:0 0 10px rgba(0,0,0,0.1); }
input, button { width:100%; padding:10px; margin-top:10px; border:1px solid #ccc; border-radius:6px; }
button { background:#2b7cff; color:white; border:none; cursor:pointer; }
button:hover { background:#1a5edb; }
.label { font-weight:bold; margin-top:15px; display:block; }
</style>
</head>

<body>
<div class="box">
  <h2>Pencarian Data Anak</h2>

  <label class="label">Masukkan NIK Anak</label>
  <input type="text" id="nikInput" placeholder="Masukkan NIK...">

  <button onclick="cariData()">Cari Data</button>

  <div id="hasil" style="margin-top:20px; display:none;">
      <h3>Data Ditemukan</h3>

      <label class="label">NIK</label>
      <input type="text" id="nik" readonly>

      <label class="label">Nama Anak</label>
      <input type="text" id="nama_anak" readonly>

      <label class="label">Tanggal Lahir</label>
      <input type="text" id="tgl_lahir" readonly>
  </div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>

<script>
// 1. Konfigurasi Firebase
const firebaseConfig = {
  apiKey: "AIzaSyCIruNCiYTVhISuBWMotTfUYZbW8JKrLGE",
  authDomain: "padasuka-juara.firebaseapp.com",
  projectId: "padasuka-juara",
  storageBucket: "padasuka-juara.firebasestorage.app",
  messagingSenderId: "469740864914",
  appId: "1:469740864914:web:f17b3112a2d2e841666d4b"
};

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 2. Variabel global untuk menyimpan seluruh data hasil bridging
let bridgedData = {};


// 3. Fungsi Cari Data Berdasarkan NIK
function cariData() {
    let nikInput = document.getElementById("nikInput").value.trim();

    if (nikInput === "") {
        alert("Masukkan NIK dahulu");
        return;
    }

    // Ambil data dari Firebase (table data-anak)
    firebase.database().ref("data-anak").orderByChild("NIK").equalTo(nikInput)
    .once("value", snapshot => {
        if (snapshot.exists()) {

            snapshot.forEach(child => {
                let data = child.val();

                // simpan semua data untuk kebutuhan bridging
                bridgedData = data;

                // tampilkan hanya 3 kolom
                document.getElementById("nik").value = data.NIK;
                document.getElementById("nama_anak").value = data["NAMA ANAK"];
                document.getElementById("tgl_lahir").value = data["TANGGAL LAHIR (YYYY/MM/DD)"];

                document.getElementById("hasil").style.display = "block";
            });

        } else {
            alert("Data tidak ditemukan!");
        }
    });
}

</script>
</body>
</html>
