<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Formulir Pendaftaran – Firebase</title>

<style>
  body { font-family: Inter, system-ui, Arial; background:#f6f7fb; padding:20px; color:#111827; }
  .container { max-width:900px; margin:0 auto; background:#fff; border-radius:12px; padding:22px; box-shadow:0 6px 18px rgba(0,0,0,0.06); }

  h1 { margin:0 0 10px; font-size:20px; }
  h3 { margin-top:25px; }
  .row { display:flex; gap:12px; margin-top:10px; }
  .col { flex:1; min-width:140px; }

  label { display:block; font-size:13px; margin-bottom:6px; color:#374151; }
  input, select, textarea {
    width:100%; padding:8px 10px; border-radius:8px;
    border:1px solid #e5e7eb; font-size:14px;
  }

  textarea { height:80px; }

  .actions { display:flex; gap:8px; margin-top:20px; }
  button { padding:10px 14px; border-radius:8px; border:0; cursor:pointer; font-weight:600; }
  .btn-primary { background:#2563eb; color:white; }
  .btn-clear { background:#efefef; color:#111827; }

  #preFill { background:#e0f2fe; padding:10px; border-radius:8px; margin-top:12px; display:none; }
</style>
</head>

<body>
<div class="container">
<h1>Formulir Pendaftaran</h1>

<!-- PENCARIAN NIK -->
<div class="row">
  <div class="col">
    <label for="search_nik">Masukkan NIK</label>
    <input id="search_nik" type="text" placeholder="NIK anak" />
  </div>

  <div class="col" style="align-self:flex-end;">
    <button type="button" id="btnSearch" class="btn-clear">Cek Data</button>
  </div>
</div>

<div id="preFill"></div>

<!-- FORM -->
<form id="regForm">

  <!-- HANYA 3 field utama yg tampil -->
  <div class="row">
    <div class="col">
      <label>Nama Lengkap</label>
      <input id="nama_lengkap" name="nama_lengkap" type="text" required />
    </div>

    <div class="col">
      <label>NIK</label>
      <input id="nik" name="nik" type="text" required />
    </div>
  </div>

  <div class="row">
    <div class="col">
      <label>Tanggal Lahir</label>
      <input id="tanggal_lahir" name="tanggal_lahir" type="date" required />
    </div>
  </div>

  <!-- FIELD LAIN (tetap hidden) -->
  <input type="hidden" id="nama_institusi" name="nama_institusi" />
  <input type="hidden" id="jenis_kelamin" name="jenis_kelamin" />
  <input type="hidden" id="tempat_lahir" name="tempat_lahir" />
  <input type="hidden" id="usia" name="usia" />
  <input type="hidden" id="gol_darah" name="gol_darah" />
  <input type="hidden" id="nomor_hp" name="nomor_hp" />
  <input type="hidden" id="alamat" name="alamat" />
  <input type="hidden" id="nama_orangtua" name="nama_orangtua" />
  <input type="hidden" id="nik_orangtua" name="nik_orangtua" />
  <input type="hidden" id="jenis_disabilitas" name="jenis_disabilitas" />
  <input type="hidden" id="pernyataan" name="pernyataan" />

  <!-- =========================== -->
  <!--     INPUT PEMERIKSAAN       -->
  <!-- =========================== -->

  <h3>Input Pemeriksaan SDIDTK</h3>

  <div class="row">
    <div class="col">
      <label>Nama Petugas</label>
      <input id="petugas_input" name="petugas_input" type="text" />
    </div>
    <div class="col">
      <label>Tanggal Ukur</label>
      <input id="tgl_ukur" name="tgl_ukur" type="date" />
    </div>
  </div>

  <div class="row">
    <div class="col">
      <label>Berat Badan (kg)</label>
      <input id="berat" name="berat" type="number" step="0.1" />
    </div>
    <div class="col">
      <label>Tinggi Badan (cm)</label>
      <input id="tinggi" name="tinggi" type="number" step="0.1" />
    </div>
  </div>

  <div class="row">
    <div class="col">
      <label>IMT</label>
      <input id="imt" name="imt" type="number" step="0.1" />
    </div>

    <div class="col">
      <label>Status Gizi</label>
      <input id="status_gizi" name="status_gizi" type="text" />
    </div>
  </div>

  <div class="row">
    <div class="col">
      <label>KPSP</label>
      <input id="kpsp" name="kpsp" type="text" />
    </div>

    <div class="col">
      <label>GPPH</label>
      <input id="gpph" name="gpph" type="text" />
    </div>
  </div>

  <div class="row">
    <div class="col">
      <label>KMPE</label>
      <input id="kmpe" name="kmpe" type="text" />
    </div>

    <div class="col">
      <label>Tes Dengar</label>
      <input id="tes_dengar" name="tes_dengar" type="text" />
    </div>
  </div>

  <div class="row">
    <div class="col">
      <label>Tes Lihat</label>
      <input id="tes_lihat" name="tes_lihat" type="text" />
    </div>

    <div class="col">
      <label>Kondisi Gigi</label>
      <input id="gigi" name="gigi" type="text" />
    </div>
  </div>

  <div class="row">
    <div class="col">
      <label>Kesimpulan</label>
      <textarea id="kesimpulan" name="kesimpulan"></textarea>
    </div>

    <div class="col">
      <label>Keterangan Rujukan</label>
      <textarea id="ket_rujuk" name="ket_rujuk"></textarea>
    </div>
  </div>

  <!-- KUESIONER -->
  <div id="hiddenKuesioner"></div>

  <div class="actions">
    <button type="submit" class="btn-primary">Simpan / Update</button>
    <button type="button" id="clearBtn" class="btn-clear">Bersihkan</button>
  </div>

</form>
</div>



<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
import {
  getFirestore, collection, query, where,
  getDocs, doc, setDoc, addDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCIruNCiYTVhISuBWMotTfUYZbW8JKrLGE",
  authDomain: "padasuka-juara.firebaseapp.com",
  projectId: "padasuka-juara",
  storageBucket: "padasuka-juara.firebasestorage.app",
  messagingSenderId: "469740864914",
  appId: "1:469740864914:web:f17b3112a2d2e841666d4b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const form = document.getElementById("regForm");
const btnSearch = document.getElementById("btnSearch");
const searchNik = document.getElementById("search_nik");
const preFill = document.getElementById("preFill");
let existingDocId = null;

// =============================
// CEK NIK & PREFILL
// =============================
btnSearch.addEventListener("click", async () => {
  const nikVal = searchNik.value.trim();
  if (!nikVal) return alert("Masukkan NIK");

  const q = query(collection(db, "registrations"), where("nik", "==", nikVal));
  const snap = await getDocs(q);

  if (snap.size > 0) {
    const docSnap = snap.docs[0];
    const d = docSnap.data();
    existingDocId = docSnap.id;

    preFill.style.display = "block";
    preFill.innerHTML = `
      <b>Data ditemukan:</b><br>
      Nama: <b>${d.nama_lengkap}</b><br>
      NIK: <b>${d.nik}</b><br>
      Tanggal Lahir: <b>${d.tanggal_lahir}</b>
    `;

    // Prefill tampil
    ["nama_lengkap","nik","tanggal_lahir"].forEach(f => form[f].value = d[f] || "");

    // Prefill hidden
    const hiddenFields = [
      "nama_institusi","jenis_kelamin","tempat_lahir","usia","gol_darah","nomor_hp",
      "alamat","nama_orangtua","nik_orangtua","jenis_disabilitas","pernyataan"
    ];
    hiddenFields.forEach(f => form[f].value = d[f] || "");

    // Prefill field SDIDTK
    const sdidtkFields = [
      "petugas_input","tgl_ukur","berat","tinggi","imt","status_gizi",
      "kpsp","gpph","kmpe","tes_dengar","tes_lihat","gigi","kesimpulan","ket_rujuk"
    ];
    sdidtkFields.forEach(f => form[f].value = d[f] || "");

    // Prefill kuesioner
    if (d.kuesioner) {
      Object.entries(d.kuesioner).forEach(([k,v]) => {
        let el = document.getElementById(k);
        if (!el) {
          el = document.createElement("input");
          el.type = "hidden";
          el.id = k;
          el.name = k;
          document.getElementById("hiddenKuesioner").appendChild(el);
        }
        el.value = v;
      });
    }

  } else {
    existingDocId = null;
    preFill.style.display = "block";
    preFill.innerHTML = "<b>Data tidak ditemukan, membuat baru.</b>";
  }
});

// =============================
// SIMPAN / UPDATE DATA
// =============================
form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const fieldList = [
    "nama_lengkap","nik","tanggal_lahir",
    "nama_institusi","jenis_kelamin","tempat_lahir","usia","gol_darah",
    "nomor_hp","alamat","nama_orangtua","nik_orangtua","jenis_disabilitas",
    "pernyataan",

    // FIELD SDIDTK BARU
    "petugas_input","tgl_ukur","berat","tinggi","imt","status_gizi",
    "kpsp","gpph","kmpe","tes_dengar","tes_lihat","gigi","kesimpulan","ket_rujuk"
  ];

  const data = { createdAt: serverTimestamp(), kuesioner: {} };

  fieldList.forEach(f => data[f] = form[f].value || "");

  // simpan kuesioner
  document.querySelectorAll("#hiddenKuesioner input").forEach(el => {
    data.kuesioner[el.name] = el.value;
  });

  try {
    if (existingDocId) {
      await setDoc(doc(db, "registrations", existingDocId), data, { merge:true });
      alert("Data diperbarui.");
    } else {
      await addDoc(collection(db, "registrations"), data);
      alert("Data baru disimpan.");
    }

    form.reset();
    preFill.style.display = "none";
    existingDocId = null;

  } catch (err) {
    alert("Error: " + err.message);
  }
});

// CLEAR
document.getElementById("clearBtn").addEventListener("click", () => {
  form.reset();
  preFill.style.display = "none";
  existingDocId = null;
});
</script>

</body>
</html>
