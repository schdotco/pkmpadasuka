<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Formulir Pendaftaran – Firebase</title>

<!-- Styling: profesional, rapi, responsif -->
<style>
:root{
  --bg:#f6f7fb;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --accent:#2563eb;
  --border:#e5e7eb;
  --radius:14px;
  --gap:16px;
}

*{box-sizing:border-box}

body{
  font-family: Inter, system-ui, -apple-system, Arial, sans-serif;
  background:var(--bg);
  margin:0;
  padding:24px;
  color:var(--text);
}

.container{
  max-width:980px;
  margin:auto;
  background:var(--card);
  border-radius:var(--radius);
  padding:24px;
  box-shadow:0 10px 32px rgba(15,23,42,.08);
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

header h1{
  font-size:18px;
  margin:0;
  letter-spacing:.3px;
}

.note{
  font-size:13px;
  color:var(--muted);
  margin-bottom:16px;
}

.grid{display:grid;gap:var(--gap)}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}

.field{
  display:flex;
  flex-direction:column;
}

label{
  font-size:12.5px;
  font-weight:600;
  margin-bottom:6px;
}

input, select, textarea{
  padding:11px 12px;
  border-radius:10px;
  border:1px solid var(--border);
  font-size:14px;
  background:#fff;
}

input:focus, select:focus, textarea:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

textarea{
  min-height:96px;
}

hr.sep{
  border:0;
  height:1px;
  background:#eef2f7;
  margin:22px 0;
}

.actions{
  display:flex;
  gap:12px;
  margin-top:22px;
}

.btn{
  padding:11px 16px;
  border-radius:10px;
  border:0;
  cursor:pointer;
  font-weight:700;
  font-size:14px;
}

.btn-primary{
  background:var(--accent);
  color:#fff;
}

.btn-ghost{
  background:#f1f5f9;
  color:#0f172a;
}

/* MOBILE */
@media(max-width:768px){
  body{padding:16px}
  .row-2{grid-template-columns:1fr}
  .actions{flex-direction:column}
  .btn{width:100%}
}
</style>
</head>

<body>
  <div class="container">
    <header>
      <h1>Formulir Pendaftaran & Input Pemeriksaan SDIDTK</h1>
      <div style="font-size:13px;color:var(--muted)">Pastikan NIK benar sebelum menyimpan</div>
    </header>

    <p class="note">Masukkan NIK lalu klik <strong>"Cek Data"</strong> untuk mengambil data yang ada. Hanya NIK, Nama Lengkap, dan Tanggal Lahir yang ditampilkan — data lain akan ter-bridging dan tersimpan ke Firebase.</p>

    <!-- Pencarian NIK (tetap seperti semula) -->
    <div class="grid row-2" style="align-items:end;">
      <div class="field">
        <label for="search_nik">Masukkan NIK</label>
        <input id="search_nik" type="text" placeholder="Masukkan NIK anak" />
      </div>
      <div style="display:flex; align-items:flex-end; gap:12px;">
        <button id="btnSearch" class="btn btn-ghost" type="button">Cek Data</button>
      </div>
    </div>

    <div id="preFill"></div>

    <form id="regForm" class="grid full" style="margin-top:12px;">

      <!-- TAMPILKAN HANYA 3 FIELD UTAMA -->
      <div class="row-2">
        <div class="field">
          <label for="nama_lengkap">Nama Lengkap</label>
          <input id="nama_lengkap" name="nama_lengkap" type="text" required />
        </div>

        <div class="field">
          <label for="nik">NIK</label>
          <input id="nik" name="nik" type="text" required />
        </div>
      </div>

      <div class="row-2">
        <div class="field">
          <label for="tanggal_lahir">Tanggal Lahir</label>
          <input id="tanggal_lahir" name="tanggal_lahir" type="date" required />
        </div>
        <div></div>
      </div>

      <!-- Hidden fields (tetap ada, tidak dihapus) -->
      <input type="hidden" id="nama_institusi" name="nama_institusi" />
      <input type="hidden" id="jenis_kelamin" name="jenis_kelamin" />
      <input type="hidden" id="tempat_lahir" name="tempat_lahir" />
      <input type="hidden" id="usia" name="usia" />
      <input type="hidden" id="gol_darah" name="gol_darah" />
      <input type="hidden" id="nomor_hp" name="nomor_hp" />
      <input type="hidden" id="alamat" name="alamat" />
      <input type="hidden" id="nama_orangtua" name="nama_orangtua" />
      <input type="hidden" id="nik_orangtua" name="nik_orangtua" />
      <input type="hidden" id="jenis_disabilitas" name="jenis_disabilitas" />
      <input type="hidden" id="pernyataan" name="pernyataan" />

      <hr class="sep">

      <!-- Input Pemeriksaan SDIDTK (tampil) -->
      <h3 style="margin:0 0 6px 0;">Input Pemeriksaan SDIDTK</h3>

      <div class="row-2">
        <div class="field">
          <label for="petugas_input">Nama Petugas</label>
          <input id="petugas_input" name="petugas_input" type="text" />
        </div>

        <div class="field">
          <label for="tgl_ukur">Tanggal Ukur</label>
          <input id="tgl_ukur" name="tgl_ukur" type="date" />
        </div>
      </div>

      <div class="row-2">
        <div class="field">
          <label for="berat">Berat Badan (kg)</label>
          <input id="berat" name="berat" type="number" step="0.1" />
        </div>

        <div class="field">
          <label for="tinggi">Tinggi Badan (cm)</label>
          <input id="tinggi" name="tinggi" type="number" step="0.1" />
        </div>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label>IMT (Otomatis)</label>
          <input type="text" id="imt" name="imt" readonly>
      </div>


        <div class="field">
          <label for="status_gizi">Status Gizi</label>
          <select id="status_gizi" name="status_gizi">
            <option value="">-- Pilih --</option>
            <option>Berat Badan Sangat Kurang</option>
            <option>Berat Badan Kurang</option>
            <option>Berat Badan Normal</option>
            <option>Berat Badan Lebih</option>
            <option>Obesitas</option>
          </select>
        </div>
      </div>

      <div class="row-2">
        <div class="field">
          <label for="kpsp">KPSP</label>
          <select id="kpsp" name="kpsp">
            <option value="">-- Pilih --</option>
            <option>Sesuai Usia</option>
            <option>Meragukan</option>
            <option>Kemungkinan Penyimpangan</option>
          </select>
        </div>

        <div class="field">
          <label for="gpph">GPPH</label>
          <select id="gpph" name="gpph">
            <option value="">-- Pilih --</option>
            <option>Normal &lt;13</option>
            <option>Meragukan</option>
            <option>&gt;13 Kemungkinan GPPH</option>
          </select>
        </div>
      </div>

      <div class="row-2">
        <div class="field">
          <label for="kmpe">KMPE</label>
          <select id="kmpe" name="kmpe">
            <option value="">-- Pilih --</option>
            <option>Normal = Tidak Ada Ya</option>
            <option>Meragukan = Ada Ya 1</option>
            <option>Gangguan MPE = Ada Jawaban 2</option>
          </select>
        </div>

        <div class="field">
          <label for="tes_dengar">Tes Daya Dengar</label>
          <select id="tes_dengar" name="tes_dengar">
            <option value="">-- Pilih --</option>
            <option>Sesuai Umur</option>
            <option>Kemungkinan Penyimpangan</option>
          </select>
        </div>
      </div>

      <div class="row-2">
        <div class="field">
          <label for="tes_lihat">Tes Daya Lihat</label>
          <select id="tes_lihat" name="tes_lihat">
            <option value="">-- Pilih --</option>
            <option>&gt;6/12 Daya Lihat Baik</option>
            <option>&lt;6/12 Daya lihat Kurang</option>
          </select>
        </div>

        <div class="field">
          <label for="gigi">Kondisi Gigi</label>
          <select id="gigi" name="gigi">
            <option value="">-- Pilih --</option>
            <option>Normal</option>
            <option>Karies</option>
          </select>
        </div>
      </div>

      <div class="row-2">
        <div class="field">
          <label for="kesimpulan">Kesimpulan</label>
          <select id="kesimpulan" name="kesimpulan">
            <option value="">-- Pilih --</option>
            <option>Rujuk</option>
            <option>Tidak</option>
          </select>
        </div>

        <div class="field">
          <label for="posyandu">Posyandu Tempat Pemeriksaan</label>
          <select id="posyandu" name="posyandu">
            <option value="">-- Pilih Posyandu --</option>
          </select>
        </div>
      </div>

        <div class="field">
          <label for="ket_rujuk">Keterangan Rujukan</label>
          <textarea id="ket_rujuk" name="ket_rujuk"></textarea>
        </div>
      </div>

      <!-- kuesioner hidden container -->
      <div id="hiddenKuesioner"></div>

      <div class="actions">
        <button type="submit" class="btn btn-primary">Simpan / Update</button>
        <button type="button" id="clearBtn" class="btn btn-ghost">Bersihkan</button>
      </div>

    </form>
  </div>

<!-- FIREBASE: script & logic PASTI SAMA dengan semula (tidak diubah secara logika) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
import {
  getFirestore, collection, query, where,
  getDocs, doc, setDoc, addDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

/* =============================
   FIREBASE INIT
   ============================= */
const firebaseConfig = {
  apiKey: "AIzaSyCIruNCiYTVhISuBWMotTfUYZbW8JKrLGE",
  authDomain: "padasuka-juara.firebaseapp.com",
  projectId: "padasuka-juara",
  storageBucket: "padasuka-juara.firebasestorage.app",
  messagingSenderId: "469740864914",
  appId: "1:469740864914:web:f17b3112a2d2e841666d4b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* =============================
   LOAD POSYANDU (DROPDOWN)
   ============================= */
async function loadPosyandu() {
  const select = document.getElementById("posyandu");
  if (!select) return;

  select.innerHTML = `<option value="">-- Pilih Posyandu --</option>`;

  try {
    const snap = await getDocs(collection(db, "posyandu"));
    const data = [];

    snap.forEach(doc => {
      const d = doc.data();
      if (d.aktif === "YA" && d.nama) {
        data.push(d.nama);
      }
    });

    data.sort();

    data.forEach(nama => {
      const opt = document.createElement("option");
      opt.value = nama;
      opt.textContent = nama;
      select.appendChild(opt);
    });
  } catch (err) {
    console.error("Gagal load posyandu:", err);
  }
}

// panggil saat halaman dibuka
loadPosyandu();

/* =============================
   ELEMENT & STATE
   ============================= */
const form = document.getElementById("regForm");
const btnSearch = document.getElementById("btnSearch");
const searchNik = document.getElementById("search_nik");
const preFill = document.getElementById("preFill");
let existingDocId = null;

/* =============================
   CEK NIK & PREFILL
   ============================= */
btnSearch.addEventListener("click", async () => {
  const nikVal = searchNik.value.trim();
  if (!nikVal) return alert("Masukkan NIK");

  const q = query(collection(db, "registrations"), where("nik", "==", nikVal));
  const snap = await getDocs(q);

  if (snap.size > 0) {
    const docSnap = snap.docs[0];
    const d = docSnap.data();
    existingDocId = docSnap.id;

    preFill.style.display = "block";
    preFill.innerHTML = `
      <b>Data ditemukan:</b><br>
      Nama: <b>${d.nama_lengkap}</b><br>
      NIK: <b>${d.nik}</b><br>
      Tanggal Lahir: <b>${d.tanggal_lahir}</b>
    `;

    // Prefill field tampil
    ["nama_lengkap","nik","tanggal_lahir"].forEach(f => {
      if (form[f]) form[f].value = d[f] || "";
    });

    // Prefill hidden field
    const hiddenFields = [
      "nama_institusi","jenis_kelamin","tempat_lahir","usia","gol_darah",
      "nomor_hp","alamat","nama_orangtua","nik_orangtua",
      "jenis_disabilitas","pernyataan"
    ];
    hiddenFields.forEach(f => {
      if (form[f]) form[f].value = d[f] || "";
    });

    // Prefill SDIDTK
    const sdidtkFields = [
      "petugas_input","tgl_ukur","berat","tinggi","imt","status_gizi",
      "kpsp","gpph","kmpe","tes_dengar","tes_lihat",
      "gigi","kesimpulan","posyandu","ket_rujuk"
    ];
    sdidtkFields.forEach(f => {
      if (form[f]) form[f].value = d[f] || "";
    });

    // Prefill kuesioner
    if (d.kuesioner) {
      Object.entries(d.kuesioner).forEach(([k,v]) => {
        let el = document.getElementById(k);
        if (!el) {
          el = document.createElement("input");
          el.type = "hidden";
          el.id = k;
          el.name = k;
          document.getElementById("hiddenKuesioner").appendChild(el);
        }
        el.value = v;
      });
    }

  } else {
    existingDocId = null;
    preFill.style.display = "block";
    preFill.innerHTML = "<b>Data tidak ditemukan, membuat data baru.</b>";
  }
});

/* =============================
   SIMPAN / UPDATE DATA
   ============================= */
form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const fieldList = [
    "nama_lengkap","nik","tanggal_lahir",
    "nama_institusi","jenis_kelamin","tempat_lahir","usia","gol_darah",
    "nomor_hp","alamat","nama_orangtua","nik_orangtua",
    "jenis_disabilitas","pernyataan",

    // SDIDTK
    "petugas_input","tgl_ukur","berat","tinggi","imt","status_gizi",
    "kpsp","gpph","kmpe","tes_dengar","tes_lihat",
    "gigi","kesimpulan","posyandu","ket_rujuk"
  ];

  const data = { createdAt: serverTimestamp(), kuesioner: {} };

  fieldList.forEach(f => {
    data[f] = form[f] ? form[f].value || "" : "";
  });

  // simpan kuesioner
  document.querySelectorAll("#hiddenKuesioner input").forEach(el => {
    data.kuesioner[el.name] = el.value;
  });

  try {
    if (existingDocId) {
      await setDoc(doc(db, "registrations", existingDocId), data, { merge:true });
      alert("Data berhasil diperbarui.");
    } else {
      await addDoc(collection(db, "registrations"), data);
      alert("Data baru berhasil disimpan.");
    }

    form.reset();
    preFill.style.display = "none";
    existingDocId = null;

  } catch (err) {
    alert("Error: " + err.message);
  }
});

/* =============================
   CLEAR FORM
   ============================= */
document.getElementById("clearBtn").addEventListener("click", () => {
  form.reset();
  preFill.style.display = "none";
  existingDocId = null;
});

/* =============================
   HITUNG IMT OTOMATIS
   ============================= */
function hitungIMT() {
  const bb = parseFloat(document.getElementById("berat").value);
  const tb = parseFloat(document.getElementById("tinggi").value);

  if (!isNaN(bb) && !isNaN(tb) && tb > 0) {
    const tinggiMeter = tb / 100;
    const imt = bb / (tinggiMeter * tinggiMeter);
    document.getElementById("imt").value = imt.toFixed(1);
  } else {
    document.getElementById("imt").value = "";
  }
}

document.getElementById("berat").addEventListener("input", hitungIMT);
document.getElementById("tinggi").addEventListener("input", hitungIMT);
</script>
</body>
</html>
