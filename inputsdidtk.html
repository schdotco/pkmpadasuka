<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input SDIDTK</title>

<!-- UI Styling -->
<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background: #f3f6fa;
        margin: 0;
        padding: 0;
    }

    .container {
        max-width: 900px;
        margin: 30px auto;
        background: #fff;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #1a1a1a;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .form-row {
        display: flex;
        gap: 20px;
        margin-bottom: 15px;
    }

    .form-col {
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    label {
        font-weight: 600;
        margin-bottom: 6px;
    }

    input, select, textarea {
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #d0d7de;
        font-size: 15px;
    }

    textarea {
        min-height: 70px;
    }

    button {
        width: 100%;
        background: #0d6efd;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 8px;
        margin-top: 20px;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background: #0b5ed7;
    }

    /* Responsive */
    @media (max-width: 700px) {
        .form-row {
            flex-direction: column;
        }
    }
</style>
</head>

<body>
<div class="container">

<h2>FORM INPUT SDIDTK</h2>

<form id="formInput">

    <!-- Identitas Anak yang ditarik dari Firebase -->
    <div class="form-row">
        <div class="form-col">
            <label>NIK</label>
            <input id="nik" name="nik" type="text" required>
        </div>
        <div class="form-col">
            <label>Nama Lengkap</label>
            <input id="nama_lengkap" name="nama_lengkap" type="text" readonly>
        </div>
    </div>

    <div class="form-row">
        <div class="form-col">
            <label>Tanggal Lahir</label>
            <input id="tanggal_lahir" name="tanggal_lahir" type="date" readonly>
        </div>
    </div>

    <hr style="margin:25px 0;">

    <h3 style="margin-bottom:15px;">Data Pemeriksaan SDIDTK</h3>

    <div class="form-row">
        <div class="form-col">
            <label>Nama Petugas</label>
            <input id="petugas_input" name="petugas_input" type="text">
        </div>

        <div class="form-col">
            <label>Tanggal Ukur</label>
            <input id="tgl_ukur" name="tgl_ukur" type="date">
        </div>
    </div>

    <div class="form-row">
        <div class="form-col">
            <label>Berat Badan (kg)</label>
            <input id="berat" name="berat" type="number" step="0.1">
        </div>

        <div class="form-col">
            <label>Tinggi Badan (cm)</label>
            <input id="tinggi" name="tinggi" type="number" step="0.1">
        </div>
    </div>

    <div class="form-row">
        <div class="form-col">
            <label>IMT</label>
            <input id="imt" name="imt" type="number" step="0.1">
        </div>

        <div class="form-col">
            <label>Status Gizi</label>
            <select id="status_gizi" name="status_gizi">
                <option value="">-- Pilih --</option>
                <option>Berat Badan Sangat Kurang</option>
                <option>Berat Badan Kurang</option>
                <option>Berat Badan Normal</option>
                <option>Berat Badan Lebih</option>
                <option>Obesitas</option>
            </select>
        </div>
    </div>

    <div class="form-row">
        <div class="form-col">
            <label>KPSP</label>
            <select id="kpsp" name="kpsp">
                <option value="">-- Pilih --</option>
                <option>Sesuai Usia</option>
                <option>Meragukan</option>
                <option>Kemungkinan Penyimpangan</option>
            </select>
        </div>

        <div class="form-col">
            <label>GPPH</label>
            <select id="gpph" name="gpph">
                <option value="">-- Pilih --</option>
                <option>Normal <13</option>
                <option>Meragukan</option>
                <option>>13 Kemungkinan GPPH</option>
            </select>
        </div>
    </div>

    <div class="form-row">
        <div class="form-col">
            <label>KMPE</label>
            <select id="kmpe" name="kmpe">
                <option value="">-- Pilih --</option>
                <option>Normal = Tidak Ada Ya</option>
                <option>Meragukan = Ada Ya 1</option>
                <option>Gangguan MPE = Ada Jawaban 2</option>
            </select>
        </div>

        <div class="form-col">
            <label>Tes Daya Dengar</label>
            <select id="tes_dengar" name="tes_dengar">
                <option value="">-- Pilih --</option>
                <option>Sesuai Umur</option>
                <option>Kemungkinan Penyimpangan</option>
            </select>
        </div>
    </div>

    <div class="form-row">
        <div class="form-col">
            <label>Tes Daya Lihat</label>
            <select id="tes_lihat" name="tes_lihat">
                <option value="">-- Pilih --</option>
                <option>>6/12 Daya Lihat Baik</option>
                <option><6/12 Daya lihat Kurang</option>
            </select>
        </div>

        <div class="form-col">
            <label>Kondisi Gigi</label>
            <select id="gigi" name="gigi">
                <option value="">-- Pilih --</option>
                <option>Normal</option>
                <option>Karies</option>
            </select>
        </div>
    </div>

    <div class="form-row">
        <div class="form-col">
            <label>Kesimpulan</label>
            <select id="kesimpulan" name="kesimpulan">
                <option value="">-- Pilih --</option>
                <option>Rujuk</option>
                <option>Tidak</option>
            </select>
        </div>

        <div class="form-col">
            <label>Keterangan Rujukan</label>
            <textarea id="ket_rujuk" name="ket_rujuk"></textarea>
        </div>
    </div>

    <button type="submit">Simpan Data</button>

</form>
</div>

<!-- Firebase -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
        getFirestore, doc, getDoc, setDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "YOUR-API-KEY",
        authDomain: "YOUR-PROJECT.firebaseapp.com",
        projectId: "YOUR-PROJECT-ID",
        storageBucket: "YOUR-PROJECT.appspot.com",
        messagingSenderId: "SENDER-ID",
        appId: "APP-ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const form = document.getElementById("formInput");

    // Auto-ambil data awal berdasarkan NIK
    document.getElementById("nik").addEventListener("change", async (e) => {
        const nik = e.target.value;
        const ref = doc(db, "inputanak", nik);
        const snap = await getDoc(ref);

        if (snap.exists()) {
            const d = snap.data();
            document.getElementById("nama_lengkap").value = d.nama_lengkap || "";
            document.getElementById("tanggal_lahir").value = d.tanggal_lahir || "";
        }
    });

    // Submit
    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const nik = form.nik.value;

        await setDoc(doc(db, "inputanak", nik), {
            nama_lengkap: form.nama_lengkap.value,
            nik: form.nik.value,
            tanggal_lahir: form.tanggal_lahir.value,

            // Rekam Pemeriksaan Baru
            rekam_ukur: {
                petugas_input: form.petugas_input.value,
                tgl_ukur: form.tgl_ukur.value,
                berat: form.berat.value,
                tinggi: form.tinggi.value,
                imt: form.imt.value,
                status_gizi: form.status_gizi.value,
                kpsp: form.kpsp.value,
                gpph: form.gpph.value,
                kmpe: form.kmpe.value,
                tes_dengar: form.tes_dengar.value,
                tes_lihat: form.tes_lihat.value,
                gigi: form.gigi.value,
                kesimpulan: form.kesimpulan.value,
                ket_rujuk: form.ket_rujuk.value
            },

            updatedAt: serverTimestamp()
        }, { merge: true });

        alert("Data berhasil disimpan!");
    });

</script>

</body>
</html>
