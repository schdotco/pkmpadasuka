<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Data & Informasi UPTD Puskesmas Padasuka</title>
  <link rel="stylesheet" href="style.css"/>
  <title>Login - Aplikasi Jadwal Puskesmas</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f4f6f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .card {
      background: #fff;
      padding: 25px 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 350px;
      text-align: center;
    }
    .card h3 {
      margin-top: 0;
      margin-bottom: 15px;
      color: #1976d2;
    }
    .card input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .card button {
      width: 100%;
      padding: 10px;
      background: #1976d2;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }
    .card button:hover {
      background: #125ca1;
    }
    .link {
      margin-top: 10px;
      font-size: 13px;
    }
    .link a {
      color: #1976d2;
      text-decoration: none;
    }
    .link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>Data & Informasi UPTD Puskesmas Padasuka</header>
  <main>
    <div class="left-panel">
      <h1>Satu Akses Untuk Semua</h1>
      <p>Portal internal untuk pengelolaan <b>Data & Informasi UPTD Puskesmas Padasuka</b>.</p>
      <img src="https://cdn-icons-png.flaticon.com/512/2922/2922506.png" alt="Ilustrasi Login">
    </div>

    <div class="right-panel">
      <div class="card">
        <h3>Login</h3>
        <input type="email" id="loginEmail" placeholder="Email"/>
        <input type="password" id="loginPassword" placeholder="Password"/>
        <button id="btnLogin">Masuk</button>
        <div class="link">Belum punya akun? <a href="register.html">Daftar</a></div>
      </div>
    </div>
  </main>
  <form id="loginForm" class="card">
    <h3>Login</h3>
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit">Masuk</button>
    <div class="link">Belum punya akun? <a href="register.html">Daftar</a></div>
  </form>

  <script type="module">
    import { loginUser } from "./auth.js";

    document.getElementById('btnLogin').onclick = async () => {
      const email = loginEmail.value;
      const password = loginPassword.value;
      try {
        await loginUser(email, password);
        window.location.href = "dashboard.html";
      } catch (err) {
        alert(err.message);
      }
    };
  </script>
  
  <script type="module" src="./auth.js"></script>
</body>
</html>
