<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registrasi - Data & Informasi UPTD Puskesmas Padasuka</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    /* 🌐 Tambahan styling agar sama seperti login */
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: #1976d2;
      color: #fff;
      text-align: center;
      padding: 15px;
      font-size: 18px;
      font-weight: 500;
    }

    main {
      display: flex;
      flex: 1;
      flex-wrap: wrap;
    }

    .left-panel {
      background: #1976d2;
      color: #fff;
      flex: 1;
      min-width: 280px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
    }

    .left-panel h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .left-panel p {
      font-size: 15px;
      line-height: 1.5;
      max-width: 300px;
    }

    .left-panel img {
      width: 180px;
      margin-top: 20px;
    }

    .right-panel {
      flex: 1;
      min-width: 280px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      background: #f4f6f9;
    }

    .card {
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card h3 {
      text-align: center;
      margin-bottom: 10px;
      color: #1976d2;
    }

    .card input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
    }

    .card button {
      background: #1976d2;
      color: #fff;
      border: none;
      padding: 10px;
      font-size: 15px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
    }

    .card button:hover {
      background: #125ca1;
    }

    .link {
      text-align: center;
      font-size: 14px;
      margin-top: 5px;
    }

    .link a {
      color: #1976d2;
      text-decoration: none;
    }

    .link a:hover {
      text-decoration: underline;
    }

    #adminCode {
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <header>Login Akun - Data & Informasi UPTD Puskesmas Padasuka</header>

  <main>
  <!-- Panel Kiri -->
  <div class="left-panel">
    <h1>SATU AKSES UNTUK SEMUA</h1>
    <p>Portal internal untuk pengelolaan <b>Data & Informasi UPTD Puskesmas Padasuka</b></p>.  
    <img
      src="https://cdn-icons-png.flaticon.com/512/2922/2922506.png"
      alt="Ilustrasi Login">
  </div>

  <!-- Panel Kanan -->
  <div class="right-panel">
    <form id="loginForm" class="login-card">
      <h3>Login</h3>
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Masuk</button>
      <div class="link">Belum punya akun? <a href="register.html">Daftar</a></div>
    </form>
  </div>
  </main>

  <script type="module" src="./auth.js"></script>
</body>
</html>
