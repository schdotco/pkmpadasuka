<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Data & Informasi UPTD Puskesmas Padasuka</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h2>Login</h2>
      <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" id="btnLogin">Login</button>
      </form>
      <p>Belum punya akun? <a href="register.html">Registrasi</a></p>
    </div>
  </div>

  <!-- Script login terpisah -->
  <script type="module">
    import { loginUser } from './auth.js';

    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    form.addEventListener('submit', async (e) => {
      e.preventDefault(); // ⚠️ penting supaya form tidak reload

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        alert('Harap isi semua kolom!');
        return;
      }

      try {
        const user = await loginUser(email, password);
        alert('✅ Login berhasil!');
        window.location.href = 'dashboard.html'; // redirect ke dashboard
      } catch (err) {
        alert('❌ Gagal login: ' + err.message);
      }
    });
  </script>
</body>
</html>
