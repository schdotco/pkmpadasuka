<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Aplikasi Jadwal Puskesmas</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      min-height: 100vh;
    }

    /* Bagian kiri */
    .left-panel {
      flex: 1;
      background: #406cff;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 200px;
    }
    left-content {
      max-width: 250px;
    }
    .left-panel h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }
    .left-panel p {
      font-size: 14px;
      line-height: 1.5;
    }
    .left-panel img {
      margin-top: 30px;
      max-width: 200px;
    }

    /* Bagian kanan (form) */
    .right-panel {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f6f9;
      padding: 20px;
    }
    .login-card {
      background: #fff;
      padding: 25px 30px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 350px;
    }
    .login-card h3 {
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
      color: #1976d2;
    }
    .login-card input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .login-card button {
      width: 100%;
      padding: 10px;
      background: #1976d2;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
    }
    .login-card button:hover {
      background: #125ca1;
    }
    .link {
      margin-top: 10px;
      font-size: 13px;
      text-align: center;
    }
    .link a {
      color: #1976d2;
      text-decoration: none;
    }
    .link a:hover { text-decoration: underline; }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      .left-panel { padding: 30px; text-align: center; }
      .left-panel img { margin: 20px auto 0; }
    }
  </style>
</head>
<body>

  <!-- Panel Kiri -->
  <div class="left-panel">
    <h1>SATU AKSES UNTUK SEMUA</h1>
    <p>Portal internal untuk pengelolaan <b>Data & Informasi UPTD Puskesmas Padasuka</b></p>.  
    <img
      src="https://cdn-icons-png.flaticon.com/512/2922/2922506.png"
      alt="Ilustrasi Login">
  </div>

  <!-- Panel Kanan -->
  <div class="right-panel">
    <form id="loginForm" class="login-card">
      <h3>Login</h3>
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Masuk</button>
      <div class="link">Belum punya akun? <a href="register.html">Daftar</a></div>
    </form>
  </div>

  <script type="module" src="./auth.js"></script>
</body>
</html>
