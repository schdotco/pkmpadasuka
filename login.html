<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Data & Informasi UPTD Puskesmas Padasuka</title>
  <style>
    /* 🌐 Styling Umum */
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: #f4f6f9;
    }

    header {
      background: #1976d2;
      color: #fff;
      text-align: center;
      padding: 15px;
      font-size: 18px;
      font-weight: 500;
    }

    main {
      display: flex;
      flex: 1;
      flex-wrap: wrap;
    }

    .left-panel {
      background: #1976d2;
      color: #fff;
      flex: 1;
      min-width: 280px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
    }

    .left-panel h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .left-panel p {
      font-size: 15px;
      line-height: 1.5;
      max-width: 300px;
    }

    .left-panel img {
      width: 180px;
      margin-top: 20px;
    }

    .right-panel {
      flex: 1;
      min-width: 280px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      background: #f4f6f9;
    }

    .card {
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card h3 {
      text-align: center;
      margin-bottom: 10px;
      color: #1976d2;
    }

    .card input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
    }

    .card button {
      background: #1976d2;
      color: #fff;
      border: none;
      padding: 10px;
      font-size: 15px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
    }

    .card button:hover {
      background: #125ca1;
    }

    .link {
      text-align: center;
      font-size: 14px;
      margin-top: 5px;
    }

    .link a {
      color: #1976d2;
      text-decoration: none;
      cursor: pointer;
    }

    .link a:hover {
      text-decoration: underline;
    }

    #registerCard { display: none; }
  </style>
</head>
<body>
  <header>Portal Login - Data & Informasi UPTD Puskesmas Padasuka</header>

  <main>
    <!-- Panel Kiri -->
    <div class="left-panel">
      <h1>SATU AKSES UNTUK SEMUA</h1>
      <p>Portal internal untuk pengelolaan <b>Data & Informasi UPTD Puskesmas Padasuka</b></p>
      <img src="https://cdn-icons-png.flaticon.com/512/2922/2922506.png" alt="Ilustrasi Login">
    </div>

    <!-- Panel Kanan -->
    <div class="right-panel">
      <!-- Form Login -->
      <form id="loginForm" class="card">
        <h3>Login</h3>
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Masuk</button>
        <div class="link">Belum punya akun? <a id="toRegister">Daftar</a></div>
      </form>

      <!-- Form Registrasi -->
      <form id="registerCard" class="card">
        <h3>Registrasi</h3>
        <input type="text" id="regName" placeholder="Nama Lengkap" required />
        <input type="email" id="regEmail" placeholder="Email" required />
        <input type="password" id="regPassword" placeholder="Password" required />
        <select id="regRole">
          <option value="false">Pegawai</option>
          <option value="true">Admin</option>
        </select>
        <button type="submit">Daftar</button>
        <div class="link">Sudah punya akun? <a id="toLogin">Login</a></div>
      </form>
    </div>
  </main>

  <!-- 🔥 Script Firebase -->
  <script type="module">
    import { loginUser, registerUser, auth } from "./js/app.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    const db = getDatabase();

    // 🔄 Toggle antara Login & Registrasi
    const loginForm = document.getElementById("loginForm");
    const registerCard = document.getElementById("registerCard");
    document.getElementById("toRegister").onclick = () => {
      loginForm.style.display = "none";
      registerCard.style.display = "flex";
    };
    document.getElementById("toLogin").onclick = () => {
      registerCard.style.display = "none";
      loginForm.style.display = "flex";
    };

    // ✅ LOGIN
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      try {
        const user = await loginUser(email, password);
        const snapshot = await get(child(ref(db), "users/" + user.uid));

        if (snapshot.exists()) {
          const data = snapshot.val();
          if (data.isAdmin) {
            alert("✅ Login berhasil sebagai Admin!");
            window.location.href = "admin-dashboard.html";
          } else {
            alert("✅ Login berhasil sebagai Pegawai!");
            window.location.href = "dashboard.html";
          }
        } else {
          alert("⚠️ Data pengguna tidak ditemukan.");
        }
      } catch (err) {
        alert("❌ Gagal login: " + err.message);
      }
    });

    // 🧾 REGISTER
    registerCard.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value.trim();
      const isAdmin = document.getElementById("regRole").value === "true";

      try {
        await registerUser(name, email, password, isAdmin);
        alert("✅ Registrasi berhasil! Silakan login.");
        registerCard.style.display = "none";
        loginForm.style.display = "flex";
      } catch (err) {
        alert("❌ Gagal registrasi: " + err.message);
      }
    });

    // 🔍 Auto redirect jika sudah login
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const snapshot = await get(child(ref(db), "users/" + user.uid));
        if (snapshot.exists()) {
          const data = snapshot.val();
          if (data.isAdmin) {
            window.location.href = "admin-dashboard.html";
          } else {
            window.location.href = "dashboard.html";
          }
        }
      }
    });
  </script>
</body>
</html>
