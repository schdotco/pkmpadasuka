<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin - Persetujuan Cuti Pegawai</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f9;
    }

    .navbar {
      background: #1976d2;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
    }
    .navbar h1 { font-size: 18px; margin: 0; }
    .navbar .menu { display: flex; gap: 15px; }
    .navbar .menu a { color: #fff; text-decoration: none; font-size: 14px; }
    .navbar .menu a:hover { text-decoration: underline; }
    .navbar button {
      background: #fff; color: #1976d2; border: none;
      padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 13px;
    }

    main {
      max-width: 1000px;
      margin: 30px auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    h2 { color: #1976d2; margin-top: 0; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
      font-size: 14px;
    }
    th { background: #f0f0f0; }

    .btn {
      padding: 5px 8px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-approve { background: #4caf50; color: #fff; }
    .btn-reject { background: #f44336; color: #fff; }

    /* Popup */
    .popup-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .popup-box {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      width: 320px;
      max-width: 90%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      animation: fadeIn 0.2s ease;
    }
    .popup-box h3 {
      margin-top: 0;
      font-size: 16px;
      color: #1976d2;
    }
    .popup-box textarea {
      width: 100%;
      min-height: 70px;
      margin-top: 10px;
      padding: 6px;
      font-size: 13px;
    }
    .popup-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 10px;
    }
    .popup-buttons button {
      padding: 6px 10px;
      font-size: 13px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-cancel { background: #ccc; color: #000; }
    .btn-confirm { background: #1976d2; color: #fff; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="navbar">
    <h1>🏛️ Admin Cuti - Puskesmas Padasuka</h1>
    <div class="menu">
      <a href="dashboard.html">Dashboard</a>
      <a href="cuti-user.html">Pengajuan</a>
      <a href="cuti-list.html">Daftar Cuti</a>
      <a href="kalender.html">Kalender</a>
    </div>
    <button onclick="window.location.href='login.html'">Logout</button>
  </div>

  <main>
    <h2>📋 Daftar Pengajuan Cuti</h2>
    <table id="tabelCuti">
      <thead>
        <tr>
          <th>Nama</th>
          <th>Jenis Cuti</th>
          <th>Tanggal</th>
          <th>Keterangan</th>
          <th>Status</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

<script type="module">
  import { db } from './app.js';
  import { ref, get, update } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

  const tbody = document.querySelector('#tabelCuti tbody');

  // 🔹 Ambil semua pengajuan cuti
  async function loadCuti() {
    tbody.innerHTML = '';
    const snapshot = await get(ref(db, 'pengajuan_cuti'));
    if (snapshot.exists()) {
      const data = snapshot.val();
      Object.entries(data).forEach(([id, item]) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.nama}</td>
          <td>${item.jenisCuti}</td>
          <td>${item.tanggalMulai} s/d ${item.tanggalSelesai}</td>
          <td>${item.keterangan || '-'}</td>
          <td>${item.status}</td>
          <td>
            <button class="btn btn-approve" data-id="${id}">Setujui</button>
            <button class="btn btn-reject" data-id="${id}">Tolak</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    } else {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Belum ada pengajuan cuti</td></tr>`;
    }

    // Pasang event handler setelah render
    document.querySelectorAll('.btn-approve').forEach(btn => {
      btn.onclick = () => showPopup('approve', btn.dataset.id);
    });
    document.querySelectorAll('.btn-reject').forEach(btn => {
      btn.onclick = () => showPopup('reject', btn.dataset.id);
    });
  }

  // 🔸 Fungsi popup konfirmasi
  function showPopup(action, id) {
    const overlay = document.createElement('div');
    overlay.className = 'popup-overlay';

    const popup = document.createElement('div');
    popup.className = 'popup-box';
    popup.innerHTML = `
      <h3>${action === 'approve' ? 'Setujui Cuti' : 'Tolak Cuti'}</h3>
      <p>Tambahkan catatan:</p>
      <textarea id="popupNote" placeholder="Tulis catatan..."></textarea>
      <div class="popup-buttons">
        <button class="btn-cancel">Batal</button>
        <button class="btn-confirm">Konfirmasi</button>
      </div>
    `;
    overlay.appendChild(popup);
    document.body.appendChild(overlay);

    popup.querySelector('.btn-cancel').onclick = () => {
      document.body.removeChild(overlay);
    };

    popup.querySelector('.btn-confirm').onclick = async () => {
      const note = popup.querySelector('#popupNote').value;
      await update(ref(db, 'pengajuan_cuti/' + id), {
        status: action === 'approve' ? 'Disetujui' : 'Ditolak',
        catatanAdmin: note
      });
      document.body.removeChild(overlay);
      loadCuti();
    };
  }

  loadCuti();
</script>
</body>
</html>
