<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📋 Persetujuan Pengajuan Cuti</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f6f9; margin: 0; }
    .navbar { background: #1976d2; color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    .navbar .menu a { color: white; margin-left: 15px; text-decoration: none; }
    main { max-width: 1000px; background: white; padding: 20px; margin: 30px auto; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h2 { color: #1976d2; border-bottom: 2px solid #1976d2; padding-bottom: 5px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f0f0f0; }
    .btn { padding: 5px 10px; border: none; border-radius: 4px; color: white; cursor: pointer; }
    .btn-approve { background: #28a745; }
    .btn-reject { background: #dc3545; }
    .status-menunggu { background: #fff3cd; color: #856404; padding: 4px 6px; border-radius: 4px; }
    .status-disetujui { background: #d4edda; color: #155724; padding: 4px 6px; border-radius: 4px; }
    .status-ditolak { background: #f8d7da; color: #721c24; padding: 4px 6px; border-radius: 4px; }
    .popup-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; }
    .popup { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; }
  </style>
</head>
<body>

  <div class="navbar">
    <div>🏛️ UPTD Puskesmas Padasuka</div>
    <div class="menu">
      <a href="dashboard.html">Dashboard</a>
      <a href="cuti-user.html">Ajukan</a>
      <a href="cuti-list.html">Daftar</a>
    </div>
  </div>

  <main>
    <h2>📋 Persetujuan Pengajuan Cuti</h2>
    <table>
      <thead>
        <tr>
          <th>Nama</th>
          <th>Jenis</th>
          <th>Tanggal</th>
          <th>Keterangan</th>
          <th>Status</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="tabelAdmin"></tbody>
    </table>
  </main>

  <!-- Popup konfirmasi -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup">
      <h3 id="popupTitle"></h3>
      <textarea id="popupCatatan" placeholder="Catatan (opsional)" rows="4"></textarea>
      <div style="margin-top:10px;text-align:right;">
        <button id="popupConfirm">Konfirmasi</button>
        <button id="popupCancel">Batal</button>
      </div>
    </div>
  </div>

<script type="module">
import { db } from './app.js';
import { ref, get, update } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

const tabel = document.getElementById('tabelAdmin');
const popupOverlay = document.getElementById('popupOverlay');
const popupTitle = document.getElementById('popupTitle');
const popupCatatan = document.getElementById('popupCatatan');
const popupConfirm = document.getElementById('popupConfirm');
const popupCancel = document.getElementById('popupCancel');

let selectedId = null;
let selectedAction = null;

async function loadData() {
  tabel.innerHTML = '';
  const snap = await get(ref(db, 'pengajuan_cuti'));
  if (!snap.exists()) {
    tabel.innerHTML = `<tr><td colspan="6" style="text-align:center;">Belum ada data pengajuan</td></tr>`;
    return;
  }

  const data = [];
  snap.forEach(c => data.push({ id: c.key, ...c.val() }));
  data.reverse();

  data.forEach(item => {
    const tr = document.createElement('tr');
    let statusClass =
      item.status === 'Disetujui' ? 'status-disetujui' :
      item.status === 'Ditolak' ? 'status-ditolak' :
      'status-menunggu';

    // ✅ Perbaikan logika status yang termasuk "menunggu"
    const isMenunggu =
      item.status === 'Menunggu' ||
      item.status === 'Pending' ||
      item.status === 'Menunggu Persetujuan';

    // ✅ Perbaikan variabel aksi
    const aksiCell = isMenunggu
      ? `<button class="btn btn-approve" data-id="${item.id}" data-action="Disetujui">Setujui</button>
         <button class="btn btn-reject" data-id="${item.id}" data-action="Ditolak">Tolak</button>`
      : `<span>${item.status}</span>`;

    tr.innerHTML = `
      <td>${item.nama}</td>
      <td>${item.jenisCuti}</td>
      <td>${item.tanggalMulai} s/d ${item.tanggalSelesai}</td>
      <td>${item.keterangan || '-'}</td>
      <td><span class="${statusClass}">${item.status}</span></td>
      <td>${aksiCell}</td>
    `;
    tabel.appendChild(tr);
  });

  // ✅ Pastikan tombol berfungsi
  document.querySelectorAll('.btn-approve, .btn-reject').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedId = btn.dataset.id;
      selectedAction = btn.dataset.action;
      popupTitle.textContent = `${selectedAction} Pengajuan Cuti`;
      popupCatatan.value = '';
      popupOverlay.style.display = 'flex';
    });
  });
}

// Popup actions
popupCancel.onclick = () => popupOverlay.style.display = 'none';

popupConfirm.onclick = async () => {
  if (!selectedId || !selectedAction) return;
  await update(ref(db, 'pengajuan_cuti/' + selectedId), {
    status: selectedAction,
    catatanAdmin: popupCatatan.value.trim()
  });
  popupOverlay.style.display = 'none';
  loadData();
};

loadData();
</script>
</body>
</html>
