<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🛠️ Admin Pengajuan Cuti Pegawai</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f9;
    }
    .navbar {
      background: #1976d2;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
    }
    .navbar h1 {
      font-size: 18px;
      margin: 0;
    }
    .navbar .menu {
      display: flex;
      gap: 15px;
    }
    .navbar .menu a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
    }
    .navbar .menu a:hover {
      text-decoration: underline;
    }
    .navbar button {
      background: #fff;
      color: #1976d2;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    h2 {
      font-size: 20px;
      color: #1976d2;
      margin-top: 0;
      border-bottom: 2px solid #1976d2;
      padding-bottom: 5px;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }
    th {
      background: #f0f0f0;
    }

    .btn-approve {
      background: #2e7d32;
      color: #fff;
      padding: 5px 10px;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }
    .btn-reject {
      background: #c62828;
      color: #fff;
      padding: 5px 10px;
      border: none;
      cursor: pointer;
      border-radius: 4px;
      margin-left: 5px;
    }

    /* Popup */
    .popup {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    .popup-content {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      width: 320px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      text-align: center;
    }
    .popup textarea {
      width: 100%;
      height: 80px;
      margin-top: 10px;
      margin-bottom: 15px;
    }
    .popup button {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: #fff;
      margin: 0 5px;
    }
    .btn-konfirmasi { background: #1976d2; }
    .btn-batal { background: #555; }
  </style>
</head>
<body>
  <div class="navbar">
    <h1>🏛️ Admin Pengajuan Cuti Pegawai</h1>
    <div class="menu">
      <a href="dashboard.html">Dashboard</a>
      <a href="cuti-user.html">Ajukan Cuti</a>
      <a href="cuti-list.html">List Cuti</a>
    </div>
    <button onclick="window.location.href='dashboard.html'">Kembali</button>
  </div>

  <main>
    <h2>✍️ Daftar Pengajuan Cuti</h2>
    <table>
      <thead>
        <tr>
          <th>Nama</th>
          <th>Jenis Cuti</th>
          <th>Tanggal</th>
          <th>Status</th>
          <th>Catatan Admin</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="cutiTable">
        <tr><td colspan="6" style="text-align:center;">Memuat data...</td></tr>
      </tbody>
    </table>
  </main>

  <!-- Popup Catatan -->
  <div class="popup" id="popupCatatan">
    <div class="popup-content">
      <h3 id="popupJudul">Catatan</h3>
      <textarea id="catatanAdmin" placeholder="Tulis catatan..."></textarea>
      <div>
        <button class="btn-konfirmasi" id="btnKonfirmasiPopup">Konfirmasi</button>
        <button class="btn-batal" onclick="tutupPopup()">Batal</button>
      </div>
    </div>
  </div>

<script type="module">
import { db } from './app.js';
import { ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

const tbody = document.getElementById('cutiTable');
const popup = document.getElementById('popupCatatan');
const catatanInput = document.getElementById('catatanAdmin');
const btnKonfirmasi = document.getElementById('btnKonfirmasiPopup');
let selectedId = null;
let selectedAction = null;

// Tampilkan semua pengajuan cuti
onValue(ref(db, 'pengajuan_cuti'), (snapshot) => {
  tbody.innerHTML = '';
  if (snapshot.exists()) {
    const data = snapshot.val();
    Object.entries(data).forEach(([id, item]) => {
      const tr = document.createElement('tr');
      const tanggal = `${item.tanggalMulai || '-'} s/d ${item.tanggalSelesai || '-'}`;

      let aksiHtml = '';
      if (item.status === 'Menunggu') {
        aksiHtml = `
          <button class="btn-approve" data-id="${id}" data-action="Disetujui">Setujui</button>
          <button class="btn-reject" data-id="${id}" data-action="Ditolak">Tolak</button>
        `;
      } else {
        aksiHtml = `<span style="font-weight:bold;color:${item.status === 'Disetujui' ? '#2e7d32' : '#c62828'};">${item.status}</span>`;
      }

      tr.innerHTML = `
        <td>${item.nama}</td>
        <td>${item.jenisCuti}</td>
        <td>${tanggal}</td>
        <td>${item.status}</td>
        <td>${item.catatanAdmin || '-'}</td>
        <td>${aksiHtml}</td>
      `;
      tbody.appendChild(tr);
    });

    // Event tombol approve/tolak
    tbody.querySelectorAll('button[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedId = btn.dataset.id;
        selectedAction = btn.dataset.action;
        document.getElementById('popupJudul').innerText = `Catatan (${selectedAction})`;
        catatanInput.value = '';
        popup.style.display = 'flex';
      });
    });

  } else {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Belum ada pengajuan</td></tr>';
  }
});

// Konfirmasi popup
btnKonfirmasi.addEventListener('click', async () => {
  if (!selectedId || !selectedAction) return;
  const catatan = catatanInput.value.trim();

  await update(ref(db, `pengajuan_cuti/${selectedId}`), {
    status: selectedAction,
    catatanAdmin: catatan
  });

  popup.style.display = 'none';
  selectedId = null;
  selectedAction = null;
});

// Tutup popup manual
window.tutupPopup = function() {
  popup.style.display = 'none';
  selectedId = null;
  selectedAction = null;
};
</script>
</body>
</html>
