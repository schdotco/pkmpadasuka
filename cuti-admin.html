<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Persetujuan Pengajuan Cuti - Admin</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f9;
    }

    /* NAVBAR */
    .navbar {
      background: #1976d2;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
    }
    .navbar h1 {
      font-size: 18px;
      margin: 0;
    }
    .navbar .menu {
      display: flex;
      gap: 15px;
    }
    .navbar .menu a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
    }
    .navbar .menu a:hover {
      text-decoration: underline;
    }
    .navbar button {
      background: #fff;
      color: #1976d2;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    /* MAIN */
    main {
      max-width: 1000px;
      margin: 30px auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    h2 {
      font-size: 20px;
      color: #1976d2;
      margin-top: 0;
      border-bottom: 2px solid #1976d2;
      padding-bottom: 5px;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
      font-size: 14px;
      vertical-align: top;
    }
    th {
      background: #f0f0f0;
    }

    .btn {
      padding: 6px 10px;
      font-size: 13px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: #fff;
      margin-right: 5px;
    }
    .btn-setuju { background: #28a745; }
    .btn-tolak { background: #dc3545; }
    .btn-setuju:hover { background: #218838; }
    .btn-tolak:hover { background: #c82333; }

    .status {
      font-weight: 600;
      padding: 4px 6px;
      border-radius: 4px;
      display: inline-block;
    }
    .status-menunggu { background: #fff3cd; color: #856404; }
    .status-disetujui { background: #d4edda; color: #155724; }
    .status-ditolak { background: #f8d7da; color: #721c24; }

    /* POPUP */
    .popup-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .popup {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .popup h3 {
      margin-top: 0;
      font-size: 18px;
      color: #1976d2;
    }
    .popup textarea {
      width: 100%;
      min-height: 80px;
      margin-top: 10px;
      margin-bottom: 15px;
      font-family: inherit;
      font-size: 14px;
      padding: 8px;
    }
    .popup button {
      margin-right: 8px;
      padding: 6px 10px;
      font-size: 13px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .popup .confirm-btn { background: #1976d2; color: #fff; }
    .popup .cancel-btn { background: #aaa; color: #fff; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <h1>🏛️ Data & Informasi UPTD Puskesmas Padasuka</h1>
    <div class="menu">
      <a href="dashboard.html">Dashboard</a>
      <a href="cuti-user.html">Pengajuan</a>
      <a href="cuti-admin.html">Persetujuan</a>
      <a href="cuti-list.html">Daftar Cuti</a>
    </div>
    <button onclick="window.location.href='login.html'">Logout</button>
  </div>

  <main>
    <h2>📋 Persetujuan Pengajuan Cuti</h2>
    <table>
      <thead>
        <tr>
          <th>Nama</th>
          <th>Jenis Cuti</th>
          <th>Tanggal</th>
          <th>Alasan</th>
          <th>Status</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="tabelAdmin"></tbody>
    </table>
  </main>

  <!-- POPUP -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup">
      <h3 id="popupTitle"></h3>
      <textarea id="popupCatatan" placeholder="Masukkan catatan (opsional)..."></textarea>
      <button class="confirm-btn" id="popupConfirm">Konfirmasi</button>
      <button class="cancel-btn" id="popupCancel">Batal</button>
    </div>
  </div>

  <script type="module">
    import { db } from './app.js';
    import { ref, get, update } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

    const tabel = document.getElementById('tabelAdmin');
    const popupOverlay = document.getElementById('popupOverlay');
    const popupTitle = document.getElementById('popupTitle');
    const popupCatatan = document.getElementById('popupCatatan');
    const popupConfirm = document.getElementById('popupConfirm');
    const popupCancel = document.getElementById('popupCancel');

    let selectedId = null;
    let selectedAction = null;

    async function loadData() {
      tabel.innerHTML = '';
      const snap = await get(ref(db, 'pengajuan_cuti'));
      if (!snap.exists()) {
        tabel.innerHTML = `<tr><td colspan="6" style="text-align:center"><i>Tidak ada data pengajuan.</i></td></tr>`;
        return;
      }

      const data = [];
      snap.forEach(child => data.push({ id: child.key, ...child.val() }));
      data.reverse(); // terbaru di atas

      data.forEach(item => {
        const tr = document.createElement('tr');
        let statusClass = 'status-menunggu';
        if (item.status === 'Disetujui') statusClass = 'status-disetujui';
        else if (item.status === 'Ditolak') statusClass = 'status-ditolak';

        tr.innerHTML = `
          <td>${item.nama}</td>
          <td>${item.jenisCuti}</td>
          <td>${item.tanggalMulai} s/d ${item.tanggalSelesai}</td>
          <td>${item.alasan}</td>
          <td><span class="status ${statusClass}">${item.status}</span></td>
          <td>
            ${item.status === 'Menunggu' ? `
              <button class="btn btn-setuju" data-id="${item.id}" data-action="Disetujui">Setujui</button>
              <button class="btn btn-tolak" data-id="${item.id}" data-action="Ditolak">Tolak</button>
            ` : ''}
          </td>
        `;
        tabel.appendChild(tr);
      });

      document.querySelectorAll('.btn-setuju, .btn-tolak').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedId = btn.dataset.id;
          selectedAction = btn.dataset.action;
          popupTitle.textContent = `${selectedAction} Pengajuan Cuti`;
          popupCatatan.value = '';
          popupOverlay.style.display = 'flex';
        });
      });
    }

    popupCancel.onclick = () => {
      popupOverlay.style.display = 'none';
    };

    popupConfirm.onclick = async () => {
      if (!selectedId || !selectedAction) return;

      const updates = {
        status: selectedAction,
        catatanAdmin: popupCatatan.value.trim()
      };
      await update(ref(db, 'pengajuan_cuti/' + selectedId), updates);

      popupOverlay.style.display = 'none';
      selectedId = null;
      selectedAction = null;
      loadData();
    };

    loadData();
  </script>
</body>
</html>
