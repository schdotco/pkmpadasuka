<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Pengajuan Permintaan Barang</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        padding: 20px;
        margin: 0;
    }
    h2 {
        text-align: center;
        color: #333;
        margin-bottom: 15px;
    }
    .form-container {
        max-width: 700px;
        margin: auto;
        background: #fff;
        padding: 20px 25px;
        border-radius: 10px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }
    label {
        font-weight: bold;
        display: block;
        margin-top: 12px;
        color: #444;
    }
    input, textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 15px;
    }
    textarea {
        height: 100px;
    }
    .btn-submit {
        margin-top: 18px;
        width: 100%;
        padding: 12px;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
    }
    .btn-submit:hover {
        background: #1e4fc8;
    }
    .section-title {
        font-size: 17px;
        margin-top: 20px;
        border-left: 4px solid #2563eb;
        padding-left: 8px;
        color: #2563eb;
        font-weight: bold;
    }
    .success {
        text-align: center;
        background: #d1fae5;
        color: #065f46;
        padding: 10px;
        border-radius: 6px;
        margin-top: 15px;
        display: none;
    }
</style>
</head>

<body>

<h2>Form Pengajuan Permintaan Barang - User</h2>

<div class="form-container">
    <div id="notif" class="success">Data berhasil dikirim!</div>

    <!-- DATA PENGAJU -->
    <div class="section-title">Data Pengaju</div>

    <label>Nama yang Mengajukan</label>
    <input id="namaPengaju" type="text" required>

    <label>Instalasi yang Mengajukan</label>
    <input id="instalasiPengaju" type="text" required>

    <label>Tanggal Pengajuan</label>
    <input id="tanggalPengajuan" type="date" required>

    <!-- DATA BARANG -->
    <div class="section-title">Data Barang yang Diajukan</div>

    <label>Nama Barang</label>
    <input id="namaBarang" type="text" required>

    <label>Jumlah Permintaan</label>
    <input id="jumlahPermintaan" type="number" required>

    <label>Jumlah Sisa Stok</label>
    <input id="sisaStok" type="number" required>

    <label>Harga Barang</label>
    <input id="hargaBarang" type="number" required>

    <label>Keperluan Untuk</label>
    <textarea id="keperluan"></textarea>

    <button class="btn-submit" onclick="kirimData()">Kirim Pengajuan</button>
</div>


<!-- ================================ -->
<!-- FIREBASE SDK -->
<!-- ================================ -->
<script type="module">
    // Import Firebase modules
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

    // Firebase config dari Anda
    const firebaseConfig = {
        apiKey: "AIzaSyDciAiNKFbh8aoM8joIywSeH9Boml1tK5s",
        authDomain: "aplikasi-jadwal-1d54d.firebaseapp.com",
        databaseURL: "https://aplikasi-jadwal-1d54d-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "aplikasi-jadwal-1d54d",
        storageBucket: "aplikasi-jadwal-1d54d.firebasestorage.app",
        messagingSenderId: "860941812271",
        appId: "1:860941812271:web:458bd63c5b0d2514fcbcda"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Fungsi simpan data
    window.kirimData = function () {
        let namaPengaju = document.getElementById("namaPengaju").value;
        let instalasiPengaju = document.getElementById("instalasiPengaju").value;
        let tanggalPengajuan = document.getElementById("tanggalPengajuan").value;
        let namaBarang = document.getElementById("namaBarang").value;
        let jumlahPermintaan = document.getElementById("jumlahPermintaan").value;
        let sisaStok = document.getElementById("sisaStok").value;
        let hargaBarang = document.getElementById("hargaBarang").value;
        let keperluan = document.getElementById("keperluan").value;

        // Generate auto key
        const newRef = push(ref(db, "pengajuan_barang"));

        set(newRef, {
            nama_pengaju: namaPengaju,
            instalasi: instalasiPengaju,
            tanggal: tanggalPengajuan,
            nama_barang: namaBarang,
            jumlah_permintaan: jumlahPermintaan,
            sisa_stok: sisaStok,
            harga_barang: hargaBarang,
            keperluan: keperluan,
            timestamp: Date.now()
        }).then(() => {
            document.getElementById("notif").style.display = "block";

            // Clear form
            document.querySelectorAll("input, textarea").forEach(el => el.value = "");
        });
    }
</script>

</body>
</html>
