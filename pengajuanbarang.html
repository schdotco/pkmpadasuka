<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Pengajuan Permintaan Barang</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        padding: 20px;
        margin: 0;
    }
    h2 {
        text-align: center;
        color: #333;
        margin-bottom: 15px;
    }
    .form-container {
        max-width: 800px;
        margin: auto;
        background: #fff;
        padding: 20px 25px;
        border-radius: 10px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }
    label {
        font-weight: bold;
        display: block;
        margin-top: 12px;
        color: #444;
    }
    input, textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 15px;
    }
    textarea {
        height: 80px;
    }

    .section-title {
        font-size: 17px;
        margin-top: 20px;
        border-left: 4px solid #2563eb;
        padding-left: 8px;
        color: #2563eb;
        font-weight: bold;
    }

    .item-box {
        background: #f0f4ff;
        border-radius: 8px;
        padding: 15px;
        margin-top: 15px;
        border: 1px solid #c7d7ff;
        position: relative;
    }

    .btn-add {
        background: #059669;
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 10px;
    }

    .btn-delete {
        background: #dc2626;
        color: white;
        padding: 6px 12px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 10px;
    }

    .btn-add:hover { background: #047857; }
    .btn-delete:hover { background: #b91c1c; }

    .btn-submit {
        margin-top: 20px;
        width: 100%;
        padding: 12px;
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
    }
    .btn-submit:hover { background: #1e4fc8; }

    .success {
        text-align: center;
        background: #d1fae5;
        color: #065f46;
        padding: 10px;
        border-radius: 6px;
        margin-top: 15px;
        display: none;
    }
</style>
</head>

<body>

<h2>Form Pengajuan Permintaan Barang - User</h2>

<div class="form-container">

    <div id="notif" class="success">Data berhasil dikirim!</div>

    <div class="section-title">Data Pengaju</div>

    <label>Nama yang Mengajukan</label>
    <input id="namaPengaju" type="text" required>

    <label>Instalasi yang Mengajukan</label>
    <input id="instalasiPengaju" type="text" required>

    <label>Tanggal Pengajuan</label>
    <input id="tanggalPengajuan" type="date" required>

    <div class="section-title">Daftar Barang yang Diajukan</div>

    <div id="items"></div>

    <button class="btn-add" onclick="tambahItem()">+ Tambah Barang</button>

    <button class="btn-submit" onclick="kirimData()">Kirim Pengajuan</button>
</div>


<!-- FIREBASE -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDciAiNKFbh8aoM8joIywSeH9Boml1tK5s",
        authDomain: "aplikasi-jadwal-1d54d.firebaseapp.com",
        databaseURL: "https://aplikasi-jadwal-1d54d-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "aplikasi-jadwal-1d54d",
        storageBucket: "aplikasi-jadwal-1d54d.firebasestorage.app",
        messagingSenderId: "860941812271",
        appId: "1:860941812271:web:458bd63c5b0d2514fcbcda"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let index = 0;

    // ================= TAMBAH ITEM =================
    window.tambahItem = function () {
        let container = document.getElementById("items");

        let html = `
        <div class="item-box" id="item-${index}">
            <label>Nama Barang</label>
            <input type="text" id="namaBarang-${index}" required>

            <label>Jumlah Permintaan</label>
            <input type="number" id="jumlahPermintaan-${index}" required>

            <label>Jumlah Sisa Stok</label>
            <input type="number" id="sisaStok-${index}" required>

            <label>Harga Barang</label>
            <input type="number" id="hargaBarang-${index}" required>

            <label>Keperluan Untuk</label>
            <textarea id="keperluan-${index}"></textarea>

            <button class="btn-delete" onclick="hapusItem(${index})">Hapus Item</button>
        </div>
        `;

        container.insertAdjacentHTML("beforeend", html);
        index++;
    };

    // Tambahkan minimal 1 item
    tambahItem();


    // =============== HAPUS ITEM ===============
    window.hapusItem = function (id) {
        let item = document.getElementById(`item-${id}`);
        if (item) item.remove();
    };


    // =============== KIRIM DATA KE FIREBASE + WA ===============
    window.kirimData = function () {

        let namaPengaju = document.getElementById("namaPengaju").value;
        let instalasiPengaju = document.getElementById("instalasiPengaju").value;
        let tanggalPengajuan = document.getElementById("tanggalPengajuan").value;

        let items = [];
        let teksWA = "";

        for (let i = 0; i < index; i++) {
            let box = document.getElementById(`item-${i}`);
            if (box) {
                let item = {
                    nama_barang: document.getElementById(`namaBarang-${i}`).value,
                    jumlah_permintaan: document.getElementById(`jumlahPermintaan-${i}`).value,
                    sisa_stok: document.getElementById(`sisaStok-${i}`).value,
                    harga_barang: document.getElementById(`hargaBarang-${i}`).value,
                    keperluan: document.getElementById(`keperluan-${i}`).value
                };
                items.push(item);

                teksWA += 
`• ${item.nama_barang} — Qty: ${item.jumlah_permintaan} — Harga: ${item.harga_barang}
`;
            }
        }

        // ====== SIMPAN KE FIREBASE ======
        const newRef = push(ref(db, "pengajuan_barang"));

        set(newRef, {
            nama_pengaju: namaPengaju,
            instalasi: instalasiPengaju,
            tanggal: tanggalPengajuan,
            items: items,
            timestamp: Date.now()
        }).then(() => {

            document.getElementById("notif").style.display = "block";

            // Reset form
            document.querySelectorAll("input, textarea").forEach(el => el.value = "");
            document.getElementById("items").innerHTML = "";
            index = 0;
            tambahItem();

            // =============== KIRIM NOTIFIKASI WHATSAPP ===============
            let nomorWA = "6285720758831";  // << GANTI DENGAN NOMOR TUJUAN

            let pesan = 
`PENGAJUAN BARANG BARU%0A%0A` +
`Nama Pengaju: ${namaPengaju}%0A` +
`Instalasi: ${instalasiPengaju}%0A` +
`Tanggal: ${tanggalPengajuan}%0A%0A` +
`Daftar Barang:%0A` +
encodeURIComponent(teksWA);

            let url = `https://wa.me/${nomorWA}?text=${pesan}`;
            window.open(url, "_blank");
        });
    };

</script>

</body>
</html>
