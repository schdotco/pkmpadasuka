<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📊 Hasil Rekapan Absensi Pegawai</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.19.3/xlsx.full.min.js"></script>
  <style>
    body { background: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    th { background: #1e40af; color: white; position: sticky; top: 0; z-index: 20; font-weight: 600; }
    td, th { border: 1px solid #e5e7eb; text-align: center; padding: 0.5rem 0.75rem; font-size: 0.875rem; }
    tr:nth-child(even) { background: #f9fafb; }
    tr:hover { background: #e0f2fe; transition: 0.2s; }
    .toast { position: fixed; right: 1rem; bottom: 1rem; background: rgba(0,0,0,0.75); color: white; padding: 0.6rem 1rem; border-radius: 0.5rem; z-index: 60; }
  </style>
</head>

<body class="min-h-screen flex flex-col p-4 sm:p-8">
  <div class="flex-1 bg-white shadow-lg rounded-2xl p-6 sm:p-10 w-full max-w-full overflow-hidden">
    <h1 class="text-2xl sm:text-3xl font-bold text-center text-gray-800 mb-8">
      📊 Hasil Rekapan Absensi Pegawai
    </h1>

    <!-- Filter Bulan + Tombol Export -->
    <div class="flex flex-wrap justify-between items-center gap-4 mb-6">
      <div class="flex items-center gap-3">
        <label for="filterBulan" class="font-semibold text-gray-700">Pilih Bulan:</label>
        <select id="filterBulan" class="border border-gray-300 rounded-lg p-2 focus:ring focus:ring-blue-300">
          <option value="">-- Semua Bulan --</option>
        </select>
      </div>
      <div class="flex items-center gap-3">
        <button id="btnExport"
          class="bg-green-600 hover:bg-green-700 text-white font-medium px-5 py-2.5 rounded-lg shadow transition">
          📄 Cetak / Export Excel
        </button>
      </div>
    </div>

    <!-- Tabel Data -->
    <div class="overflow-x-auto rounded-lg border border-gray-200 shadow-inner max-h-[75vh] overflow-y-auto">
      <table id="tabelAbsensi" class="min-w-full text-sm">
        <thead>
          <tr>
            <th>No</th>
            <th>Jenis Pegawai</th>
            <th>Nama Pegawai</th>
            <th>Ak. Terlambat</th>
            <th>Ak. Pulang Cepat</th>
            <th>Ak. Sakit</th>
            <th>Ak. Sakit &gt;3 Hari</th>
            <th>Ak. Hari Kerja</th>
            <th>Telat (Hari)</th>
            <th>Telat (Jam)</th>
            <th>DL &lt;3 Hari</th>
            <th>DL &gt;3 Hari</th>
            <th>CAP</th>
            <th>CT</th>
            <th>CM</th>
            <th>GL</th>
            <th>CTB</th>
            <th>LM</th>
            <th>Pagi</th>
            <th>Siang</th>
            <th>Malam</th>
            <th>Off</th>
            <th>Total Shift</th>
            <th>% Kehadiran</th>
            <th>Bulan</th>
          </tr>
        </thead>
        <tbody id="isiTabel">
          <tr><td colspan="25" class="text-center py-6 text-gray-500">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Toast sederhana -->
  <div id="toast" class="toast" style="display:none;"></div>

  <script type="module">
    import { db } from './app.js';
    import { ref, onValue } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    const isiTabel = document.getElementById('isiTabel');
    const filterBulan = document.getElementById('filterBulan');
    const btnExport = document.getElementById('btnExport');
    const toast = document.getElementById('toast');
    let semuaData = [];

    function showToast(msg, timeout = 3000) {
      toast.textContent = msg;
      toast.style.display = 'block';
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toast.style.display = 'none', timeout);
    }

    // Ambil data realtime dari Firebase
    onValue(ref(db, 'RekapAbsensi'), snapshot => {
      if (!snapshot.exists()) {
        semuaData = [];
        isiTabel.innerHTML = `<tr><td colspan="25" class="text-center py-6 text-gray-500">Belum ada data absensi</td></tr>`;
        filterBulan.innerHTML = `<option value="">-- Semua Bulan --</option>`;
        return;
      }

      // Ambil semua data sebagai array (Object.values memastikan semua entri terbaca)
      const val = snapshot.val();
      if (Array.isArray(val)) {
        semuaData = val.filter(Boolean); // jika array, bersihkan holes
      } else {
        semuaData = Object.values(val);
      }

      renderBulanOptions();
      renderTabel();
    });

    // Buat daftar bulan unik
    function renderBulanOptions() {
      const bulanUnik = [...new Set(semuaData.map(d => d.bulan))].filter(Boolean);
      filterBulan.innerHTML = `<option value="">-- Semua Bulan --</option>`;
      bulanUnik.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b; opt.textContent = b;
        filterBulan.appendChild(opt);
      });
    }

    // Render tabel
    function renderTabel() {
      isiTabel.innerHTML = '';
      const bulanFilter = filterBulan.value;
      const dataTampil = bulanFilter ? semuaData.filter(d => d.bulan === bulanFilter) : semuaData;

      if (dataTampil.length === 0) {
        isiTabel.innerHTML = `<tr><td colspan="25" class="text-center py-6 text-gray-500">Tidak ada data untuk bulan ini</td></tr>`;
        return;
      }

      let no = 1;
      const frag = document.createDocumentFragment();
      dataTampil.forEach(d => {
        const sakit = Number(d.ak_sakit) || 0;
        const sakit3hari = sakit > 3 ? sakit : 0;
        const dlKurang3 = d.dl_kurang3 ?? (Number(d.dl_total) > 0 && Number(d.dl_total) < 3 ? d.dl_total : 0);
        const dlLebih3 = d.dl_lebih3 ?? (Number(d.dl_total) >= 3 ? d.dl_total : 0);

        // Shift parsing
        let LM=0,P=0,S=0,M=0,OFF=0,Total=0;
        if (d.shift) {
          const s = d.shift.split(',');
          s.forEach(pair => {
            const [k,v] = pair.split(':');
            if (!k || v===undefined) return;
            switch(k.trim()){
              case'LM':LM=v;break;
              case'P':P=v;break;
              case'S':S=v;break;
              case'M':M=v;break;
              case'OFF':OFF=v;break;
              case'Total':Total=v;break;
            }
          });
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${no++}</td>
          <td>${d.jenisPegawai || '-'}</td>
          <td class="text-left pl-2">${d.namaPegawai || '-'}</td>
          <td>${d.ak_terlambat || 0}</td>
          <td>${d.ak_pulangCepat || 0}</td>
          <td>${sakit}</td>
          <td>${sakit3hari}</td>
          <td>${d.ak_hariKerja || 0}</td>
          <td>${d.telat_hari || 0}</td>
          <td>${d.telat_jam || 0}</td>
          <td>${dlKurang3}</td>
          <td>${dlLebih3}</td>
          <td>${d.ak_CAP || 0}</td>
          <td>${d.ak_CT || 0}</td>
          <td>${d.ak_CM || 0}</td>
          <td>${d.ak_GL || 0}</td>
          <td>${d.ak_CTB || 0}</td>
          <td>${LM}</td>
          <td>${P}</td>
          <td>${S}</td>
          <td>${M}</td>
          <td>${OFF}</td>
          <td>${Total}</td>
          <td>${d.persenKehadiran || '-'}</td>
          <td>${d.bulan || '-'}</td>
        `;
        frag.appendChild(tr);
      });
      isiTabel.appendChild(frag);
    }

    // Filter change
    filterBulan.addEventListener('change', renderTabel);

    // Export handler — gunakan window.XLSX agar pasti ambil library global
    btnExport.addEventListener('click', () => {
      const XLSX = window.XLSX;
      if (!XLSX) {
        showToast('Library XLSX belum tersedia. Coba refresh halaman.', 4000);
        return;
      }

      try {
        btnExport.disabled = true;
        btnExport.textContent = 'Mengekspor...';

        // Jika ada filter bulan, export hanya baris yang tampil (document.getElementById tabel sudah memuat semua baris)
        const bulan = (filterBulan.value || 'Semua_Bulan').replace(/\s+/g, '_');

        // clone table to avoid issues with sticky headers / scrollers
        const table = document.getElementById('tabelAbsensi');
        const clone = table.cloneNode(true);

        // Convert to workbook and save
        const wb = XLSX.utils.table_to_book(clone, { sheet: `Rekap_${bulan}` });
        XLSX.writeFile(wb, `Rekap_Absensi_${bulan}.xlsx`);

        showToast('✅ Export selesai.', 2000);
      } catch (err) {
        console.error('Export error:', err);
        showToast('❌ Gagal export: ' + (err.message || err), 4000);
      } finally {
        btnExport.disabled = false;
        btnExport.textContent = '📄 Cetak / Export Excel';
      }
    });

  </script>
</body>
</html>
