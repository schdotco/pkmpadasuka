<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hasil Rekapan Absensi Pegawai</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.19.3/xlsx.full.min.js"></script>
  <style>
    body { background: #f3f4f6; font-family: 'Segoe UI', Tahoma, sans-serif; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { padding: 0.5rem 0.75rem; border: 1px solid #ddd; text-align: center; }
    th { background: #2563eb; color: white; position: sticky; top: 0; z-index: 10; }
    tr:nth-child(even) { background: #f9fafb; }
    tbody { max-height: 600px; overflow-y: auto; display: block; }
    table thead, table tbody tr { display: table; width: 100%; table-layout: fixed; }
  </style>
</head>
<body class="p-6">
  <div class="max-w-7xl mx-auto bg-white p-6 rounded-xl shadow">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">📊 Hasil Rekapan Absensi Pegawai</h1>

    <!-- 🔽 Filter Bulan + Tombol Cetak -->
    <div class="flex flex-wrap justify-between items-center mb-5 gap-3">
      <div class="flex items-center gap-3">
        <label for="filterBulan" class="font-semibold text-gray-700">Pilih Bulan:</label>
        <select id="filterBulan" class="border rounded-lg p-2 focus:ring focus:ring-blue-300">
          <option value="">-- Semua Bulan --</option>
        </select>
      </div>
      <button id="btnExport"
        class="bg-green-600 hover:bg-green-700 text-white font-medium px-4 py-2 rounded-lg transition">
        📄 Cetak / Export Excel
      </button>
    </div>

    <!-- 🧾 Tabel Hasil -->
    <div class="overflow-x-auto border rounded-lg">
      <table id="tabelAbsensi">
        <thead>
          <tr>
            <th>No</th>
            <th>Jenis Pegawai</th>
            <th>Nama Pegawai</th>
            <th>Ak. Terlambat</th>
            <th>Ak. Pulang Cepat</th>
            <th>Ak. Sakit</th>
            <th>Ak. Sakit >3 Hari</th>
            <th>Ak. Hari Kerja</th>
            <th>Telat (Hari)</th>
            <th>Telat (Jam)</th>
            <th>DL <3 Hari</th>
            <th>DL >3 Hari</th>
            <th>CAP</th>
            <th>CT</th>
            <th>CM</th>
            <th>GL</th>
            <th>CTB</th>
            <th>LM</th>
            <th>Pagi</th>
            <th>Siang</th>
            <th>Malam</th>
            <th>Off</th>
            <th>Total Shift</th>
            <th>% Kehadiran</th>
            <th>Bulan</th>
          </tr>
        </thead>
        <tbody id="isiTabel">
          <tr><td colspan="25" class="text-center py-4 text-gray-500">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { db } from './app.js';
    import { ref, onValue } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    const isiTabel = document.getElementById('isiTabel');
    const filterBulan = document.getElementById('filterBulan');
    const btnExport = document.getElementById('btnExport');
    let semuaData = [];

    // 🔄 Ambil data realtime dari Firebase
    onValue(ref(db, 'RekapAbsensi'), snapshot => {
      semuaData = [];
      isiTabel.innerHTML = '';
      if (!snapshot.exists()) {
        isiTabel.innerHTML = `<tr><td colspan="25" class="text-center py-4 text-gray-500">Belum ada data absensi</td></tr>`;
        return;
      }

      snapshot.forEach(child => {
        semuaData.push(child.val());
      });

      renderBulanOptions();
      renderTabel();
    });

    // 🔽 Buat daftar bulan unik untuk filter
    function renderBulanOptions() {
      const bulanUnik = [...new Set(semuaData.map(d => d.bulan))].filter(Boolean);
      filterBulan.innerHTML = `<option value="">-- Semua Bulan --</option>`;
      bulanUnik.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b;
        opt.textContent = b;
        filterBulan.appendChild(opt);
      });
    }

    // 🧾 Render tabel utama
    function renderTabel() {
      isiTabel.innerHTML = '';
      const bulanFilter = filterBulan.value;
      const dataTampil = bulanFilter ? semuaData.filter(d => d.bulan === bulanFilter) : semuaData;

      if (dataTampil.length === 0) {
        isiTabel.innerHTML = `<tr><td colspan="25" class="text-center py-4 text-gray-500">Tidak ada data untuk bulan ini</td></tr>`;
        return;
      }

      let no = 1;
      dataTampil.forEach(d => {
        const sakit = Number(d.ak_sakit) || 0;
        const sakit3hari = sakit > 3 ? sakit : 0;
        const dlKurang3 = d.dl_kurang3 ?? (Number(d.dl_total) > 0 && Number(d.dl_total) < 3 ? d.dl_total : 0);
        const dlLebih3 = d.dl_lebih3 ?? (Number(d.dl_total) >= 3 ? d.dl_total : 0);

        // 🔢 Pisahkan data shift
        let LM = 0, P = 0, S = 0, M = 0, OFF = 0, Total = 0;
        if (d.shift) {
          const shiftData = d.shift.split(',');
          shiftData.forEach(pair => {
            const [key, val] = pair.split(':');
            if (!key || !val) return;
            switch (key.trim()) {
              case 'LM': LM = val; break;
              case 'P': P = val; break;
              case 'S': S = val; break;
              case 'M': M = val; break;
              case 'OFF': OFF = val; break;
              case 'Total': Total = val; break;
            }
          });
        }

        const row = `
          <tr>
            <td>${no++}</td>
            <td>${d.jenisPegawai || '-'}</td>
            <td>${d.namaPegawai || '-'}</td>
            <td>${d.ak_terlambat || 0}</td>
            <td>${d.ak_pulangCepat || 0}</td>
            <td>${sakit}</td>
            <td>${sakit3hari}</td>
            <td>${d.ak_hariKerja || 0}</td>
            <td>${d.telat_hari || 0}</td>
            <td>${d.telat_jam || 0}</td>
            <td>${dlKurang3}</td>
            <td>${dlLebih3}</td>
            <td>${d.ak_CAP || 0}</td>
            <td>${d.ak_CT || 0}</td>
            <td>${d.ak_CM || 0}</td>
            <td>${d.ak_GL || 0}</td>
            <td>${d.ak_CTB || 0}</td>
            <td>${LM}</td>
            <td>${P}</td>
            <td>${S}</td>
            <td>${M}</td>
            <td>${OFF}</td>
            <td>${Total}</td>
            <td>${d.persenKehadiran || '-'}</td>
            <td>${d.bulan || '-'}</td>
          </tr>
        `;
        isiTabel.insertAdjacentHTML('beforeend', row);
      });
    }

    // 🔁 Update tabel ketika filter bulan diganti
    filterBulan.addEventListener('change', renderTabel);

    // 📄 Export ke Excel
    btnExport.addEventListener('click', () => {
      const bulanFilter = filterBulan.value || 'Semua Bulan';
      const table = document.getElementById('tabelAbsensi');
      const wb = XLSX.utils.table_to_book(table, { sheet: `Rekap ${bulanFilter}` });
      XLSX.writeFile(wb, `Rekap_Absensi_${bulanFilter}.xlsx`);
    });
  </script>
</body>
</html>
