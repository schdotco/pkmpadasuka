<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard - Data & Informasi UPTD Puskesmas Padasuka</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f6f9;
    }

    /* NAVBAR */
    .navbar {
      background: #1976d2;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
    }
    .navbar h1 {
      font-size: 18px;
      margin: 0;
    }
    .navbar .menu {
      display: flex;
      gap: 15px;
    }
    .navbar .menu a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
    }
    .navbar .menu a:hover {
      text-decoration: underline;
    }
    .navbar button {
      background: #fff;
      color: #1976d2;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    /* DASHBOARD */
    .dashboard {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 15px;
    }
    .dashboard h2 {
      font-size: 20px;
      color: #333;
      margin-bottom: 20px;
    }

    /* CARD GRID */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      transition: transform 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
    }
    .card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
    }
    .card-content {
      padding: 15px;
    }
    .card h3 {
      font-size: 16px;
      color: #1976d2;
      margin: 0 0 8px 0;
    }
    .card p {
      font-size: 13px;
      color: #555;
      margin: 0;
    }
    .card button {
      background: #1976d2;
      color: #fff;
      border: none;
      padding: 10px;
      font-size: 13px;
      cursor: pointer;
      width: 100%;
      margin-top: auto;
    }
    .card button:hover {
      background: #125ca1;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <h1>🏛️ Data & Informasi UPTD Puskesmas Padasuka</h1>
    <div class="menu">
      <a href="dashboard.html">Dashboard</a>
      <a href="profil.html">Profil</a>
      <a href="kalender.html">Kalender</a>
    </div>
     <button onclick="logout()">Logout</button>
  </div>

  <!-- Dashboard -->
  <div class="dashboard">
    <h2>Jadwal Pegawai</h2>
    <div class="card-grid">

      <div class="card">
        <img src="https://via.placeholder.com/300x120?text=PENGAJUAN CUTI" alt="PENGAJUAN CUTI">
        <div class="card-content">
          <h3>Peganjuan Cuti Pegawai</h3>
          <p>Manajemen Kepegawaian UPTD Puskesmas Padasuka</p>
        </div>
        <button onclick="window.location.href='cuti-user.html'">Masuk</button>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/300x120?text=LIST CUTI" alt="LIST CUTI">
        <div class="card-content">
          <h3>List Cuti Pegawai</h3>
          <p>Manajemen Kepegawaian UPTD Puskesmas Padasuka</p>
        </div>
        <button onclick="location.href='cuti-list.html'">Masuk</button>
      </div>

    </div>
  </div>

  <script>
        // 🔒 Cek status login
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        // jika belum login arahkan ke login.html
        window.location.href = "login.html";
      } else {
        console.log("✅ Login sebagai:", user.email);
      }
    });

    
    function logout() {
      // Arahkan ke halaman Login
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
