<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📝 Pengajuan Cuti Pegawai</title>

  <!-- Choices.js untuk dropdown searchable -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #f4f6f9;
      margin: 0;
    }
    .navbar {
      background: #1976d2;
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .navbar a {
      color: white;
      text-decoration: none;
      margin-right: 15px;
    }
    .navbar a:hover {
      text-decoration: underline;
    }
    main {
      max-width: 500px;
      background: white;
      padding: 20px;
      margin: 30px auto;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    h2 {
      color: #1976d2;
      margin-top: 0;
    }
    label {
      display: block;
      margin-top: 12px;
      font-weight: 600;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 14px;
      box-sizing: border-box;
    }
    button {
      background: #1976d2;
      color: white;
      border: none;
      padding: 10px 15px;
      margin-top: 15px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
    }
    button:hover {
      background: #125ca1;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <div>🏛️ UPTD Puskesmas Padasuka</div>
    <div>
      <a href="dashboard.html">Dashboard</a>
      <a href="cuti-list.html">Daftar Cuti</a>
    </div>
  </div>

  <!-- Form Pengajuan -->
  <main>
    <h2>📝 Pengajuan Cuti Pegawai</h2>
    <form id="formCuti">
      <label>Nama Pegawai</label>
      <select id="namaPegawai" required>
        <option value="">-- Pilih Pegawai --</option>
      </select>

      <label>Jenis Cuti</label>
      <select id="jenisCuti" required>
        <option value="">-- Pilih Jenis Cuti --</option>
        <option value="Cuti Tahunan">Cuti Tahunan</option>
        <option value="Cuti Sakit">Cuti Sakit</option>
        <option value="Cuti Melahirkan">Cuti Melahirkan</option>
        <option value="Cuti Lainnya">Cuti Lainnya</option>
      </select>

      <label>Tanggal Mulai</label>
      <input type="date" id="tanggalMulai" required>

      <label>Tanggal Selesai</label>
      <input type="date" id="tanggalSelesai" required>

      <label>Keterangan</label>
      <textarea id="keterangan" placeholder="Contoh: keperluan keluarga..." rows="3"></textarea>

      <button type="submit">Kirim Pengajuan</button>
    </form>
  </main>

<script type="module">
import { db } from './app.js';
import { ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.3/firebase-database.js";

// Ambil daftar pegawai dari Firebase
const namaSelect = document.getElementById('namaPegawai');
onValue(ref(db, 'Pegawai'), (snapshot) => {
  namaSelect.innerHTML = `<option value="">-- Pilih Pegawai --</option>`;
  snapshot.forEach(child => {
    const data = child.val();
    const nama = data.gelar ? `${data.nama} ${data.gelar}` : data.nama;
    const opt = document.createElement('option');
    opt.value = nama;
    opt.textContent = nama;
    namaSelect.appendChild(opt);
  });
  // Aktifkan dropdown dengan search
  new Choices(namaSelect, {
    searchEnabled: true,
    shouldSort: false,
    itemSelectText: '',
    searchPlaceholderValue: 'Cari nama pegawai...',
  });
});

// Simpan pengajuan ke database
document.getElementById('formCuti').addEventListener('submit', async (e) => {
  e.preventDefault();
  const nama = namaSelect.value;
  const jenisCuti = document.getElementById('jenisCuti').value;
  const tanggalMulai = document.getElementById('tanggalMulai').value;
  const tanggalSelesai = document.getElementById('tanggalSelesai').value;
  const keterangan = document.getElementById('keterangan').value;

  if (!nama || !jenisCuti || !tanggalMulai || !tanggalSelesai) {
    alert('⚠️ Lengkapi semua data!');
    return;
  }

  const cutiRef = push(ref(db, 'pengajuan_cuti'));
  await set(cutiRef, {
    id: cutiRef.key,
    nama,
    jenisCuti,
    tanggalMulai,
    tanggalSelesai,
    keterangan,
    status: 'Menunggu Persetujuan',
    dibuatPada: new Date().toISOString()
  });

  alert('✅ Pengajuan cuti berhasil dikirim!');
  e.target.reset();
});
</script>

</body>
</html>
